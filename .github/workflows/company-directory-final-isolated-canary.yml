name: Final isolated company directory canary

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

concurrency:
  group: company-directory-final-isolated-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Re-evaluate one queued company on final isolated Preview
    if: github.event.head_commit.message == 'Run final isolated company directory canary'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PREVIEW_ORIGIN: https://proffera-jhap-git-work-proffera-company-profile-engine-wzardmn.vercel.app
      CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
    steps:
      - name: Fail closed on configuration
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          case "$PREVIEW_ORIGIN" in
            https://proffera-jhap-git-work-proffera-company-profile-engine-wzardmn.vercel.app) ;;
            *) echo "Unexpected Preview origin" >&2; exit 1 ;;
          esac

      - name: Verify isolated Preview discovery mode
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-final-isolated-canary" \
            "$PREVIEW_ORIGIN/api/cron/company-directory-discovery-ingest" \
            | tee /tmp/probe.json
          python - <<'PY'
          import json
          with open('/tmp/probe.json', encoding='utf-8') as f:
              payload = json.load(f)
          if payload.get('ok') is not True or payload.get('enabled') is not True or payload.get('mode') != 'automatic':
              raise SystemExit(f"Preview discovery is not safely enabled: {payload}")
          PY

      - name: Process one bounded queue batch
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 75 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-final-isolated-canary" \
            "$PREVIEW_ORIGIN/api/cron/company-directory-sync"
