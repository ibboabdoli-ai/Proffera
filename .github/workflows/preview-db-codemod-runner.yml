name: Preview DB codemod runner

on:
  push:
    branches:
      - chore/preview-db-codemod-runner-20260807

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/preview-auth-secret
          fetch-depth: 0

      - name: Isolate customer portal secret in Preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import urllib.request

          path = Path("src/lib/customer-calendar.ts")
          text = path.read_text()
          old_import = 'import { resolveDatabaseUrl } from "@/lib/db/database-url";\n'
          new_import = 'import { resolveCustomerPortalSecret } from "@/lib/auth-secret";\nimport { resolveDatabaseUrl } from "@/lib/db/database-url";\n'
          old_secret = 'const portalSecret = process.env.CUSTOMER_PORTAL_SECRET ?? process.env.BETTER_AUTH_SECRET ?? process.env.AUTH_SECRET;'
          new_secret = 'const portalSecret = resolveCustomerPortalSecret();'

          if old_import not in text or old_secret not in text:
              raise SystemExit("Expected customer calendar secret pattern not found")

          updated = text.replace(old_import, new_import, 1).replace(old_secret, new_secret, 1)
          if "process.env.CUSTOMER_PORTAL_SECRET" in updated or "process.env.BETTER_AUTH_SECRET" in updated or "process.env.AUTH_SECRET" in updated:
              raise SystemExit("Direct Production secret access still exists in customer-calendar.ts")
          path.write_text(updated)

          body = json.dumps({"content": updated, "encoding": "utf-8"}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/git/blobs",
              data=body,
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print("BLOB", path, result["sha"])
          PY
