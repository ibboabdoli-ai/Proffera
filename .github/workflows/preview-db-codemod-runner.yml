name: Preview DB codemod runner

on:
  push:
    branches:
      - chore/preview-db-codemod-runner-20260807

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/preview-auth-secret
          fetch-depth: 0

      - name: Repair resolver suffix and verify isolation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re
          import urllib.request

          root = Path("src")
          allowed = Path("src/lib/db/database-url.ts")
          db_keys = r"(?:DATABASE_URL|POSTGRES_URL|POSTGRES_PRISMA_URL|POSTGRES_URL_NON_POOLING|DATABASE_URL_UNPOOLED)"
          direct = re.compile(rf"process\.env\.(?:{db_keys})(?![A-Z0-9_])")
          malformed = re.compile(r"resolveDatabaseUrl\(\)_[A-Z0-9_]+")
          changed = []

          for path in sorted(root.rglob("*.ts")) + sorted(root.rglob("*.tsx")):
              text = path.read_text()
              updated = text.replace("resolveDatabaseUrl()_NON_POOLING", "resolveDatabaseUrl()")
              updated = updated.replace("resolveDatabaseUrl()_UNPOOLED", "resolveDatabaseUrl()")
              if updated != text:
                  path.write_text(updated)
                  changed.append(path)

          offenders = []
          malformed_files = []
          for path in sorted(root.rglob("*.ts")) + sorted(root.rglob("*.tsx")):
              text = path.read_text()
              if path != allowed and direct.search(text):
                  offenders.append(str(path))
              if malformed.search(text):
                  malformed_files.append(str(path))

          print("CHANGED_COUNT", len(changed))
          for path in changed:
              print("CHANGED", path)
          print("OFFENDER_COUNT", len(offenders))
          print("MALFORMED_COUNT", len(malformed_files))
          if offenders:
              print("OFFENDERS", json.dumps(offenders))
              raise SystemExit(2)
          if malformed_files:
              print("MALFORMED", json.dumps(malformed_files))
              raise SystemExit(3)

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GH_REPOSITORY"]
          for path in changed:
              body = json.dumps({"content": path.read_text(), "encoding": "utf-8"}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs",
                  data=body,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req) as response:
                  result = json.load(response)
              print("BLOB", path, result["sha"])
          PY
