name: PR 881 CodeQL diagnostic

on:
  push:
    branches:
      - work/proffera-dashboard-human-ux

permissions:
  contents: read
  checks: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CodeQL check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs/105865223494/annotations" \
            | jq .
