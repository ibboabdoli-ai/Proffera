name: Temporary PostHog final validation

on:
  push:
    branches:
      - work/proffera-posthog-privacy-safe-analytics

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/proffera-posthog-privacy-safe-analytics
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused PostHog tests
        run: npx vitest run tests/posthog-analytics-privacy.test.ts

      - name: Full tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check 6d8faaa27dc8ef324f1b8225d37d06ae5b9142fb...HEAD
