name: Temporary sole-trader match diagnostic

on:
  push:
    branches:
      - work/proffera-sole-trader-match-diagnostic

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-match-diagnostic
          fetch-depth: 0
      - name: Apply privacy-safe diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/company-directory-sole-trader-owner.ts')
          text = source.read_text()
          old = '''function responseIdentityDiagnostic(value: unknown) {
  const digits = String(value ?? "").replace(/\\D/g, "");
  const normalized10 = responseIdentity10(value);
  const fingerprint = normalized10
    ? createHash("sha256").update(`${ACCEPTANCE2_IDENTITY_FINGERPRINT_PREFIX}${normalized10}`).digest("hex")
    : "";
  return {
    state: normalized10 ? "different" : "missing",
    shape: !digits ? "missing" : digits.length === 12 ? "12_digit" : digits.length === 10 ? "10_digit" : "other",
    knownAcceptance2Identity: Boolean(fingerprint && ACCEPTANCE2_PERSON_IDENTITY_FINGERPRINTS.has(fingerprint)),
  };
}
'''
          new = '''function responseIdentityDiagnostic(value: unknown, requestedIdentity10: string) {
  const digits = String(value ?? "").replace(/\\D/g, "");
  const normalized10 = responseIdentity10(value);
  const fingerprint = normalized10
    ? createHash("sha256").update(`${ACCEPTANCE2_IDENTITY_FINGERPRINT_PREFIX}${normalized10}`).digest("hex")
    : "";
  return {
    state: !normalized10
      ? "missing"
      : normalized10 === requestedIdentity10
        ? "matches_requested"
        : "different",
    shape: !digits ? "missing" : digits.length === 12 ? "12_digit" : digits.length === 10 ? "10_digit" : "other",
    knownAcceptance2Identity: Boolean(fingerprint && ACCEPTANCE2_PERSON_IDENTITY_FINGERPRINTS.has(fingerprint)),
  };
}
'''
          if text.count(old) != 1:
              raise SystemExit('expected one source diagnostic block')
          text = text.replace(old, new, 1)
          old_call = '...responseIdentityDiagnostic(identityValue(row)),'
          new_call = '...responseIdentityDiagnostic(identityValue(row), requestedIdentity10),'
          if text.count(old_call) != 1:
              raise SystemExit('expected one diagnostic call')
          text = text.replace(old_call, new_call, 1)
          source.write_text(text)

          test = Path('tests/company-directory-sole-trader-owner.test.ts')
          t = test.read_text()
          anchor = '''  it("preserves the provider's first valid SNI instead of promoting a supported secondary SNI", async () => {'''
          addition = '''  it("separates an exact identity value from an unsupported identity type", async () => {\n    const { query } = createSqlMock();\n    mocks.getSql.mockReturnValue(query);\n    const warn = vi.spyOn(console, "warn").mockImplementation(() => undefined);\n    vi.stubGlobal("fetch", vi.fn().mockResolvedValue({\n      ok: true,\n      json: async () => ({\n        organisationer: [officialRecord({\n          organisationsidentitet: {\n            identitetsbeteckning: PRIVATE_OFFICIAL,\n            typ: { kod: "ORGANISATIONSNUMMER" },\n          },\n        })],\n      }),\n    }));\n\n    await expect(onboardOwnerSoleTrader(PRIVATE_INPUT)).rejects.toThrow("sole_trader_source_error");\n    expect(warn).toHaveBeenCalledWith(\n      "Sole-trader official verification failed",\n      expect.objectContaining({\n        reason: "no_identity_match",\n        identityStates: ["matches_requested"],\n        identityTypeStates: ["other"],\n        identityShapeStates: ["12_digit"],\n        knownAcceptance2Identity: "no",\n      }),\n    );\n    const logged = JSON.stringify(warn.mock.calls);\n    expect(logged).not.toContain(PRIVATE_INPUT);\n    expect(logged).not.toContain(PRIVATE_OFFICIAL);\n    expect(query.transaction).not.toHaveBeenCalled();\n  });\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('expected one test anchor')
          t = t.replace(anchor, addition + anchor, 1)
          test.write_text(t)
          PY
          rm .github/workflows/temp-sole-trader-match-diagnostic.yml
          git diff --check
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company-directory-sole-trader-owner.ts tests/company-directory-sole-trader-owner.test.ts .github/workflows/temp-sole-trader-match-diagnostic.yml
          git commit -m 'Clarify sole-trader identity mismatch diagnostics'
          git push origin HEAD:work/proffera-sole-trader-match-diagnostic
