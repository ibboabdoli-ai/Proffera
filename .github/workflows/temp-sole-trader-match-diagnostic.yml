name: Temporary sole-trader match diagnostic

on:
  push:
    branches:
      - work/proffera-sole-trader-match-diagnostic

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-match-diagnostic
          fetch-depth: 0
      - name: Apply privacy-safe diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          source = Path('src/lib/company-directory-sole-trader-owner.ts')
          text = source.read_text()
          replacements = [
              ('function responseIdentityDiagnostic(value: unknown) {', 'function responseIdentityDiagnostic(value: unknown, requestedIdentity10: string) {'),
              ('    state: normalized10 ? "different" : "missing",', '    state: !normalized10 ? "missing" : normalized10 === requestedIdentity10 ? "matches_requested" : "different",'),
              ('      ...responseIdentityDiagnostic(identityValue(row)),', '      ...responseIdentityDiagnostic(identityValue(row), requestedIdentity10),'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one source match for: {old}')
              text = text.replace(old, new, 1)
          source.write_text(text)

          test = Path('tests/company-directory-sole-trader-owner.test.ts')
          t = test.read_text()
          anchor = '  it("preserves the provider\'s first valid SNI instead of promoting a supported secondary SNI", async () => {'
          encoded = ''
          addition = base64.b64decode(encoded).decode()
          if t.count(anchor) != 1:
              raise SystemExit('expected one test anchor')
          t = t.replace(anchor, addition + anchor, 1)
          test.write_text(t)
          PY
          rm .github/workflows/temp-sole-trader-match-diagnostic.yml
          git diff --check
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company-directory-sole-trader-owner.ts tests/company-directory-sole-trader-owner.test.ts .github/workflows/temp-sole-trader-match-diagnostic.yml
          git commit -m 'Clarify sole-trader identity mismatch diagnostics'
          git push origin HEAD:work/proffera-sole-trader-match-diagnostic
