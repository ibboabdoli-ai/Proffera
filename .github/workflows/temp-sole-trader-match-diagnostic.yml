name: Temporary sole-trader match diagnostic

on:
  push:
    branches:
      - work/proffera-sole-trader-match-diagnostic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-match-diagnostic
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply privacy-safe diagnostic patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/company-directory-sole-trader-owner.ts')
          text = source.read_text()
          old = '''function responseIdentityDiagnostic(value: unknown) {
  const digits = String(value ?? "").replace(/\\D/g, "");
  const normalized10 = responseIdentity10(value);
  const fingerprint = normalized10
    ? createHash("sha256").update(`${ACCEPTANCE2_IDENTITY_FINGERPRINT_PREFIX}${normalized10}`).digest("hex")
    : "";
  return {
    state: normalized10 ? "different" : "missing",
    shape: !digits ? "missing" : digits.length === 12 ? "12_digit" : digits.length === 10 ? "10_digit" : "other",
    knownAcceptance2Identity: Boolean(fingerprint && ACCEPTANCE2_PERSON_IDENTITY_FINGERPRINTS.has(fingerprint)),
  };
}
'''
          new = '''function responseIdentityDiagnostic(value: unknown, requestedIdentity10: string) {
  const digits = String(value ?? "").replace(/\\D/g, "");
  const normalized10 = responseIdentity10(value);
  const fingerprint = normalized10
    ? createHash("sha256").update(`${ACCEPTANCE2_IDENTITY_FINGERPRINT_PREFIX}${normalized10}`).digest("hex")
    : "";
  return {
    state: !normalized10
      ? "missing"
      : normalized10 === requestedIdentity10
        ? "matches_requested"
        : "different",
    shape: !digits ? "missing" : digits.length === 12 ? "12_digit" : digits.length === 10 ? "10_digit" : "other",
    knownAcceptance2Identity: Boolean(fingerprint && ACCEPTANCE2_PERSON_IDENTITY_FINGERPRINTS.has(fingerprint)),
  };
}
'''
          if old not in text:
              raise SystemExit('source diagnostic block not found')
          text = text.replace(old, new, 1)
          old_call = '...responseIdentityDiagnostic(identityValue(row)),'
          new_call = '...responseIdentityDiagnostic(identityValue(row), requestedIdentity10),'
          if old_call not in text:
              raise SystemExit('diagnostic call not found')
          text = text.replace(old_call, new_call, 1)
          source.write_text(text)

          test = Path('tests/company-directory-sole-trader-owner.test.ts')
          t = test.read_text()
          anchor = '''  it("preserves the provider's first valid SNI instead of promoting a supported secondary SNI", async () => {
'''
          addition = '''  it("separates an exact identity value from an unsupported identity type", async () => {
    const { query } = createSqlMock();
    mocks.getSql.mockReturnValue(query);
    const warn = vi.spyOn(console, "warn").mockImplementation(() => undefined);
    vi.stubGlobal("fetch", vi.fn().mockResolvedValue({
      ok: true,
      json: async () => ({
        organisationer: [officialRecord({
          organisationsidentitet: {
            identitetsbeteckning: PRIVATE_OFFICIAL,
            typ: { kod: "ORGANISATIONSNUMMER" },
          },
        })],
      }),
    }));

    await expect(onboardOwnerSoleTrader(PRIVATE_INPUT)).rejects.toThrow("sole_trader_source_error");
    expect(warn).toHaveBeenCalledWith(
      "Sole-trader official verification failed",
      expect.objectContaining({
        reason: "no_identity_match",
        identityStates: ["matches_requested"],
        identityTypeStates: ["other"],
        identityShapeStates: ["12_digit"],
        knownAcceptance2Identity: "no",
      }),
    );
    const logged = JSON.stringify(warn.mock.calls);
    expect(logged).not.toContain(PRIVATE_INPUT);
    expect(logged).not.toContain(PRIVATE_OFFICIAL);
    expect(query.transaction).not.toHaveBeenCalled();
  });

'''
          if anchor not in t:
              raise SystemExit('test anchor not found')
          t = t.replace(anchor, addition + anchor, 1)
          test.write_text(t)
          PY
          rm .github/workflows/temp-sole-trader-match-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company-directory-sole-trader-owner.ts tests/company-directory-sole-trader-owner.test.ts .github/workflows/temp-sole-trader-match-diagnostic.yml
          git commit -m 'Clarify sole-trader identity mismatch diagnostics'
          git push origin HEAD:work/proffera-sole-trader-match-diagnostic
