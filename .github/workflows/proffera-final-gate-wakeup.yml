name: Proffera final gate wakeup

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose final gate should be re-evaluated
        required: true
        type: string

permissions: {}

concurrency:
  group: proffera-final-gate-wakeup-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  wake-final-gate:
    name: Wake final gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
        (github.actor == 'coderabbitai[bot]' || github.actor == 'chatgpt-codex-connector[bot]')) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.actor == 'coderabbitai[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      pull-requests: read

    steps:
      - name: Re-run only the exact-head final gate when review evidence changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_REVIEW_STATE: ${{ github.event.review.state }}
          EVENT_REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          summary() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          pr_number="${EVENT_PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_number="${EVENT_ISSUE_NUMBER:-}"
          fi
          if [ -z "$pr_number" ]; then
            pr_number="${INPUT_PR_NUMBER:-}"
          fi

          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "No valid pull request number is available; nothing to wake."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request_review" ] && [ "${EVENT_REVIEW_STATE:-}" = "changes_requested" ]; then
            echo "A blocking review does not need a final-gate rerun."
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if ! grep -Eqi 'recent_review_start|Review limit reached|Review rate limited|Action not completed: Review rate limited|Review skipped|temporarily unavailable|service unavailable' <<< "${EVENT_COMMENT_BODY:-}"; then
              echo "CodeRabbit comment does not carry final-review or availability evidence; ignoring it."
              exit 0
            fi
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
          pr_state="$(jq -r '.state' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          head_sha="$(jq -r '.head.sha' <<< "$pr_json")"

          if [ "$pr_state" != "open" ] || [ "$is_draft" = "true" ]; then
            echo "PR #$pr_number is not an open ready PR; nothing to wake."
            exit 0
          fi
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Current PR head is invalid; refusing to re-run anything."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request_review" ] \
            && [ -n "${EVENT_REVIEW_COMMIT:-}" ] \
            && [ "$EVENT_REVIEW_COMMIT" != "$head_sha" ]; then
            echo "Review targets stale commit $EVENT_REVIEW_COMMIT; current head is $head_sha."
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ] \
            && grep -Fq '<!-- recent_review_start -->' <<< "${EVENT_COMMENT_BODY:-}" \
            && ! grep -Fq "$head_sha" <<< "${EVENT_COMMENT_BODY:-}"; then
            echo "CodeRabbit summary does not reference the current head; ignoring stale evidence."
            exit 0
          fi

          runs_json="$(
            gh api --paginate \
              "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&per_page=100" \
              --jq '.workflow_runs[]' \
              | jq -s --arg sha "$head_sha" '[.[] | select(.head_sha == $sha)] | sort_by(.created_at)'
          )"
          run_id="$(jq -r 'last | .id // empty' <<< "$runs_json")"

          if ! [[ "$run_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "No CI run exists for exact current head $head_sha; nothing to re-run."
            exit 0
          fi

          jobs_json="$(
            gh api --paginate \
              "repos/$REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              --jq '.jobs[]' \
              | jq -s '.'
          )"

          require_success() {
            local name="$1"
            local conclusion
            conclusion="$(jq -r --arg name "$name" '[.[] | select(.name == $name and .conclusion == "success")] | sort_by(.run_attempt // 0, .id) | last | .conclusion // empty' <<< "$jobs_json")"
            if [ "$conclusion" != "success" ]; then
              echo "Prerequisite '$name' has no successful exact-head attempt; final gate will not be re-run."
              exit 0
            fi
          }

          require_success "Validate"
          require_success "AI review route"
          require_success "E2E public smoke run"

          final_job_json="$(jq -c '[.[] | select(.name == "E2E public smoke")] | sort_by(.run_attempt // 0, .id) | last // {}' <<< "$jobs_json")"
          final_job_id="$(jq -r '.id // empty' <<< "$final_job_json")"
          final_status="$(jq -r '.status // empty' <<< "$final_job_json")"
          final_conclusion="$(jq -r '.conclusion // empty' <<< "$final_job_json")"

          if ! [[ "$final_job_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Exact-head CI run has no final E2E public smoke job; refusing to re-run anything."
            exit 1
          fi

          if [ "$final_status" != "completed" ]; then
            echo "Final gate is already active ($final_status); no duplicate rerun requested."
            exit 0
          fi
          if [ "$final_conclusion" = "success" ]; then
            echo "Final gate already succeeded for exact head $head_sha."
            exit 0
          fi
          case "$final_conclusion" in
            failure|cancelled)
              ;;
            *)
              echo "Final gate concluded as '$final_conclusion'; refusing an automatic rerun."
              exit 0
              ;;
          esac

          gh api --method POST "repos/$REPOSITORY/actions/jobs/$final_job_id/rerun" >/dev/null

          summary "## Final gate wakeup"
          summary ""
          summary "- PR: #$pr_number"
          summary "- Exact head: $head_sha"
          summary "- CI run: $run_id"
          summary "- Re-run job: E2E public smoke ($final_job_id)"
          summary "- Heavy CI jobs were not re-run."
          echo "Re-ran only the exact-head E2E public smoke final gate after review evidence changed."
