name: Temporary PR 778 source fix

on:
  push:
    branches:
      - work/proffera-sole-trader-production-oauth-host

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-production-oauth-host
          fetch-depth: 0
      - name: Patch canonical Production OAuth host
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/company-directory-sole-trader-owner.ts')
          text = path.read_text()
          old = 'const PRODUCTION_SOLE_TRADER_TOKEN_URL = "https://gw.api.bolagsverket.se/oauth2/token";'
          new = 'const PRODUCTION_SOLE_TRADER_TOKEN_URL = "https://portal.api.bolagsverket.se/oauth2/token";'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one canonical token URL to replace, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -F 'const PRODUCTION_SOLE_TRADER_TOKEN_URL = "https://portal.api.bolagsverket.se/oauth2/token";' src/lib/company-directory-sole-trader-owner.ts
          rm .github/workflows/temp-fix-778.yml
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company-directory-sole-trader-owner.ts .github/workflows/temp-fix-778.yml
          git commit -m 'Fix sole-trader Production OAuth host'
          git push origin HEAD:work/proffera-sole-trader-production-oauth-host
