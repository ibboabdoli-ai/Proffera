name: PrimeView booking details worker

on:
  push:
    branches:
      - feature/primeview-booking-property-details
    paths:
      - scripts/_apply_primeview_booking_details.py
      - .github/workflows/primeview-booking-details-worker.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/primeview-booking-property-details
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact booking changes
        run: python3 scripts/_apply_primeview_booking_details.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Commit validated changes
        run: |
          rm scripts/_apply_primeview_booking_details.py
          rm .github/workflows/primeview-booking-details-worker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand PrimeView booking property details"
          git push origin HEAD:feature/primeview-booking-property-details
