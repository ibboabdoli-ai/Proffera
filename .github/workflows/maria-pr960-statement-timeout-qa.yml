# One-off isolated PostgreSQL QA on draft Maria PR #960; remove after verification.
name: Maria PR960 bounded schema timeout QA
on:
  push:
    branches: [work/proffera-maria-manual-calendar-957]
    paths:
      - .github/workflows/maria-pr960-statement-timeout-qa.yml
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Assert statement timeouts are armed before the DDL
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const sql = readFileSync('db/migrations/20261105_0073_public_booking_verification_contact_fields.sql', 'utf8');
          const body = sql.replace(/^--.*$/gm, '').trim();
          assert.match(body, /^SET statement_timeout = '30s';\s*SET lock_timeout = '5s';\s*ALTER TABLE public_booking_verifications/s);
          assert.match(body, /RESET lock_timeout;\s*RESET statement_timeout;\s*$/s);
          assert.doesNotMatch(body, /set_config\('statement_timeout'/);
          console.log('DDL timeout ordering contract PASS');
          JS
      - name: Run canonical migrations and Maria closed-start integration tests in real isolated PostgreSQL
        env:
          PROFFERA_POSTGRES_INTEGRATION: "1"
        run: ./node_modules/.bin/vitest run tests/maria-manual-calendar-postgres.integration.test.ts --reporter=dot
