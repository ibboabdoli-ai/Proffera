name: PrimeView booking details retry

on:
  push:
    branches:
      - feature/primeview-booking-property-details
    paths:
      - .github/workflows/primeview-booking-details-retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/primeview-booking-property-details
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair and apply exact booking changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_primeview_booking_details.py')
          text = p.read_text()
          bad = "    '    `Pricing: ${pricingResultSummary(price)}`,\n)"
          good = "    '    `Pricing: ${pricingResultSummary(price)}`,',\n)"
          if bad not in text:
              raise SystemExit('expected repair target not found')
          p.write_text(text.replace(bad, good, 1))
          PY
          python3 -m py_compile scripts/_apply_primeview_booking_details.py
          python3 scripts/_apply_primeview_booking_details.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Commit validated changes
        run: |
          rm scripts/_apply_primeview_booking_details.py
          rm .github/workflows/primeview-booking-details-worker.yml
          rm .github/workflows/primeview-booking-details-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand PrimeView booking property details"
          git push origin HEAD:feature/primeview-booking-property-details
