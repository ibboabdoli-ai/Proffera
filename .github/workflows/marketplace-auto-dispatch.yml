name: Marketplace auto dispatch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-auto-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Marketplace invitation waves
    if: vars.MARKETPLACE_AUTO_DISPATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify scheduler configuration
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$REMINDER_CRON_URL"
          test -n "$CRON_SECRET"

      - name: Resolve protected Marketplace endpoint
        id: endpoint
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import urllib.parse

          url = urllib.parse.urlparse(os.environ["REMINDER_CRON_URL"])
          if url.scheme != "https" or not url.netloc:
              raise SystemExit("PROFFERA_REMINDER_CRON_URL must be an HTTPS URL")

          host = url.netloc.lower()
          if host in {"proffera.se", "www.proffera.se"}:
              host = "www.proffera.se"
          origin = f"https://{host}"
          print(f"dispatch_url={origin}/api/cron/marketplace-auto-dispatch")
          PY

      - name: Run bounded automatic Marketplace dispatch
        env:
          DISPATCH_URL: ${{ steps.endpoint.outputs.dispatch_url }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          curl --fail-with-body --silent --show-error \
            --request POST \
            --connect-timeout 10 \
            --max-time 55 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-marketplace-auto-dispatch" \
            "$DISPATCH_URL" > "$RESPONSE_FILE"

          python - "$RESPONSE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          if payload.get("ok") is not True:
              raise SystemExit(f"Marketplace auto dispatch failed: {payload.get('code') or 'unknown'}")

          print(
              "Marketplace auto dispatch:",
              f"scanned={payload.get('scanned', 0)}",
              f"considered={payload.get('considered', 0)}",
              f"attempted={payload.get('attempted', 0)}",
              f"sent={payload.get('sent', 0)}",
              f"failures={payload.get('failures', 0)}",
              f"deadline={payload.get('stoppedByDeadline', False)}",
          )
          PY
