name: Company directory pilot

on:
  workflow_dispatch:
    inputs:
      organization_number:
        description: "Swedish organization number for one new pending candidate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: company-directory-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Process one new company directory candidate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify scheduler configuration
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
          ORGANIZATION_NUMBER: ${{ inputs.organization_number }}
        run: |
          set -euo pipefail
          test -n "$REMINDER_CRON_URL"
          test -n "$CRON_SECRET"
          test -n "$ORGANIZATION_NUMBER"

      - name: Process one targeted new-company pilot
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
          ORGANIZATION_NUMBER: ${{ inputs.organization_number }}
        run: |
          set -euo pipefail
          ORIGIN="$(python - <<'PY'
          import os
          import urllib.parse

          url = urllib.parse.urlparse(os.environ["REMINDER_CRON_URL"])
          if url.scheme != "https" or not url.netloc:
              raise SystemExit("PROFFERA_REMINDER_CRON_URL must be an HTTPS URL")

          host = url.netloc.lower()
          if host in {"proffera.se", "www.proffera.se"}:
              host = "www.proffera.se"
          print(f"https://{host}")
          PY
          )"
          TARGET_QUERY="$(python - <<'PY'
          import os
          import urllib.parse

          print(urllib.parse.urlencode({"organization_number": os.environ["ORGANIZATION_NUMBER"]}))
          PY
          )"
          PILOT_URL="$ORIGIN/api/cron/company-directory-pilot?$TARGET_QUERY"

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 75 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-github-actions" \
            "$PILOT_URL"
