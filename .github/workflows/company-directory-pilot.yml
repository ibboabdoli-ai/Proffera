name: Company directory pilot

on:
  workflow_dispatch:
    inputs:
      organization_number:
        description: "Swedish organization number for one new pending candidate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: company-directory-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Process one new company directory candidate
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify scheduler configuration
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
          ORGANIZATION_NUMBER: ${{ inputs.organization_number }}
        run: |
          set -euo pipefail
          test -n "$REMINDER_CRON_URL"
          test -n "$CRON_SECRET"
          test -n "$ORGANIZATION_NUMBER"

      - name: Process one targeted new-company pilot
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
          ORGANIZATION_NUMBER: ${{ inputs.organization_number }}
        run: |
          set -euo pipefail
          ORIGIN="$(python - <<'PY'
          import os
          import urllib.parse

          url = urllib.parse.urlparse(os.environ["REMINDER_CRON_URL"])
          if url.scheme != "https" or not url.netloc:
              raise SystemExit("PROFFERA_REMINDER_CRON_URL must be an HTTPS URL")

          host = url.netloc.lower()
          if host in {"proffera.se", "www.proffera.se"}:
              host = "www.proffera.se"
          print(f"https://{host}")
          PY
          )"
          TARGET_QUERY="$(python - <<'PY'
          import os
          import urllib.parse

          print(urllib.parse.urlencode({"organization_number": os.environ["ORGANIZATION_NUMBER"]}))
          PY
          )"
          PILOT_URL="$ORIGIN/api/cron/company-directory-pilot?$TARGET_QUERY"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 75 \
            --output "$RESPONSE_FILE" \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-github-actions" \
            "$PILOT_URL"

          python - "$RESPONSE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response_file:
              payload = json.load(response_file)

          if payload.get("ok") is not True:
              raise SystemExit("Company Directory pilot response was not ok")
          if payload.get("skipped") is True:
              raise SystemExit(f"Company Directory pilot was skipped: {payload.get('reason', 'unknown reason')}")
          if payload.get("claimed") != 1 or payload.get("processed") != 1:
              raise SystemExit(
                  "Company Directory pilot must claim and process exactly one candidate "
                  f"(claimed={payload.get('claimed')}, processed={payload.get('processed')})"
              )
          if payload.get("errors", 0) != 0:
              raise SystemExit(f"Company Directory pilot reported {payload.get('errors')} error(s)")

          print("Company Directory pilot processed exactly one candidate successfully")
          PY