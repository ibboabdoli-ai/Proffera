name: Probe official company directory source

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

jobs:
  probe:
    name: Reproduce Bolagsverket bulk download integrity
    if: github.event.head_commit.message == 'Probe official company directory source'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare urllib full download with official size
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import urllib.request
          import zipfile
          from pathlib import Path

          url='https://vardefulla-datamangder.bolagsverket.se/bolagsverket/bolagsverket_bulkfil.zip'
          path=Path('/tmp/bolagsverket.zip')
          req=urllib.request.Request(url, headers={'User-Agent':'proffera-company-directory-source-probe/1.0'})
          total=0
          digest=hashlib.sha256()
          with urllib.request.urlopen(req, timeout=90) as response, path.open('wb') as f:
              print('status=', response.status)
              print('url=', response.geturl())
              print('content_length=', response.headers.get('Content-Length'))
              print('content_type=', response.headers.get('Content-Type'))
              while True:
                  chunk=response.read(1024*1024)
                  if not chunk:
                      break
                  total += len(chunk)
                  digest.update(chunk)
                  f.write(chunk)
          print('downloaded=', total)
          print('sha256=', digest.hexdigest())
          print('first4=', path.read_bytes()[:4].hex())
          with path.open('rb') as f:
              f.seek(max(0,total-128))
              tail=f.read()
          print('last128=', tail.hex())
          print('has_eocd=', b'PK\x05\x06' in tail or b'PK\x06\x06' in tail)
          print('is_zipfile=', zipfile.is_zipfile(path))
          if zipfile.is_zipfile(path):
              with zipfile.ZipFile(path) as z:
                  print('members=', [(i.filename,i.file_size,i.compress_size) for i in z.infolist()[:20]])
                  bad=z.testzip()
                  print('testzip_bad=', bad)
          PY
