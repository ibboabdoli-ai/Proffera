name: Probe official company directory source

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

jobs:
  probe:
    name: Validate SCB organisation-number encoding
    if: github.event.head_commit.message == 'Probe official company directory source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate PeOrgNr prefixes and legal forms
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import io
          import re
          import struct
          import urllib.request
          import zlib
          from collections import Counter

          url='https://vardefulla-datamangder.bolagsverket.se/scb/scb_bulkfil.zip'
          request=urllib.request.Request(url, headers={
              'User-Agent':'proffera-company-directory-source-probe/1.0',
              'Range':'bytes=0-8388607',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data=response.read()
          fields=struct.unpack_from('<IHHHHHIIIHH', data, 0)
          _sig,_ver,_flags,method,_time,_date,_crc,_csize,_usize,name_len,extra_len=fields
          if data[:4] != b'PK\x03\x04' or method != 8:
              raise SystemExit('Unexpected SCB ZIP structure')
          offset=30+name_len+extra_len
          out=zlib.decompressobj(-15).decompress(data[offset:], 8*1024*1024)
          reader=csv.DictReader(io.StringIO(out.decode('utf-8-sig','replace')), delimiter='\t')

          prefixes=Counter()
          legal_forms=Counter()
          match_prefixes=Counter()
          match_forms=Counter()
          rows=0
          both=0

          def supported_sni(value):
              digits=re.sub(r'\D','',value or '')[:5]
              return (
                  digits == '81210' or digits.startswith('8122') or digits == '96910'
                  or digits == '49420' or digits == '43210' or digits.startswith('4322')
                  or digits == '43341' or digits == '43320' or digits == '81300'
              )

          for row in reader:
              rows += 1
              digits=re.sub(r'\D','',row.get('PeOrgNr') or '')
              prefixes[digits[:2]] += 1
              jur=(row.get('JurForm') or '').strip()
              legal_forms[jur] += 1
              has_sni=any(supported_sni(row.get(key) or '') for key in ('Ng1','Ng2','Ng3','Ng4','Ng5'))
              postort=(row.get('PostOrt') or '').strip().casefold()
              has_pilot=postort in {'stockholm','södertälje','sodertalje'}
              if has_sni and has_pilot:
                  both += 1
                  match_prefixes[digits[:2]] += 1
                  match_forms[jur] += 1
              if rows >= 20000:
                  break

          print('sample_rows=', rows)
          print('PeOrgNr_prefix_counts=', dict(prefixes))
          print('legal_form_counts=', dict(legal_forms))
          print('matching_rows=', both)
          print('matching_prefix_counts=', dict(match_prefixes))
          print('matching_legal_form_counts=', dict(match_forms))
          if not match_prefixes:
              raise SystemExit('No pilot+SNI matches in sample')
          PY
