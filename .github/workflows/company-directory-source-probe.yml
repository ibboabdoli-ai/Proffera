name: Probe official company directory source

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

jobs:
  probe:
    name: Search current data.europa catalog for Bolagsverket HVD
    if: github.event.head_commit.message == 'Probe official company directory source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search current catalog API
        shell: bash
        run: |
          set -euo pipefail
          base='https://data.europa.eu/api/hub/search/search'
          urls=(
            "$base?query=Bolagsverket&limit=20"
            "$base?q=Bolagsverket&limit=20"
            "$base?query=v%C3%A4rdefulla%20datam%C3%A4ngder&limit=20"
            "$base?query=organisationer%20Bolagsverket&limit=20"
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "===== QUERY $i: $url ====="
            code="$(curl -L --silent --show-error --connect-timeout 10 --max-time 30 -w '%{http_code}' -o /tmp/body "$url")"
            echo "HTTP $code"
            head -c 12000 /tmp/body
            echo
          done
