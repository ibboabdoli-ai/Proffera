name: Probe official company directory source

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

jobs:
  probe:
    name: Inspect official Bolagsverket bulk response
    if: github.event.head_commit.message == 'Probe official company directory source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect headers and first bytes
        shell: bash
        run: |
          set -u
          url='https://vardefulla-datamangder.bolagsverket.se/bolagsverket/bolagsverket_bulkfil.zip'
          echo '=== HEAD ==='
          curl -I -L --silent --show-error --connect-timeout 10 --max-time 60 \
            -A 'proffera-company-directory-source-probe/1.0' "$url" || true
          echo '=== RANGE GET ==='
          curl -L --silent --show-error --connect-timeout 10 --max-time 90 \
            -A 'proffera-company-directory-source-probe/1.0' \
            -H 'Range: bytes=0-1023' \
            -D /tmp/headers -o /tmp/body \
            -w '\nhttp_code=%{http_code}\ncontent_type=%{content_type}\nurl_effective=%{url_effective}\nsize_download=%{size_download}\n' \
            "$url" || true
          cat /tmp/headers || true
          echo '=== FIRST BYTES HEX ==='
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/body')
          if p.exists():
              data=p.read_bytes()
              print('bytes_received=', len(data))
              print('hex=', data[:128].hex())
              print('text=', data[:1000].decode('utf-8','replace'))
          PY
