name: Probe official company directory source

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

jobs:
  probe:
    name: Validate SCB discovery fields without exposing records
    if: github.event.head_commit.message == 'Probe official company directory source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate SCB sample field shapes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import io
          import re
          import struct
          import urllib.request
          import zlib
          from collections import Counter

          url='https://vardefulla-datamangder.bolagsverket.se/scb/scb_bulkfil.zip'
          request=urllib.request.Request(url, headers={
              'User-Agent':'proffera-company-directory-source-probe/1.0',
              'Range':'bytes=0-8388607',
          })
          with urllib.request.urlopen(request, timeout=90) as response:
              data=response.read()
          if data[:4] != b'PK\x03\x04':
              raise SystemExit('SCB: missing ZIP local header')
          fields=struct.unpack_from('<IHHHHHIIIHH', data, 0)
          _sig,_ver,_flags,method,_time,_date,_crc,_csize,_usize,name_len,extra_len=fields
          offset=30+name_len+extra_len
          if method != 8:
              raise SystemExit(f'Unexpected compression method {method}')
          out=zlib.decompressobj(-15).decompress(data[offset:], 8*1024*1024)
          text=out.decode('utf-8-sig','replace')
          lines=text.splitlines()
          if len(lines) < 2:
              raise SystemExit('Not enough decompressed SCB rows')
          reader=csv.DictReader(io.StringIO('\n'.join(lines)), delimiter='\t')

          org_lengths=Counter()
          ng_lengths=Counter()
          rows=0
          supported=0
          pilot=0
          both=0
          pilot_names=Counter()

          def supported_sni(value):
              digits=re.sub(r'\D','',value or '')[:5]
              return (
                  digits == '81210' or digits.startswith('8122') or digits == '96910'
                  or digits == '49420' or digits == '43210' or digits.startswith('4322')
                  or digits == '43341' or digits == '43320' or digits == '81300'
              )

          for row in reader:
              rows += 1
              digits=re.sub(r'\D','',row.get('PeOrgNr') or '')
              org_lengths[len(digits)] += 1
              for key in ('Ng1','Ng2','Ng3','Ng4','Ng5'):
                  value=row.get(key) or ''
                  if value:
                      ng_lengths[len(re.sub(r'\D','',value))] += 1
              has_sni=any(supported_sni(row.get(key) or '') for key in ('Ng1','Ng2','Ng3','Ng4','Ng5'))
              postort=(row.get('PostOrt') or '').strip().casefold()
              has_pilot=postort in {'stockholm','södertälje','sodertalje'}
              supported += int(has_sni)
              pilot += int(has_pilot)
              both += int(has_sni and has_pilot)
              if has_pilot:
                  pilot_names[postort] += 1
              if rows >= 20000:
                  break

          print('sample_rows=', rows)
          print('org_digit_lengths=', dict(org_lengths))
          print('sni_digit_lengths=', dict(ng_lengths))
          print('supported_sni_rows=', supported)
          print('pilot_location_rows=', pilot)
          print('both_supported_and_pilot_rows=', both)
          print('pilot_location_counts=', dict(pilot_names))
          if org_lengths.get(10,0) == 0:
              raise SystemExit('No 10-digit PeOrgNr values in SCB sample')
          PY
