name: Probe official company directory source

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

jobs:
  probe:
    name: Verify current Bolagsverket HVD dataset endpoint
    if: github.event.head_commit.message == 'Probe official company directory source'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify resource 76 and official ZIP
        shell: bash
        run: |
          set -euo pipefail
          url='https://data.europa.eu/api/hub/search/datasets/https-metadata-bolagsverket-se-store-2-resource-76'
          code="$(curl -L --silent --show-error --connect-timeout 10 --max-time 30 -w '%{http_code}' -o /tmp/body "$url")"
          echo "HTTP $code"
          test "$code" = '200'
          python - <<'PY'
          import json
          data=json.load(open('/tmp/body',encoding='utf-8'))
          blob=json.dumps(data,ensure_ascii=False)
          expected='https://vardefulla-datamangder.bolagsverket.se/bolagsverket/bolagsverket_bulkfil.zip'
          print('contains_expected_zip=', expected in blob)
          if expected not in blob:
              raise SystemExit('Current dataset endpoint does not expose expected official Bolagsverket ZIP')
          print(expected)
          PY
