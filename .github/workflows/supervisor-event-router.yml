name: Supervisor event router

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: proffera-supervisor-event-router-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  route:
    name: Route one control-plane event
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Route relevant evidence only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
        shell: bash
        run: |
          set -euo pipefail
          dispatch_pr() {
            local workflow="$1"
            local pr_number="$2"
            gh workflow run "$workflow" --repo "$REPOSITORY" -f pr_number="$pr_number"
          }

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "${ISSUE_NUMBER:-}" = "548" ] \
              && [ "$ACTOR" = "ibboabdoli-ai" ] \
              && [[ "${COMMENT_BODY:-}" == *"<!-- proffera-worker-task-packet:v1 -->"* ]]; then
              gh workflow run supervisor-worker-handoff.yml --repo "$REPOSITORY" -f comment_id="$COMMENT_ID"
              echo "Dispatched bounded Worker handoff for Supervisor Task Packet comment $COMMENT_ID."
              exit 0
            fi

            if [ "${ISSUE_IS_PR:-false}" != "true" ]; then
              echo "Non-PR comment is not a control-plane event."
              exit 0
            fi

            pr_number="${ISSUE_NUMBER:-}"
            wake_final=no
            evaluate_merge=no
            case "$ACTOR" in
              "coderabbitai[bot]")
                if grep -Eqi 'recent_review_start|Final exact-head review is complete for|Review limit reached|Review rate[ -]?limited|Review skipped|temporarily unavailable|service unavailable' <<< "${COMMENT_BODY:-}"; then
                  wake_final=yes
                fi
                if grep -Fq 'Final exact-head review is complete for' <<< "${COMMENT_BODY:-}" \
                  && grep -Fq 'I found no issues.' <<< "${COMMENT_BODY:-}"; then
                  evaluate_merge=yes
                fi
                ;;
              "chatgpt-codex-connector[bot]")
                if grep -Fq "Reviewed commit:" <<< "${COMMENT_BODY:-}"; then
                  wake_final=yes
                fi
                if grep -Fq "Codex Review: Didn't find any major issues" <<< "${COMMENT_BODY:-}" \
                  && grep -Fq "Reviewed commit:" <<< "${COMMENT_BODY:-}"; then
                  evaluate_merge=yes
                fi
                ;;
              "ibboabdoli-ai")
                if grep -Fq "proffera-codex-fallback-review-request:" <<< "${COMMENT_BODY:-}" \
                  && grep -Fq "@codex review" <<< "${COMMENT_BODY:-}"; then
                  wake_final=yes
                fi
                ;;
            esac

            [ "$wake_final" = "yes" ] && dispatch_pr proffera-final-gate-wakeup.yml "$pr_number"
            [ "$evaluate_merge" = "yes" ] && dispatch_pr proffera-automerge.yml "$pr_number"
            if [ "$wake_final" = "no" ] && [ "$evaluate_merge" = "no" ]; then
              echo "PR comment is unrelated to current review/final-gate routing."
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            pr_number="${PR_NUMBER:-}"
            if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Review has no valid PR number."
              exit 0
            fi
            if [ "${PR_DRAFT:-false}" = "true" ]; then
              echo "Draft PR review does not wake merge/final gates."
              exit 0
            fi

            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
            live_head="$(jq -r '.head.sha' <<< "$pr_json")"
            if [ -n "${REVIEW_COMMIT:-}" ] && [ "$REVIEW_COMMIT" != "$live_head" ]; then
              echo "Stale review targets $REVIEW_COMMIT while live head is $live_head."
              exit 0
            fi

            case "$ACTOR" in
              "coderabbitai[bot]"|"chatgpt-codex-connector[bot]")
                if [ "${REVIEW_STATE:-}" != "changes_requested" ]; then
                  dispatch_pr proffera-final-gate-wakeup.yml "$pr_number"
                  dispatch_pr proffera-automerge.yml "$pr_number"
                fi
                if grep -Fq '<!-- proffera-worker-task-packet:v1 -->' <<< "$(jq -r '.body // ""' <<< "$pr_json")"; then
                  gh workflow run supervisor-review-repair.yml --repo "$REPOSITORY" -f pr_number="$pr_number"
                fi
                ;;
              "ibboabdoli-ai")
                if [ "${REVIEW_STATE:-}" != "changes_requested" ]; then
                  dispatch_pr proffera-automerge.yml "$pr_number"
                fi
                ;;
              *)
                echo "Review actor is not a trusted control-plane reviewer."
                ;;
            esac
          fi
