name: Supervisor event router

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: proffera-supervisor-event-router-${{ github.event_name == 'issue_comment' && github.event.comment.id || github.event.review.id || github.run_id }}
  cancel-in-progress: false

jobs:
  route:
    name: Route one control-plane event
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Route relevant evidence only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_UPDATED_AT: ${{ github.event.comment.updated_at }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEW_SUBMITTED_AT: ${{ github.event.review.submitted_at }}
        shell: bash
        run: |
          set -euo pipefail

          dispatch_pr() {
            local workflow="$1"
            local pr_number="$2"
            gh workflow run "$workflow" --repo "$REPOSITORY" -f pr_number="$pr_number"
          }

          final_gate_dispatch_schema_ready() {
            local workflow_text input
            workflow_text="$(
              gh api "repos/${REPOSITORY}/contents/.github/workflows/proffera-final-gate-wakeup.yml?ref=main" --jq '.content' \
                | base64 --decode
            )" || return 1
            for input in source_event source_id source_actor source_evidence_time source_review_commit; do
              if ! grep -Eq "^[[:space:]]+${input}:" <<< "$workflow_text"; then
                return 2
              fi
            done
          }

          dispatch_final_gate() {
            local pr_number="$1" source_id source_time source_review_commit schema_status
            case "$EVENT_NAME" in
              issue_comment)
                source_id="${COMMENT_ID:-}"
                source_time="${COMMENT_UPDATED_AT:-}"
                source_review_commit=""
                ;;
              pull_request_review)
                source_id="${REVIEW_ID:-}"
                source_time="${REVIEW_SUBMITTED_AT:-}"
                source_review_commit="${REVIEW_COMMIT:-}"
                ;;
              *)
                echo "Unsupported final-gate source event."
                return 1
                ;;
            esac
            if ! [[ "$source_id" =~ ^[1-9][0-9]*$ ]] || [ -z "$source_time" ]; then
              echo "Final-gate source event lacks immutable identity or evidence time."
              return 1
            fi
            if final_gate_dispatch_schema_ready; then
              :
            else
              schema_status=$?
              if [ "$schema_status" -eq 2 ]; then
                echo "Final-gate provenance dispatch schema is not deployed on main yet; leaving the final gate unchanged."
                return 0
              fi
              echo "Could not verify the deployed final-gate dispatch schema; refusing to route review evidence." >&2
              return 1
            fi
            gh workflow run proffera-final-gate-wakeup.yml --repo "$REPOSITORY" \
              -f pr_number="$pr_number" \
              -f source_event="$EVENT_NAME" \
              -f source_id="$source_id" \
              -f source_actor="$ACTOR" \
              -f source_evidence_time="$source_time" \
              -f source_review_commit="$source_review_commit"
          }

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            if [ "${ISSUE_NUMBER:-}" = "548" ] \
              && [ "$ACTOR" = "ibboabdoli-ai" ] \
              && [[ "${COMMENT_BODY:-}" == *"<!-- proffera-worker-task-packet:v1 -->"* ]]; then
              gh workflow run supervisor-worker-handoff.yml --repo "$REPOSITORY" -f comment_id="$COMMENT_ID"
              echo "Dispatched bounded Worker handoff for trusted owner Task Packet comment $COMMENT_ID."
              exit 0
            fi

            if [ "${ISSUE_IS_PR:-false}" != "true" ]; then
              echo "Non-PR comment is not a control-plane event."
              exit 0
            fi

            pr_number="${ISSUE_NUMBER:-}"

            if [ "$ACTOR" = "ibboabdoli-ai" ] \
              && grep -Fq '<!-- proffera-owner-approval:' <<< "${COMMENT_BODY:-}" \
              && grep -Fq 'IBBO-APPROVED:' <<< "${COMMENT_BODY:-}"; then
              dispatch_pr proffera-automerge.yml "$pr_number"
              echo "Dispatched gated automerge evaluation for exact-head owner approval comment $COMMENT_ID."
              exit 0
            fi

            wake_final=no
            case "$ACTOR" in
              "coderabbitai[bot]")
                if grep -Eqi 'recent_review_start|Final exact-head review is complete for|Review limit reached|Review rate[ -]?limited|Review skipped|temporarily unavailable|service unavailable' <<< "${COMMENT_BODY:-}"; then
                  wake_final=yes
                fi
                ;;
              "chatgpt-codex-connector[bot]")
                if grep -Fq "Reviewed commit:" <<< "${COMMENT_BODY:-}"; then
                  wake_final=yes
                fi
                ;;
              "ibboabdoli-ai")
                if grep -Fq "proffera-codex-fallback-review-request:" <<< "${COMMENT_BODY:-}" \
                  && grep -Fq "@codex review" <<< "${COMMENT_BODY:-}"; then
                  wake_final=yes
                fi
                ;;
            esac

            if [ "$wake_final" = "yes" ]; then
              dispatch_final_gate "$pr_number"
            else
              echo "PR comment is unrelated to current final-gate routing."
            fi
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request_review" ]; then
            pr_number="${PR_NUMBER:-}"
            if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
              echo "Review has no valid PR number."
              exit 0
            fi

            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
            live_head="$(jq -r '.head.sha' <<< "$pr_json")"
            live_draft="$(jq -r '.draft == true' <<< "$pr_json")"
            if [ -n "${REVIEW_COMMIT:-}" ] && [ "$REVIEW_COMMIT" != "$live_head" ]; then
              echo "Stale review targets $REVIEW_COMMIT while live head is $live_head."
              exit 0
            fi

            case "$ACTOR" in
              "coderabbitai[bot]"|"chatgpt-codex-connector[bot]")
                final_gate_status=0
                if [ "$live_draft" != "true" ] && [ "${REVIEW_STATE:-}" != "changes_requested" ]; then
                  dispatch_final_gate "$pr_number" || final_gate_status=$?
                fi

                repair=no
                if [ "${REVIEW_STATE:-}" = "changes_requested" ]; then
                  repair=yes
                else
                  inline_count="$(
                    gh api --paginate "repos/${REPOSITORY}/pulls/${pr_number}/comments?per_page=100" --jq '.[]' \
                      | jq -s --arg actor "$ACTOR" --arg head "$live_head" '[.[] | select(.user.login == $actor and .original_commit_id == $head)] | length'
                  )"
                  if [ "$inline_count" -gt 0 ]; then
                    repair=yes
                  fi
                fi

                if [ "$repair" = "yes" ] \
                  && grep -Fq '<!-- proffera-worker-task-packet:v1 -->' <<< "$(jq -r '.body // ""' <<< "$pr_json")"; then
                  gh workflow run supervisor-review-repair.yml --repo "$REPOSITORY" -f pr_number="$pr_number"
                fi
                if [ "$final_gate_status" -ne 0 ]; then
                  echo "Final-gate routing failed after review-repair routing was evaluated." >&2
                  exit "$final_gate_status"
                fi
                ;;
              "ibboabdoli-ai")
                if [ "$live_draft" != "true" ] && [ "${REVIEW_STATE:-}" = "approved" ]; then
                  dispatch_pr proffera-automerge.yml "$pr_number"
                fi
                ;;
              *)
                echo "Review actor is not a trusted control-plane reviewer."
                ;;
            esac
          fi
