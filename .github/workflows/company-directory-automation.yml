name: Company directory automation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/company-directory-automation.yml"
      - "scripts/company-directory-discovery.py"
      - "src/app/api/cron/company-directory-discovery-ingest/route.ts"
  schedule:
    - cron: "17 * * * *"
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-directory-automation
  cancel-in-progress: false

jobs:
  discover:
    name: Discover official company candidates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify scheduler configuration
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$REMINDER_CRON_URL"
          test -n "$CRON_SECRET"

      - name: Resolve protected automation endpoint
        id: endpoint
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import urllib.parse

          url = urllib.parse.urlparse(os.environ["REMINDER_CRON_URL"])
          if url.scheme != "https" or not url.netloc:
              raise SystemExit("PROFFERA_REMINDER_CRON_URL must be an HTTPS URL")

          host = url.netloc.lower()
          if host in {"proffera.se", "www.proffera.se"}:
              host = "www.proffera.se"
          origin = f"https://{host}"
          print(f"ingest_url={origin}/api/cron/company-directory-discovery-ingest")
          PY

      - name: Probe official company source
        id: probe
        if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
        env:
          INGEST_URL: ${{ steps.endpoint.outputs.ingest_url }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-source-probe" \
            "$INGEST_URL?source_probe=1" > "$RESPONSE_FILE"

          python - "$RESPONSE_FILE" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)

          if payload.get("ok") is not True:
              raise SystemExit(f"Company source probe failed: {payload}")

          probe = payload.get("sourceProbe") or {}
          changed = probe.get("sourceChanged") is True
          reason = str(probe.get("reason") or "unknown").replace("\n", " ")
          print(f"source_changed={'true' if changed else 'false'}")
          print(f"reason={reason}")
          PY

      - name: Decide whether to run full discovery
        id: scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          SOURCE_CHANGED: ${{ steps.probe.outputs.source_changed }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "schedule" ]; then
            run_full="true"
            reason="manual-or-discovery-code-change"
          elif [ "$EVENT_SCHEDULE" = "31 3 * * *" ]; then
            run_full="true"
            reason="daily-safety-scan"
          elif [ "$SOURCE_CHANGED" = "true" ]; then
            run_full="true"
            reason="official-source-changed"
          else
            run_full="false"
            reason="official-source-unchanged"
          fi

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Company directory discovery decision: $run_full ($reason)"

      - name: Report unchanged official source
        if: steps.scan.outputs.run_full != 'true'
        run: echo "Official company source is unchanged; skipping the expensive full discovery scan."

      - name: Checkout
        if: steps.scan.outputs.run_full == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install streaming JSON parser
        if: steps.scan.outputs.run_full == 'true'
        run: python -m pip install --disable-pip-version-check --quiet ijson

      - name: Discover Stockholm and Södertälje service companies
        if: steps.scan.outputs.run_full == 'true'
        env:
          INGEST_URL: ${{ steps.endpoint.outputs.ingest_url }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
          BOLAGSVERKET_BULK_URL: ${{ vars.BOLAGSVERKET_BULK_URL }}
        run: |
          set -euo pipefail
          python scripts/company-directory-discovery.py \
            --ingest-url "$INGEST_URL" \
            --secret "$CRON_SECRET"
