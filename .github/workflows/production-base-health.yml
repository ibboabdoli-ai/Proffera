name: Production base health

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  actions: read
  contents: read

concurrency:
  group: proffera-production-base-health-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify healthy Production base
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEALTH_WORKFLOW: production-health.yml
    steps:
      - name: Require exact-base Production health success
        shell: bash
        run: |
          set -euo pipefail

          # Bootstrap exception: the PR that introduces Production health has a base
          # where the health workflow does not yet exist. Every later base must have
          # an exact-SHA successful Production health run.
          if ! gh api "repos/$REPOSITORY/contents/.github/workflows/$HEALTH_WORKFLOW?ref=$BASE_SHA" >/dev/null 2>&1; then
            echo "Production health is not yet active on base $BASE_SHA; allowing bootstrap PR only."
            exit 0
          fi

          for attempt in $(seq 1 24); do
            runs="$(gh api "repos/$REPOSITORY/actions/workflows/$HEALTH_WORKFLOW/runs?branch=main&event=push&per_page=50")"
            conclusion="$(jq -r --arg sha "$BASE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.created_at)
              | last
              | .conclusion // ""
            ' <<< "$runs")"
            status="$(jq -r --arg sha "$BASE_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.created_at)
              | last
              | .status // ""
            ' <<< "$runs")"

            echo "Base health attempt $attempt/24: base=$BASE_SHA status=${status:-missing} conclusion=${conclusion:-missing}"

            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              echo "Production is healthy on exact PR base $BASE_SHA."
              exit 0
            fi

            if [ "$status" = "completed" ] && [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
              echo "::error::Production health is red on exact PR base $BASE_SHA ($conclusion). New work is blocked."
              exit 1
            fi

            if [ "$attempt" -lt 24 ]; then
              sleep 15
            fi
          done

          echo "::error::No successful Production health result became available for exact PR base $BASE_SHA."
          exit 1
