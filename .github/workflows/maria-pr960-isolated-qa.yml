# Temporary, read-only integration verification of Maria PR #960.
# This workflow is removed after the isolated PostgreSQL test result is captured.
name: Maria PR960 isolated PostgreSQL QA
on:
  push:
    branches:
      - work/proffera-maria-manual-calendar-957
    paths:
      - .github/workflows/maria-pr960-isolated-qa.yml
      - db/migrations/20261105_0073_public_booking_verification_contact_fields.sql

permissions:
  contents: read

jobs:
  maria-postgres:
    name: Maria manual-closure PostgreSQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prove three closed-start protections in a disposable PostgreSQL Docker database
        env:
          PROFFERA_POSTGRES_INTEGRATION: "1"
        run: ./node_modules/.bin/vitest run tests/maria-manual-calendar-postgres.integration.test.ts --reporter=dot
