name: Apply PrimeView address lookup UI

on:
  push:
    branches:
      - feature/primeview-postcode-address-lookup
    paths:
      - .github/workflows/apply-primeview-address-lookup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/primeview-postcode-address-lookup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch booking form
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/app/primeview-booking/primeview-precision-booking-form.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { useMemo, useState, type ChangeEvent } from "react";',
                  'import { useEffect, useMemo, useState, type ChangeEvent } from "react";'
              ),
              (
                  '  const [postcode, setPostcode] = useState(() => UK_POSTCODE.test(requestedPostcode) ? requestedPostcode : "");\n  const [date, setDate] = useState(today);',
                  '  const [postcode, setPostcode] = useState(() => UK_POSTCODE.test(requestedPostcode) ? requestedPostcode : "");\n  const [address, setAddress] = useState("");\n  const [addressSuggestions, setAddressSuggestions] = useState<string[]>([]);\n  const [addressLookupLoading, setAddressLookupLoading] = useState(false);\n  const [addressLookupMessage, setAddressLookupMessage] = useState("");\n  const [date, setDate] = useState(today);'
              ),
              (
                  '  const selectedService = services.find((service) => service.id === serviceId);',
                  '''  useEffect(() => {\n    if (!UK_POSTCODE.test(postcode)) {\n      setAddressSuggestions([]);\n      setAddressLookupMessage("");\n      setAddressLookupLoading(false);\n      return;\n    }\n\n    const controller = new AbortController();\n    const timer = window.setTimeout(async () => {\n      setAddressLookupLoading(true);\n      setAddressLookupMessage("");\n      try {\n        const response = await fetch(`/api/primeview/address-lookup?postcode=${encodeURIComponent(postcode)}`, { signal: controller.signal });\n        const data = await response.json().catch(() => ({})) as { addresses?: unknown; error?: unknown };\n        if (!response.ok) throw new Error(typeof data.error === "string" ? data.error : "Address lookup is unavailable.");\n        const nextAddresses = Array.isArray(data.addresses) ? data.addresses.filter((value): value is string => typeof value === "string" && Boolean(value.trim())) : [];\n        setAddressSuggestions(nextAddresses);\n        if (!nextAddresses.length) setAddressLookupMessage("No addresses were found. You can enter the address manually.");\n      } catch (error) {\n        if (controller.signal.aborted) return;\n        setAddressSuggestions([]);\n        setAddressLookupMessage(error instanceof Error ? error.message : "Address lookup is unavailable. Enter the address manually.");\n      } finally {\n        if (!controller.signal.aborted) setAddressLookupLoading(false);\n      }\n    }, 450);\n\n    return () => {\n      window.clearTimeout(timer);\n      controller.abort();\n    };\n  }, [postcode]);\n\n  const selectedService = services.find((service) => service.id === serviceId);'''
              ),
              (
                  '<label className={labelClass}>UK postcode<input name="postcode" required autoComplete="postal-code" placeholder="W4 3ES" pattern="[A-Za-z]{1,2}[0-9][A-Za-z0-9]? ?[0-9][A-Za-z]{2}" value={postcode} onChange={(event) => setPostcode(event.target.value.toUpperCase())} className={fieldClass} /></label>\n            <label className={`${labelClass} sm:col-span-2`}>Full address<input name="address" required autoComplete="street-address" placeholder="House number and street" className={fieldClass} /></label>',
                  '''<label className={labelClass}>UK postcode<input name="postcode" required autoComplete="postal-code" placeholder="W4 3ES" pattern="[A-Za-z]{1,2}[0-9][A-Za-z0-9]? ?[0-9][A-Za-z]{2}" value={postcode} onChange={(event) => { setPostcode(event.target.value.toUpperCase()); setAddress(""); setAddressSuggestions([]); setAddressLookupMessage(""); }} className={fieldClass} /></label>\n            {UK_POSTCODE.test(postcode) ? <div className="sm:col-span-2 rounded-2xl border border-[#d9e4ef] bg-[#f9fbfe] p-4">\n              <div className="flex items-center gap-2 text-sm font-black text-[#183e63]"><MapPin className="h-4 w-4 text-[#1769c2]" />Find your address</div>\n              {addressLookupLoading ? <p className="mt-2 flex items-center gap-2 text-sm text-[#667b91]"><Loader2 className="h-4 w-4 animate-spin" />Finding addresses for {postcode}…</p> : null}\n              {!addressLookupLoading && addressSuggestions.length ? <select aria-label="Choose your address" value={address} onChange={(event) => setAddress(event.target.value)} className={`${fieldClass} mt-3`}><option value="">Choose your address</option>{addressSuggestions.map((item) => <option key={item} value={item}>{item}</option>)}</select> : null}\n              {addressLookupMessage ? <p className="mt-2 text-xs font-semibold leading-5 text-[#667b91]">{addressLookupMessage}</p> : null}\n              {!addressLookupLoading && addressSuggestions.length ? <p className="mt-2 text-xs text-[#667b91]">Select the property above, or type the address manually below.</p> : null}\n            </div> : null}\n            <label className={`${labelClass} sm:col-span-2`}>Full address<input name="address" required autoComplete="street-address" placeholder="House number and street" value={address} onChange={(event) => setAddress(event.target.value)} className={fieldClass} /></label>'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected booking-form fragment not found:\n{old[:240]}")
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-primeview-address-lookup.yml
      - name: Install dependencies
        run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
          git diff --check
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: autofill PrimeView address from UK postcode"
          git push origin HEAD:feature/primeview-postcode-address-lookup
