name: Temporary Phase 2 final review fix

on:
  push:
    branches:
      - work/proffera-codex-review-fallback
    paths:
      - .github/scripts/phase2_final_review_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/proffera-codex-review-fallback
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Apply verified final-review fix
        run: python3 .github/scripts/phase2_final_review_fix.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused regression tests
        run: npm test -- --run tests/proffera-standing-automerge.test.ts tests/tooling-safety-contract.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint touched tests
        run: npx eslint tests/proffera-standing-automerge.test.ts tests/tooling-safety-contract.test.ts

      - name: Check diff
        run: git diff --check

      - name: Commit verified patch and remove temporary repair files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase2-final-review-fix.yml .github/scripts/phase2_final_review_fix.py .github/scripts/phase2_final_review_trigger.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recheck CodeRabbit immediately before automerge"
          git push origin HEAD:work/proffera-codex-review-fallback
