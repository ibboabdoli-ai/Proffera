name: Security review regressions

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "src/lib/marketplace-guest-quote.ts"
      - "src/lib/company-directory-sole-trader-owner.ts"
      - "src/lib/public-business-hub.ts"
      - "src/app/foretag/[workspace]/page.tsx"
      - "src/app/api/public-directory/claim-email/send/route.ts"
      - "src/app/api/public-directory/claim-email/verify/route.ts"
      - "src/lib/company-directory-claim-email.ts"
      - "tests/marketplace-guest-address-redaction.test.ts"
      - "tests/company-directory-sole-trader-publication-privacy.test.ts"
      - "tests/company-directory-claim-email-concurrency.test.ts"
      - "tests/company-directory-claim-email-concurrency.integration.test.ts"
      - "package.json"
      - "package-lock.json"
      - "db/migrations/20260613_phase18_booking_crm.sql"
      - "db/migrations/20260614_phase18_15_workspace_settings.sql"
      - "db/migrations/20260614_phase18_16_workspace_services.sql"
      - "db/migrations/20260616_0001_better_auth_core_schema.sql"
      - "db/migrations/20260616_0002_proffera_workspace_schema.sql"
      - "db/migrations/20260715_0005_public_booking_foundation.sql"
      - "db/migrations/20260728_0016_workspace_staff.sql"
      - "db/migrations/20260729_0019_website_reviews.sql"
      - "db/migrations/20260730_0019a_website_gallery_items.sql"
      - "db/migrations/20260801_0020_workspace_market_settings.sql"
      - "db/migrations/20260802_0021_workspace_service_pricing.sql"
      - "db/migrations/20260802_0022_workspace_quote_requests.sql"
      - "db/migrations/20260802_0023_workspace_quote_offers.sql"
      - "db/migrations/20260802_0025_workspace_service_jobs.sql"
      - "db/migrations/20260803_0028_booking_email_verifications.sql"
      - "db/migrations/20260809_0036_public_business_hub.sql"
      - "db/migrations/20260809_0037_company_profile_engine_foundation.sql"
      - "db/migrations/20260809_0040_company_profile_claim_reservation.sql"
      - ".github/workflows/security-review-regressions.yml"
  push:
    branches: [main]
    paths:
      - "src/lib/marketplace-guest-quote.ts"
      - "src/lib/company-directory-sole-trader-owner.ts"
      - "src/lib/public-business-hub.ts"
      - "src/app/foretag/[workspace]/page.tsx"
      - "src/app/api/public-directory/claim-email/send/route.ts"
      - "src/app/api/public-directory/claim-email/verify/route.ts"
      - "src/lib/company-directory-claim-email.ts"
      - "tests/marketplace-guest-address-redaction.test.ts"
      - "tests/company-directory-sole-trader-publication-privacy.test.ts"
      - "tests/company-directory-claim-email-concurrency.test.ts"
      - "tests/company-directory-claim-email-concurrency.integration.test.ts"
      - "package.json"
      - "package-lock.json"
      - "db/migrations/20260613_phase18_booking_crm.sql"
      - "db/migrations/20260614_phase18_15_workspace_settings.sql"
      - "db/migrations/20260614_phase18_16_workspace_services.sql"
      - "db/migrations/20260616_0001_better_auth_core_schema.sql"
      - "db/migrations/20260616_0002_proffera_workspace_schema.sql"
      - "db/migrations/20260715_0005_public_booking_foundation.sql"
      - "db/migrations/20260728_0016_workspace_staff.sql"
      - "db/migrations/20260729_0019_website_reviews.sql"
      - "db/migrations/20260730_0019a_website_gallery_items.sql"
      - "db/migrations/20260801_0020_workspace_market_settings.sql"
      - "db/migrations/20260802_0021_workspace_service_pricing.sql"
      - "db/migrations/20260802_0022_workspace_quote_requests.sql"
      - "db/migrations/20260802_0023_workspace_quote_offers.sql"
      - "db/migrations/20260802_0025_workspace_service_jobs.sql"
      - "db/migrations/20260803_0028_booking_email_verifications.sql"
      - "db/migrations/20260809_0036_public_business_hub.sql"
      - "db/migrations/20260809_0037_company_profile_engine_foundation.sql"
      - "db/migrations/20260809_0040_company_profile_claim_reservation.sql"
      - ".github/workflows/security-review-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-review-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security_regressions:
    name: Security review regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Marketplace customer-address redaction regression
        run: npm exec -- vitest run tests/marketplace-guest-address-redaction.test.ts --reporter=verbose

      - name: Claim-email concurrency unit regressions
        run: npm exec -- vitest run tests/company-directory-claim-email-concurrency.test.ts --reporter=verbose

      - name: Claim-email PostgreSQL concurrency proof
        env:
          PROFFERA_POSTGRES_INTEGRATION: "1"
        run: npm exec -- vitest run tests/company-directory-claim-email-concurrency.integration.test.ts --reporter=verbose

      - name: Sole-trader publication privacy PostgreSQL proof
        env:
          PROFFERA_POSTGRES_INTEGRATION: "1"
        run: npm exec -- vitest run tests/company-directory-sole-trader-publication-privacy.test.ts --reporter=verbose
