name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: proffera-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reset_review_label:
    name: Reset AI review route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Clear stale final-review state after new code
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          if gh api --method DELETE \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/needs-ai-review" \
            >/dev/null 2>"$error_file"; then
            echo "Cleared stale needs-ai-review from PR #${PR_NUMBER} after new code."
          else
            error_text="$(cat "$error_file")"
            if grep -Fq '(HTTP 404)' <<< "$error_text"; then
              echo "needs-ai-review was already absent from PR #${PR_NUMBER}."
            else
              cat "$error_file" >&2
              echo "Refused: could not reset AI review routing state." >&2
              exit 1
            fi
          fi

      - name: Keep final-review state on non-code events
        if: github.event.action != 'synchronize'
        run: echo "No new code on this event; final-review state is unchanged."

  governance:
    name: Governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Worker bootstrap governance
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: worker bootstrap/branch/documentation declaration checks are exempt."
            exit 0
          fi

          if [[ "$HEAD_REF" != work/proffera-* ]]; then
            echo "Refused: AI/product PR branches must use work/proffera-*; got '$HEAD_REF'."
            exit 1
          fi

          if ! grep -Fqi "Worker bootstrap: complete" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Worker bootstrap: complete'."
            exit 1
          fi

          if ! grep -Fqi "Supervisor handoff: #548" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Supervisor handoff: #548'."
            exit 1
          fi

          task_value="$(sed -nE 's/^[[:space:]]*Task\/issue:[[:space:]]*(.+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1)"
          if [ -z "$task_value" ] || [[ "$task_value" == *"<"* ]]; then
            echo "Refused: PR body must contain a concrete 'Task/issue:' value (issue number or user-request)."
            exit 1
          fi

          bootstrap_sha="$(sed -nE 's/^[[:space:]]*Bootstrap baseline:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1 | tr '[:upper:]' '[:lower:]')"
          expected_base_sha="$(tr '[:upper:]' '[:lower:]' <<< "$BASE_SHA")"
          if [ -z "$bootstrap_sha" ]; then
            echo "Refused: PR body must contain 'Bootstrap baseline:' followed by a 40-character commit SHA."
            exit 1
          fi
          if [ "$bootstrap_sha" != "$expected_base_sha" ]; then
            echo "Refused: bootstrap baseline '$bootstrap_sha' does not match current PR base '$expected_base_sha'. Refresh the graph from current main and update the PR handoff."
            exit 1
          fi

          updated_count="$(grep -Fic "Documentation impact: updated" <<< "$PR_BODY" || true)"
          none_count="$(grep -Fic "Documentation impact: none" <<< "$PR_BODY" || true)"
          if [ "$updated_count" -gt 0 ] && [ "$none_count" -gt 0 ]; then
            echo "Refused: keep exactly one Documentation impact declaration."
            exit 1
          fi

          if [ "$updated_count" -gt 0 ]; then
            changed_files="$(gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" --name-only)"
            if ! grep -Fxq "docs/CURRENT_STATUS.md" <<< "$changed_files"; then
              echo "Refused: PR declares documentation updated but docs/CURRENT_STATUS.md is unchanged."
              exit 1
            fi
            echo "Documentation impact declared updated and canonical status file changed."
          elif [ "$none_count" -gt 0 ]; then
            echo "Documentation impact explicitly declared none."
          else
            echo "Refused: PR body must contain exactly one of 'Documentation impact: updated' or 'Documentation impact: none'."
            exit 1
          fi

          echo "Worker bootstrap governance passed for base $expected_base_sha."

      - name: Push event governance
        if: github.event_name != 'pull_request'
        run: |
          echo "Push event: PR bootstrap governance is not applicable."

  ci_scope:
    name: CI scope
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.scope.outputs.lint }}
      typecheck: ${{ steps.scope.outputs.typecheck }}
      unit: ${{ steps.scope.outputs.unit }}
      build: ${{ steps.scope.outputs.build }}
      e2e: ${{ steps.scope.outputs.e2e }}
      discovery_worker: ${{ steps.scope.outputs.discovery_worker }}
      classification: ${{ steps.scope.outputs.classification }}

    steps:
      - name: Checkout trusted base planner
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Setup Node
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Resolve fail-closed execution lanes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          lint=true
          typecheck=true
          unit=true
          build=true
          e2e=true
          discovery_worker=true
          classification=full

          emit() {
            {
              echo "lint=$lint"
              echo "typecheck=$typecheck"
              echo "unit=$unit"
              echo "build=$build"
              echo "e2e=$e2e"
              echo "discovery_worker=$discovery_worker"
              echo "classification=$classification"
            } >> "$GITHUB_OUTPUT"
          }

          full_and_exit() {
            echo "$1"
            emit
            exit 0
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            full_and_exit "Push event: full CI remains required."
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")" || full_and_exit "Scope read failed; using full CI."
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          if [ "$current_head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            full_and_exit "Stale scope event; using full CI."
          fi

          reported_file_count="$(jq -r '.changed_files' <<< "$pr_json")"
          if ! [[ "$reported_file_count" =~ ^[0-9]+$ ]] || [ "$reported_file_count" -gt 3000 ]; then
            full_and_exit "Changed-file evidence is incomplete or exceeds GitHub's 3000-file API limit; using full CI."
          fi

          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')" || full_and_exit "Changed-file read failed; using full CI."

          if [ ! -f scripts/ci-scope-plan.mjs ]; then
            full_and_exit "Trusted base has no scope planner; using full CI."
          fi

          plan_file="$(mktemp)"
          error_file="$(mktemp)"
          set +e
          printf '%s\n' "$changed_files" | env -u GH_TOKEN node scripts/ci-scope-plan.mjs >"$plan_file" 2>"$error_file"
          planner_status=$?
          set -e

          if [ "$planner_status" -ne 0 ] || ! jq -e . "$plan_file" >/dev/null 2>&1; then
            full_and_exit "Trusted-base planner failed; using full CI."
          fi

          if ! jq -e '
            (.policyVersion | type) == "number"
            and .policyVersion >= 2
            and .mode == "targeted"
            and (.reductionCandidate | type) == "boolean"
            and (.fullCiStillRequired | type) == "boolean"
            and (.execution | type) == "object"
            and (.execution.lint | type) == "boolean"
            and (.execution.typecheck | type) == "boolean"
            and (.execution.unit | type) == "boolean"
            and (.execution.build | type) == "boolean"
            and (.execution.e2e | type) == "boolean"
            and (.execution.discoveryWorker | type) == "boolean"
          ' "$plan_file" >/dev/null; then
            full_and_exit "Trusted planner is pre-activation or malformed; using full CI."
          fi

          if [ "$(jq -r '.reductionCandidate' "$plan_file")" != "true" ] ||
             [ "$(jq -r '.fullCiStillRequired' "$plan_file")" != "false" ]; then
            full_and_exit "Trusted planner requires full CI."
          fi

          lint="$(jq -r '.execution.lint' "$plan_file")"
          typecheck="$(jq -r '.execution.typecheck' "$plan_file")"
          unit="$(jq -r '.execution.unit' "$plan_file")"
          build="$(jq -r '.execution.build' "$plan_file")"
          e2e="$(jq -r '.execution.e2e' "$plan_file")"
          discovery_worker="$(jq -r '.execution.discoveryWorker' "$plan_file")"
          classification="$(jq -r '.classification' "$plan_file")"
          emit

          echo "Targeted CI classification: $classification"
          echo "Selected lanes: lint=$lint typecheck=$typecheck unit=$unit build=$build e2e=$e2e discovery_worker=$discovery_worker"

  static_checks:
    name: Static checks
    needs: [governance, ci_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        if: needs.ci_scope.outputs.lint == 'true' || needs.ci_scope.outputs.typecheck == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: needs.ci_scope.outputs.lint == 'true' || needs.ci_scope.outputs.typecheck == 'true'
        run: npm ci --no-audit --no-fund

      - name: Lint
        if: needs.ci_scope.outputs.lint == 'true'
        run: npm run lint

      - name: Typecheck
        if: needs.ci_scope.outputs.typecheck == 'true'
        run: npm run typecheck

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
            exit 0
          fi

          if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git show --check --format= "$PUSH_HEAD_SHA"
            exit 0
          fi

          git diff --check "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"

      - name: Report targeted static skip
        if: needs.ci_scope.outputs.lint != 'true' && needs.ci_scope.outputs.typecheck != 'true'
        run: echo "Targeted CI skipped Node static analysis for this scope; whitespace validation still ran."

  unit_tests:
    name: Unit and worker tests
    needs: [governance, ci_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        if: needs.ci_scope.outputs.unit == 'true' || needs.ci_scope.outputs.discovery_worker == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: needs.ci_scope.outputs.unit == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: needs.ci_scope.outputs.unit == 'true'
        run: npm ci --no-audit --no-fund

      - name: Test
        if: needs.ci_scope.outputs.unit == 'true'
        run: npm test

      - name: Validate discovery worker
        if: needs.ci_scope.outputs.discovery_worker == 'true'
        run: |
          python3 -m py_compile scripts/company-directory-discovery.py
          python3 tests/test_company_directory_discovery_worker.py

      - name: Report targeted unit skip
        if: needs.ci_scope.outputs.unit != 'true' && needs.ci_scope.outputs.discovery_worker != 'true'
        run: echo "Targeted CI skipped unit and discovery-worker execution for this scope."

  build:
    name: Build
    needs: [governance, ci_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        if: needs.ci_scope.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: needs.ci_scope.outputs.build == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: needs.ci_scope.outputs.build == 'true'
        run: npm ci --no-audit --no-fund

      - name: Build
        if: needs.ci_scope.outputs.build == 'true'
        run: npm run build

      - name: Report targeted build skip
        if: needs.ci_scope.outputs.build != 'true'
        run: echo "Targeted CI skipped the production build for this scope."

  validate:
    name: Validate
    if: always()
    needs: [governance, ci_scope, static_checks, unit_tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require all scope-selected quality checks
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          SCOPE_RESULT: ${{ needs.ci_scope.result }}
          STATIC_RESULT: ${{ needs.static_checks.result }}
          TEST_RESULT: ${{ needs.unit_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CLASSIFICATION: ${{ needs.ci_scope.outputs.classification }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GOVERNANCE_RESULT" != "success" ]; then
            echo "Refused: governance did not succeed ($GOVERNANCE_RESULT)."
            exit 1
          fi

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "Refused: CI scope resolution did not succeed ($SCOPE_RESULT)."
            exit 1
          fi

          if [ "$STATIC_RESULT" != "success" ]; then
            echo "Refused: static checks did not succeed ($STATIC_RESULT)."
            exit 1
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "Refused: unit/worker tests did not succeed ($TEST_RESULT)."
            exit 1
          fi

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Refused: build did not succeed ($BUILD_RESULT)."
            exit 1
          fi

          echo "All governance and scope-selected quality checks succeeded (classification=$CLASSIFICATION)."

  route_ai_review:
    name: AI review route
    if: github.event_name == 'pull_request'
    needs: [validate, reset_review_label]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Route final risk-based AI review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"

          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "Refused: CI head $HEAD_SHA is stale; current PR head is $current_head_sha."
            exit 1
          fi

          if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
            echo "AI review routing skipped for draft/Dependabot PR."
            exit 0
          fi

          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          reported_file_count="$(jq -r '.changed_files' <<< "$pr_json")"
          file_count=0
          needs_review=false
          fallback_eligible=false
          reason=""
          file_list_complete=true

          if ! [[ "$reported_file_count" =~ ^[0-9]+$ ]]; then
            needs_review=true
            fallback_eligible=false
            file_list_complete=false
            reason="invalid changed-file count"
          elif [ "$reported_file_count" -gt 3000 ]; then
            needs_review=true
            fallback_eligible=false
            file_list_complete=false
            reason="changed-file list exceeds GitHub's 3000-file API limit"
          else
            file_count="$reported_file_count"
          fi

          if [ "$file_list_complete" = "true" ] && [ "$file_count" -ge 12 ]; then
            needs_review=true
            fallback_eligible=true
            reason="large change (${file_count} files)"
          fi

          if [ "$file_list_complete" = "true" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in
                .github/workflows/*|db/migrations/*|migrations/*|src/app/api/*|src/app/privacy/*|src/app/privacy/**|*/privacy/*|src/app/admin/foretag/directory/*|src/app/admin/foretag/directory/**|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock|*/package-lock.json|*/pnpm-lock.yaml|*/yarn.lock|vercel.json|next.config.*|src/proxy.*|middleware.*|scripts/company-directory-discovery.py)
                  needs_review=true
                  fallback_eligible=false
                  reason="sensitive path: $file"
                  break
                  ;;
              esac

              if [[ "$file" =~ (^|/)(auth|rbac|permissions?|tenant|workspace|billing|payments?|stripe|checkout|webhooks?|db|database|postgres|neon)(/|[._-]) ]] ||
                 [[ "$file" =~ company[-_]directory ]] ||
                 [[ "$file" =~ (^|/)\.env ]]; then
                needs_review=true
                fallback_eligible=false
                reason="sensitive domain: $file"
                break
              fi
            done <<< "$changed_files"
          fi

          if [ "$needs_review" != "true" ]; then
            echo "PR #${PR_NUMBER}: final AI review not required."
            exit 0
          fi

          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=needs-ai-review' >/dev/null
          echo "PR #${PR_NUMBER}: final needs-ai-review applied after Validate (${reason}; Codex fallback eligible=${fallback_eligible})."

          reviews_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[]' | jq -s '.')"
          current_review_count="$(jq -r --arg sha "$HEAD_SHA" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)] | length' <<< "$reviews_json")"

          if [ "$current_review_count" -gt 0 ]; then
            echo "Current-head CodeRabbit review already exists; no new review requested."
            exit 0
          fi

          marker="<!-- proffera-coderabbit-final-review-request:${HEAD_SHA} -->"
          comments_json="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[]' | jq -s '.')"
          request_count="$(jq -r --arg marker "$marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | length' <<< "$comments_json")"

          if [ "$request_count" -eq 0 ]; then
            review_body="$(printf '%s\n%s\n' "$marker" '@coderabbitai review')"
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$review_body" >/dev/null
            echo "Requested one final primary CodeRabbit review for current head $HEAD_SHA."
          else
            echo "Final CodeRabbit review was already requested for current head $HEAD_SHA."
          fi

  e2e_public_smoke_run:
    name: E2E public smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: [governance, ci_scope]
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e # v1.62.1-noble
      options: --user 1001

    steps:
      - name: Checkout
        if: needs.ci_scope.outputs.e2e == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: needs.ci_scope.outputs.e2e == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies
        if: needs.ci_scope.outputs.e2e == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install E2E dependencies
        if: needs.ci_scope.outputs.e2e == 'true'
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Run non-destructive public smoke tests
        if: needs.ci_scope.outputs.e2e == 'true'
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm test

      - name: Report targeted E2E skip
        if: needs.ci_scope.outputs.e2e != 'true'
        run: echo "Targeted CI skipped the browser smoke execution for this scope."

  e2e_public_smoke:
    name: E2E public smoke
    if: always()
    needs: [e2e_public_smoke_run, route_ai_review]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      pull-requests: write

    steps:
      - name: Require successful browser smoke and final current-head AI review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_RUN_RESULT: ${{ needs.e2e_public_smoke_run.result }}
          ROUTE_RESULT: ${{ needs.route_ai_review.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$E2E_RUN_RESULT" != "success" ]; then
            echo "Refused: E2E public smoke run did not succeed ($E2E_RUN_RESULT)."
            exit 1
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push build: browser smoke succeeded; PR review gate is not applicable."
            exit 0
          fi

          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "Refused: AI review routing did not succeed ($ROUTE_RESULT)."
            exit 1
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"

          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "Refused: gate head $HEAD_SHA is stale; current PR head is $current_head_sha."
            exit 1
          fi

          if [ "$author" = "dependabot[bot]" ]; then
            echo "Dependabot PR: AI review gate is exempt."
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            echo "Draft PR: browser smoke passed; final AI review is deferred until ready_for_review."
            exit 0
          fi

          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')"
          reported_file_count="$(jq -r '.changed_files' <<< "$pr_json")"
          file_count=0
          needs_review=false
          fallback_eligible=false
          reason=""
          file_list_complete=true

          if ! [[ "$reported_file_count" =~ ^[0-9]+$ ]]; then
            needs_review=true
            fallback_eligible=false
            file_list_complete=false
            reason="invalid changed-file count"
          elif [ "$reported_file_count" -gt 3000 ]; then
            needs_review=true
            fallback_eligible=false
            file_list_complete=false
            reason="changed-file list exceeds GitHub's 3000-file API limit"
          else
            file_count="$reported_file_count"
          fi

          if [ "$file_list_complete" = "true" ] && [ "$file_count" -ge 12 ]; then
            needs_review=true
            fallback_eligible=true
            reason="large change (${file_count} files)"
          fi

          if [ "$file_list_complete" = "true" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue

              case "$file" in
                .github/workflows/*|db/migrations/*|migrations/*|src/app/api/*|src/app/privacy/*|src/app/privacy/**|*/privacy/*|src/app/admin/foretag/directory/*|src/app/admin/foretag/directory/**|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock|*/package-lock.json|*/pnpm-lock.yaml|*/yarn.lock|vercel.json|next.config.*|src/proxy.*|middleware.*|scripts/company-directory-discovery.py)
                  needs_review=true
                  fallback_eligible=false
                  reason="sensitive path: $file"
                  break
                  ;;
              esac

              if [[ "$file" =~ (^|/)(auth|rbac|permissions?|tenant|workspace|billing|payments?|stripe|checkout|webhooks?|db|database|postgres|neon)(/|[._-]) ]] ||
                 [[ "$file" =~ company[-_]directory ]] ||
                 [[ "$file" =~ (^|/)\.env ]]; then
                needs_review=true
                fallback_eligible=false
                reason="sensitive domain: $file"
                break
              fi
            done <<< "$changed_files"
          fi

          if [ "$needs_review" != "true" ]; then
            echo "PR #${PR_NUMBER}: browser smoke passed and AI review is not required."
            exit 0
          fi

          labels="$(jq -r '.labels[].name' <<< "$pr_json")"
          if ! grep -Fxq 'needs-ai-review' <<< "$labels"; then
            echo "Refused: risk-routed PR needs one final AI review (${reason}). Keep it draft during development, then mark it ready when the code is final."
            exit 1
          fi

          echo "Final AI review required (${reason}); CodeRabbit is primary and Codex fallback eligible=${fallback_eligible} on head $HEAD_SHA."

          for attempt in $(seq 1 40); do
            loop_head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [ "$loop_head_sha" != "$HEAD_SHA" ]; then
              echo "Refused: review gate became stale; current PR head is $loop_head_sha, gate head is $HEAD_SHA."
              exit 1
            fi

            reviews_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[]' | jq -s '.')"
            current_reviews="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)]' <<< "$reviews_json")"
            latest_changes="$(jq -r '[.[] | select(.state == "CHANGES_REQUESTED") | .submitted_at] | max // empty' <<< "$current_reviews")"
            latest_approval="$(jq -r '[.[] | select(.state == "APPROVED") | .submitted_at] | max // empty' <<< "$current_reviews")"
            terminal_count="$(jq -r '[.[] | select(.state == "APPROVED" or .state == "COMMENTED")] | length' <<< "$current_reviews")"

            comments_json="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[]' | jq -s '.')"
            clean_summary_count="$(jq -r --arg sha "$HEAD_SHA" '
              [
                .[]
                | select(.user.login == "coderabbitai[bot]")
                | select(
                    (.body // "")
                    | test(
                        "<!-- recent_review_start -->[\\s\\S]*No actionable comments were generated in the recent review\\.[\\s\\S]*"
                        + $sha
                        + "[\\s\\S]*<!-- recent_review_end -->"
                      )
                  )
              ]
              | length
            ' <<< "$comments_json")"

            if [ -n "$latest_changes" ]; then
              if [ -n "$latest_approval" ] && [[ "$latest_approval" > "$latest_changes" ]]; then
                echo "CodeRabbit approved the current head after its latest change request."
                exit 0
              fi
              echo "CodeRabbit changes remain requested for current head; Codex fallback cannot clear them."
              exit 1
            fi

            if [ "$terminal_count" -gt 0 ]; then
              echo "CodeRabbit completed a non-blocking review for the current head."
              exit 0
            fi

            if [ "$clean_summary_count" -gt 0 ]; then
              echo "CodeRabbit completed a clean current-head review with no actionable comments."
              exit 0
            fi

            if [ "$fallback_eligible" = "true" ]; then
              coderabbit_marker="<!-- proffera-coderabbit-final-review-request:${HEAD_SHA} -->"
              coderabbit_request_time="$(jq -r --arg marker "$coderabbit_marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | .created_at] | max // empty' <<< "$comments_json")"
              coderabbit_unavailable=false

              if [ -n "$coderabbit_request_time" ]; then
                unavailable_count="$(jq -r --arg request_time "$coderabbit_request_time" '
                  [
                    .[]
                    | select(.user.login == "coderabbitai[bot]")
                    | select((.updated_at // .created_at) >= $request_time)
                    | select((.body // "") | test("Review limit reached|Review rate limited|Action not completed: Review rate limited|Review skipped|temporarily unavailable|service unavailable"; "i"))
                  ]
                  | length
                ' <<< "$comments_json")"
                if [ "$unavailable_count" -gt 0 ]; then
                  coderabbit_unavailable=true
                  echo "Machine-observed CodeRabbit availability failure; Codex fallback is allowed for this medium-risk PR."
                fi
              fi

              if [ "$attempt" -ge 20 ] && [ "$coderabbit_unavailable" != "true" ]; then
                coderabbit_unavailable=true
                echo "CodeRabbit availability timeout reached; Codex fallback is allowed for this medium-risk PR."
              fi

              if [ "$coderabbit_unavailable" = "true" ]; then
                codex_marker="<!-- proffera-codex-fallback-review-request:${HEAD_SHA} -->"
                codex_request_id="$(jq -r --arg marker "$codex_marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | sort_by(.created_at) | last | .id // empty' <<< "$comments_json")"
                codex_request_time="$(jq -r --arg marker "$codex_marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | sort_by(.created_at) | last | .created_at // empty' <<< "$comments_json")"

                if [ -z "$codex_request_id" ] || [ -z "$codex_request_time" ]; then
                  codex_body="$(printf '%s\n%s\n' "$codex_marker" '@codex review')"
                  codex_response="$(gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$codex_body")"
                  codex_request_id="$(jq -r '.id' <<< "$codex_response")"
                  codex_request_time="$(jq -r '.created_at' <<< "$codex_response")"
                  echo "Requested Codex fallback review for exact head $HEAD_SHA."
                fi

                reactions_json="$(gh api --paginate "repos/${REPOSITORY}/issues/comments/${codex_request_id}/reactions?per_page=100" --jq '.[]' | jq -s '.')"
                codex_clean_count="$(jq -r --arg request_time "$codex_request_time" '
                  [
                    .[]
                    | select(.user.login == "chatgpt-codex-connector[bot]")
                    | select(.content == "+1")
                    | select(.created_at >= $request_time)
                  ]
                  | length
                ' <<< "$reactions_json")"

                codex_reviews_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[]' | jq -s '.')"
                codex_approval_count="$(jq -r --arg sha "$HEAD_SHA" --arg request_time "$codex_request_time" '
                  [
                    .[]
                    | select(.user.login == "chatgpt-codex-connector[bot]")
                    | select(.commit_id == $sha)
                    | select(.state == "APPROVED")
                    | select(.submitted_at >= $request_time)
                  ]
                  | length
                ' <<< "$codex_reviews_json")"

                codex_inline_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/comments?per_page=100" --jq '.[]' | jq -s '.')"
                codex_inline_count="$(jq -r --arg sha "$HEAD_SHA" --arg request_time "$codex_request_time" '
                  [
                    .[]
                    | select(.user.login == "chatgpt-codex-connector[bot]")
                    | select(.commit_id == $sha)
                    | select(.created_at >= $request_time)
                  ]
                  | length
                ' <<< "$codex_inline_json")"

                if [ "$codex_inline_count" -gt 0 ]; then
                  echo "Codex fallback posted current-head review findings; the gate remains blocked until code changes and a new exact-head run."
                  exit 1
                fi

                if [ "$codex_clean_count" -gt 0 ] || [ "$codex_approval_count" -gt 0 ]; then
                  guard_head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
                  if [ "$guard_head_sha" != "$HEAD_SHA" ]; then
                    echo "Refused: Codex fallback became stale; current PR head is $guard_head_sha, gate head is $HEAD_SHA."
                    exit 1
                  fi

                  guard_reviews_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[]' | jq -s '.')"
                  guard_current_reviews="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)]' <<< "$guard_reviews_json")"
                  guard_latest_changes="$(jq -r '[.[] | select(.state == "CHANGES_REQUESTED") | .submitted_at] | max // empty' <<< "$guard_current_reviews")"
                  guard_latest_approval="$(jq -r '[.[] | select(.state == "APPROVED") | .submitted_at] | max // empty' <<< "$guard_current_reviews")"

                  if [ -n "$guard_latest_changes" ] && { [ -z "$guard_latest_approval" ] || [[ ! "$guard_latest_approval" > "$guard_latest_changes" ]]; }; then
                    echo "CodeRabbit changes were recorded while Codex fallback was running; Codex cannot clear them."
                    sleep 15
                    continue
                  fi

                  echo "Codex fallback completed clean for the current unchanged head after CodeRabbit availability failure."
                  exit 0
                fi

                echo "Codex fallback has not recorded a clean current-head result yet."
              else
                echo "No completed CodeRabbit review yet; fallback is not active before an availability failure or bounded timeout."
              fi
            else
              echo "No completed CodeRabbit review for current head yet; this high-risk path is CodeRabbit-only."
              exit 1
            fi

            sleep 15
          done

          if [ "$fallback_eligible" = "true" ]; then
            echo "Refused: no acceptable CodeRabbit or Codex fallback decision was recorded for the current head within the gate window."
          else
            echo "Refused: no acceptable CodeRabbit decision was recorded for the current head within the gate window."
          fi
          exit 1
