name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: proffera-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reset_review_label:
    name: Reset AI review route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # This repository's GITHUB_TOKEN requires Pull Requests write for PR label mutation.
      pull-requests: write

    steps:
      - name: Clear stale final-review state after new code
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          if gh api --method DELETE \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/needs-ai-review" \
            >/dev/null 2>"$error_file"; then
            echo "Cleared stale needs-ai-review from PR #${PR_NUMBER} after new code."
          else
            error_text="$(cat "$error_file")"
            if grep -Fq '(HTTP 404)' <<< "$error_text"; then
              echo "needs-ai-review was already absent from PR #${PR_NUMBER}."
            else
              cat "$error_file" >&2
              echo "Refused: could not reset AI review routing state." >&2
              exit 1
            fi
          fi

      - name: Keep final-review state on non-code events
        if: github.event.action != 'synchronize'
        run: echo "No new code on this event; final-review state is unchanged."

  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Governance
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: worker bootstrap/branch/documentation declaration checks are exempt."
            exit 0
          fi

          if [[ "$HEAD_REF" != work/proffera-* ]]; then
            echo "Refused: AI/product PR branches must use work/proffera-*; got '$HEAD_REF'."
            exit 1
          fi

          if ! grep -Fqi "Worker bootstrap: complete" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Worker bootstrap: complete'."
            exit 1
          fi

          if ! grep -Fqi "Supervisor handoff: #548" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Supervisor handoff: #548'."
            exit 1
          fi

          task_value="$(sed -nE 's/^[[:space:]]*Task\/issue:[[:space:]]*(.+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1)"
          if [ -z "$task_value" ] || [[ "$task_value" == *"<"* ]]; then
            echo "Refused: PR body must contain a concrete 'Task/issue:' value (issue number or user-request)."
            exit 1
          fi

          bootstrap_sha="$(sed -nE 's/^[[:space:]]*Bootstrap baseline:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1 | tr '[:upper:]' '[:lower:]')"
          expected_base_sha="$(tr '[:upper:]' '[:lower:]' <<< "$BASE_SHA")"
          if [ -z "$bootstrap_sha" ]; then
            echo "Refused: PR body must contain 'Bootstrap baseline:' followed by a 40-character commit SHA."
            exit 1
          fi
          if [ "$bootstrap_sha" != "$expected_base_sha" ]; then
            echo "Refused: bootstrap baseline '$bootstrap_sha' does not match current PR base '$expected_base_sha'. Refresh the graph from current main and update the PR handoff."
            exit 1
          fi

          updated_count="$(grep -Fic "Documentation impact: updated" <<< "$PR_BODY" || true)"
          none_count="$(grep -Fic "Documentation impact: none" <<< "$PR_BODY" || true)"
          if [ "$updated_count" -gt 0 ] && [ "$none_count" -gt 0 ]; then
            echo "Refused: keep exactly one Documentation impact declaration."
            exit 1
          fi

          if [ "$updated_count" -gt 0 ]; then
            changed_files="$(gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" --name-only)"
            if ! grep -Fxq "docs/CURRENT_STATUS.md" <<< "$changed_files"; then
              echo "Refused: PR declares documentation updated but docs/CURRENT_STATUS.md is unchanged."
              exit 1
            fi
            echo "Documentation impact declared updated and canonical status file changed."
          elif [ "$none_count" -gt 0 ]; then
            echo "Documentation impact explicitly declared none."
          else
            echo "Refused: PR body must contain exactly one of 'Documentation impact: updated' or 'Documentation impact: none'."
            exit 1
          fi

          echo "Worker bootstrap governance passed for base $expected_base_sha."

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate discovery worker
        run: |
          python3 -m py_compile scripts/company-directory-discovery.py
          python3 tests/test_company_directory_discovery_worker.py

      - name: Build
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check

  route_ai_review:
    name: AI review route
    if: github.event_name == 'pull_request'
    needs: [validate, reset_review_label]
    runs-on: ubuntu-latest
    permissions:
      # Write permission is limited to PR labels/comments; this job never checks out PR code.
      pull-requests: write

    steps:
      - name: Route one final sensitive review to CodeRabbit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"

          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "Refused: CI head $HEAD_SHA is stale; current PR head is $current_head_sha."
            exit 1
          fi

          if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
            echo "AI review routing skipped for draft/Dependabot PR."
            exit 0
          fi

          changed_files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          file_count="$(grep -c . <<< "$changed_files" || true)"
          needs_review=false
          reason=""

          if [ "$file_count" -ge 12 ]; then
            needs_review=true
            reason="large change (${file_count} files)"
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              .github/workflows/*|db/migrations/*|migrations/*|src/app/api/*|package.json|package-lock.json|vercel.json|next.config.*|src/proxy.*|middleware.*|scripts/company-directory-discovery.py)
                needs_review=true
                reason="sensitive path: $file"
                break
                ;;
            esac

            if [[ "$file" =~ (^|/)(auth|rbac|permissions?|tenant|workspace|billing|payments?|stripe|checkout|webhooks?|db|database|postgres|neon)(/|[._-]) ]] ||
               [[ "$file" =~ company[-_]directory ]] ||
               [[ "$file" =~ (^|/)\.env ]]; then
              needs_review=true
              reason="sensitive domain: $file"
              break
            fi
          done <<< "$changed_files"

          if [ "$needs_review" != "true" ]; then
            echo "PR #${PR_NUMBER}: CodeRabbit review not required."
            exit 0
          fi

          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=needs-ai-review' >/dev/null
          echo "PR #${PR_NUMBER}: final needs-ai-review applied after Validate (${reason})."

          reviews_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[]' | jq -s '.')"
          current_review_count="$(jq -r --arg sha "$HEAD_SHA" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)] | length' <<< "$reviews_json")"

          if [ "$current_review_count" -gt 0 ]; then
            echo "Current-head CodeRabbit review already exists; no new review requested."
            exit 0
          fi

          marker="<!-- proffera-coderabbit-final-review-request:${HEAD_SHA} -->"
          comments_json="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[]' | jq -s '.')"
          request_count="$(jq -r --arg marker "$marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | length' <<< "$comments_json")"

          if [ "$request_count" -eq 0 ]; then
            review_body="$(printf '%s\n%s\n' "$marker" '@coderabbitai review')"
            gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$review_body" >/dev/null
            echo "Requested one final CodeRabbit review for current head $HEAD_SHA."
          else
            echo "Final CodeRabbit review was already requested for current head $HEAD_SHA."
          fi

  e2e_public_smoke_run:
    name: E2E public smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: validate
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Run non-destructive public smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm test

  e2e_public_smoke:
    name: E2E public smoke
    if: always()
    needs: [e2e_public_smoke_run, route_ai_review]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      # Metadata-only final gate: it never checks out or executes PR code.
      pull-requests: read

    steps:
      - name: Require successful browser smoke and final current-head AI review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_RUN_RESULT: ${{ needs.e2e_public_smoke_run.result }}
          ROUTE_RESULT: ${{ needs.route_ai_review.result }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$E2E_RUN_RESULT" != "success" ]; then
            echo "Refused: E2E public smoke run did not succeed ($E2E_RUN_RESULT)."
            exit 1
          fi

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push build: browser smoke succeeded; PR review gate is not applicable."
            exit 0
          fi

          if [ "$ROUTE_RESULT" != "success" ]; then
            echo "Refused: AI review routing did not succeed ($ROUTE_RESULT)."
            exit 1
          fi

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"

          if [ "$current_head_sha" != "$HEAD_SHA" ]; then
            echo "Refused: gate head $HEAD_SHA is stale; current PR head is $current_head_sha."
            exit 1
          fi

          if [ "$author" = "dependabot[bot]" ]; then
            echo "Dependabot PR: AI review gate is exempt."
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            echo "Draft PR: browser smoke passed; final CodeRabbit review is deferred until ready_for_review."
            exit 0
          fi

          changed_files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          file_count="$(grep -c . <<< "$changed_files" || true)"
          needs_review=false
          reason=""

          if [ "$file_count" -ge 12 ]; then
            needs_review=true
            reason="large change (${file_count} files)"
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              .github/workflows/*|db/migrations/*|migrations/*|src/app/api/*|package.json|package-lock.json|vercel.json|next.config.*|src/proxy.*|middleware.*|scripts/company-directory-discovery.py)
                needs_review=true
                reason="sensitive path: $file"
                break
                ;;
            esac

            if [[ "$file" =~ (^|/)(auth|rbac|permissions?|tenant|workspace|billing|payments?|stripe|checkout|webhooks?|db|database|postgres|neon)(/|[._-]) ]] ||
               [[ "$file" =~ company[-_]directory ]] ||
               [[ "$file" =~ (^|/)\.env ]]; then
              needs_review=true
              reason="sensitive domain: $file"
              break
            fi
          done <<< "$changed_files"

          if [ "$needs_review" != "true" ]; then
            echo "PR #${PR_NUMBER}: browser smoke passed and AI review is not required."
            exit 0
          fi

          labels="$(jq -r '.labels[].name' <<< "$pr_json")"
          if ! grep -Fxq 'needs-ai-review' <<< "$labels"; then
            echo "Refused: sensitive PR needs one final CodeRabbit review (${reason}). Keep it draft during development, then mark it ready when the code is final."
            exit 1
          fi

          echo "Sensitive PR is in final review (${reason}); waiting for CodeRabbit on head $HEAD_SHA."

          for attempt in $(seq 1 40); do
            loop_head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            if [ "$loop_head_sha" != "$HEAD_SHA" ]; then
              echo "Refused: review gate became stale; current PR head is $loop_head_sha, gate head is $HEAD_SHA."
              exit 1
            fi

            reviews_json="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" --jq '.[]' | jq -s '.')"
            current_reviews="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)]' <<< "$reviews_json")"
            latest_changes="$(jq -r '[.[] | select(.state == "CHANGES_REQUESTED") | .submitted_at] | max // empty' <<< "$current_reviews")"
            latest_approval="$(jq -r '[.[] | select(.state == "APPROVED") | .submitted_at] | max // empty' <<< "$current_reviews")"
            terminal_count="$(jq -r '[.[] | select(.state == "APPROVED" or .state == "COMMENTED")] | length' <<< "$current_reviews")"

            comments_json="$(gh api --paginate "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --jq '.[]' | jq -s '.')"
            clean_summary_count="$(jq -r --arg sha "$HEAD_SHA" '
              [
                .[]
                | select(.user.login == "coderabbitai[bot]")
                | select(
                    (.body // "")
                    | test(
                        "<!-- recent_review_start -->[\\s\\S]*No actionable comments were generated in the recent review\\.[\\s\\S]*"
                        + $sha
                        + "[\\s\\S]*<!-- recent_review_end -->"
                      )
                  )
              ]
              | length
            ' <<< "$comments_json")"

            if [ -n "$latest_changes" ]; then
              if [ -n "$latest_approval" ] && [[ "$latest_approval" > "$latest_changes" ]]; then
                echo "CodeRabbit approved the current head after its latest change request."
                exit 0
              fi
              echo "CodeRabbit changes remain requested for current head; only a later APPROVED review clears them."
            elif [ "$terminal_count" -gt 0 ]; then
              echo "CodeRabbit completed a non-blocking review for the current head."
              exit 0
            elif [ "$clean_summary_count" -gt 0 ]; then
              echo "CodeRabbit completed a clean current-head review with no actionable comments."
              exit 0
            else
              echo "No completed CodeRabbit review for current head yet."
            fi

            sleep 15
          done

          echo "Refused: no acceptable CodeRabbit decision was recorded for the current head within the gate window."
          exit 1
