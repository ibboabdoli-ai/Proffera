name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Governance
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: worker bootstrap/branch/documentation declaration checks are exempt."
            exit 0
          fi

          if [[ "$HEAD_REF" != work/proffera-* ]]; then
            echo "Refused: AI/product PR branches must use work/proffera-*; got '$HEAD_REF'."
            exit 1
          fi

          if ! grep -Fqi "Worker bootstrap: complete" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Worker bootstrap: complete'."
            exit 1
          fi

          if ! grep -Fqi "Supervisor handoff: #548" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Supervisor handoff: #548'."
            exit 1
          fi

          task_value="$(sed -nE 's/^[[:space:]]*Task\/issue:[[:space:]]*(.+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1)"
          if [ -z "$task_value" ] || [[ "$task_value" == *"<"* ]]; then
            echo "Refused: PR body must contain a concrete 'Task/issue:' value (issue number or user-request)."
            exit 1
          fi

          bootstrap_sha="$(sed -nE 's/^[[:space:]]*Bootstrap baseline:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1 | tr '[:upper:]' '[:lower:]')"
          expected_base_sha="$(tr '[:upper:]' '[:lower:]' <<< "$BASE_SHA")"
          if [ -z "$bootstrap_sha" ]; then
            echo "Refused: PR body must contain 'Bootstrap baseline:' followed by a 40-character commit SHA."
            exit 1
          fi
          if [ "$bootstrap_sha" != "$expected_base_sha" ]; then
            echo "Refused: bootstrap baseline '$bootstrap_sha' does not match current PR base '$expected_base_sha'. Refresh the graph from current main and update the PR handoff."
            exit 1
          fi

          updated_count="$(grep -Fic "Documentation impact: updated" <<< "$PR_BODY" || true)"
          none_count="$(grep -Fic "Documentation impact: none" <<< "$PR_BODY" || true)"
          if [ "$updated_count" -gt 0 ] && [ "$none_count" -gt 0 ]; then
            echo "Refused: keep exactly one Documentation impact declaration."
            exit 1
          fi

          if [ "$updated_count" -gt 0 ]; then
            changed_files="$(gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" --name-only)"
            if ! grep -Fxq "docs/CURRENT_STATUS.md" <<< "$changed_files"; then
              echo "Refused: PR declares documentation updated but docs/CURRENT_STATUS.md is unchanged."
              exit 1
            fi
            echo "Documentation impact declared updated and canonical status file changed."
          elif [ "$none_count" -gt 0 ]; then
            echo "Documentation impact explicitly declared none."
          else
            echo "Refused: PR body must contain exactly one of 'Documentation impact: updated' or 'Documentation impact: none'."
            exit 1
          fi

          echo "Worker bootstrap governance passed for base $expected_base_sha."

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate discovery worker
        run: |
          python3 -m py_compile scripts/company-directory-discovery.py
          python3 tests/test_company_directory_discovery_worker.py

      - name: Build
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check

  e2e-public-smoke:
    name: E2E public smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Run non-destructive public smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm test
