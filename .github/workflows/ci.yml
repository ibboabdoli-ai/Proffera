name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: proffera-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reset_review_label:
    name: Reset AI review route
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Clear stale final-review state after new code
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          error_file="$(mktemp)"
          if gh api --method DELETE \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/needs-ai-review" \
            >/dev/null 2>"$error_file"; then
            echo "Cleared stale needs-ai-review from PR #${PR_NUMBER} after new code."
          else
            error_text="$(cat "$error_file")"
            if grep -Fq '(HTTP 404)' <<< "$error_text"; then
              echo "needs-ai-review was already absent from PR #${PR_NUMBER}."
            else
              cat "$error_file" >&2
              echo "Refused: could not reset AI review routing state." >&2
              exit 1
            fi
          fi

      - name: Keep final-review state on non-code events
        if: github.event.action != 'synchronize'
        run: echo "No new code on this event; final-review state is unchanged."

  governance:
    name: Governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Worker bootstrap governance
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR: worker bootstrap/branch/documentation declaration checks are exempt."
            exit 0
          fi

          if [[ "$HEAD_REF" != work/proffera-* ]]; then
            echo "Refused: AI/product PR branches must use work/proffera-*; got '$HEAD_REF'."
            exit 1
          fi

          if ! grep -Fqi "Worker bootstrap: complete" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Worker bootstrap: complete'."
            exit 1
          fi

          if ! grep -Fqi "Supervisor handoff: #548" <<< "$PR_BODY"; then
            echo "Refused: PR body must contain 'Supervisor handoff: #548'."
            exit 1
          fi

          task_value="$(sed -nE 's/^[[:space:]]*Task\/issue:[[:space:]]*(.+)[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1)"
          if [ -z "$task_value" ] || [[ "$task_value" == *"<"* ]]; then
            echo "Refused: PR body must contain a concrete 'Task/issue:' value (issue number or user-request)."
            exit 1
          fi

          bootstrap_sha="$(sed -nE 's/^[[:space:]]*Bootstrap baseline:[[:space:]]*([0-9a-fA-F]{40})[[:space:]]*$/\1/p' <<< "$PR_BODY" | head -n1 | tr '[:upper:]' '[:lower:]')"
          expected_base_sha="$(tr '[:upper:]' '[:lower:]' <<< "$BASE_SHA")"
          if [ -z "$bootstrap_sha" ]; then
            echo "Refused: PR body must contain 'Bootstrap baseline:' followed by a 40-character commit SHA."
            exit 1
          fi
          if [ "$bootstrap_sha" != "$expected_base_sha" ]; then
            echo "Refused: bootstrap baseline '$bootstrap_sha' does not match current PR base '$expected_base_sha'. Refresh the graph from current main and update the PR handoff."
            exit 1
          fi

          updated_count="$(grep -Fic "Documentation impact: updated" <<< "$PR_BODY" || true)"
          none_count="$(grep -Fic "Documentation impact: none" <<< "$PR_BODY" || true)"
          if [ "$updated_count" -gt 0 ] && [ "$none_count" -gt 0 ]; then
            echo "Refused: keep exactly one Documentation impact declaration."
            exit 1
          fi

          if [ "$updated_count" -gt 0 ]; then
            changed_files="$(gh pr diff "$PR_NUMBER" --repo "$REPOSITORY" --name-only)"
            if ! grep -Fxq "docs/CURRENT_STATUS.md" <<< "$changed_files"; then
              echo "Refused: PR declares documentation updated but docs/CURRENT_STATUS.md is unchanged."
              exit 1
            fi
            echo "Documentation impact declared updated and canonical status file changed."
          elif [ "$none_count" -gt 0 ]; then
            echo "Documentation impact explicitly declared none."
          else
            echo "Refused: PR body must contain exactly one of 'Documentation impact: updated' or 'Documentation impact: none'."
            exit 1
          fi

          echo "Worker bootstrap governance passed for base $expected_base_sha."

      - name: Push event governance
        if: github.event_name != 'pull_request'
        run: |
          echo "Push event: PR bootstrap governance is not applicable."

  risk:
    name: PR risk classification
    if: github.event_name == 'pull_request'
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review_risk: ${{ steps.classify.outputs.review_risk }}
      ai_review_required: ${{ steps.classify.outputs.ai_review_required }}
      human_merge_required: ${{ steps.classify.outputs.human_merge_required }}
      db_tests_required: ${{ steps.classify.outputs.db_tests_required }}
      production_impact: ${{ steps.classify.outputs.production_impact }}
      reason_summary: ${{ steps.classify.outputs.reason_summary }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Classify changed graph paths once
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '.[].filename')"
          classification="$(printf '%s\n' "$changed_files" | node scripts/ci/classify-pr-risk.mjs)"
          echo "$classification" | jq .

          echo "review_risk=$(jq -r '.reviewRisk' <<< "$classification")" >> "$GITHUB_OUTPUT"
          echo "ai_review_required=$(jq -r '.aiReviewRequired' <<< "$classification")" >> "$GITHUB_OUTPUT"
          echo "human_merge_required=$(jq -r '.humanMergeRequired' <<< "$classification")" >> "$GITHUB_OUTPUT"
          echo "db_tests_required=$(jq -r '.dbTestsRequired' <<< "$classification")" >> "$GITHUB_OUTPUT"
          echo "production_impact=$(jq -r '.productionImpact' <<< "$classification")" >> "$GITHUB_OUTPUT"
          echo "reason_summary=$(jq -r 'if (.reasons | length) == 0 then "low-risk" else (.reasons | join(", ")) end' <<< "$classification")" >> "$GITHUB_OUTPUT"

  static_checks:
    name: Static checks
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check whitespace errors
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA"
            exit 0
          fi
          if [[ "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git show --check --format= "$PUSH_HEAD_SHA"
            exit 0
          fi
          git diff --check "$PUSH_BEFORE_SHA" "$PUSH_HEAD_SHA"

  unit_tests:
    name: Unit and worker tests
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Validate discovery worker
        run: |
          python3 -m py_compile scripts/company-directory-discovery.py
          python3 tests/test_company_directory_discovery_worker.py

  build:
    name: Build
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  validate:
    name: Validate
    if: always()
    needs: [governance, static_checks, unit_tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require all core quality checks
        env:
          GOVERNANCE_RESULT: ${{ needs.governance.result }}
          STATIC_RESULT: ${{ needs.static_checks.result }}
          TEST_RESULT: ${{ needs.unit_tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GOVERNANCE_RESULT" = "success" ] || { echo "Refused: governance did not succeed ($GOVERNANCE_RESULT)."; exit 1; }
          [ "$STATIC_RESULT" = "success" ] || { echo "Refused: static checks did not succeed ($STATIC_RESULT)."; exit 1; }
          [ "$TEST_RESULT" = "success" ] || { echo "Refused: unit/worker tests did not succeed ($TEST_RESULT)."; exit 1; }
          [ "$BUILD_RESULT" = "success" ] || { echo "Refused: build did not succeed ($BUILD_RESULT)."; exit 1; }
          echo "All governance and parallel core quality checks succeeded."

  route_ai_review:
    name: AI review route
    if: github.event_name == 'pull_request'
    needs: [validate, reset_review_label, risk]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Route one provider-neutral final review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_REQUIRED: ${{ needs.risk.outputs.ai_review_required }}
          REVIEW_RISK: ${{ needs.risk.outputs.review_risk }}
          REASON_SUMMARY: ${{ needs.risk.outputs.reason_summary }}
        shell: bash
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          current_head_sha="$(jq -r '.head.sha' <<< "$pr_json")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"

          [ "$current_head_sha" = "$HEAD_SHA" ] || { echo "Refused: routing head $HEAD_SHA is stale; current PR head is $current_head_sha."; exit 1; }

          if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ]; then
            echo "AI review routing deferred for draft/Dependabot PR."
            exit 0
          fi

          if [ "$AI_REVIEW_REQUIRED" != "true" ]; then
            echo "PR #${PR_NUMBER}: AI review is not required (risk=${REVIEW_RISK})."
            exit 0
          fi

          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels" -f 'labels[]=needs-ai-review' >/dev/null
          echo "PR #${PR_NUMBER}: needs-ai-review applied (risk=${REVIEW_RISK}; ${REASON_SUMMARY})."

          REVIEW_GATE_MODE=route bash scripts/ci/review-gate.sh

  e2e_public_smoke_run:
    name: E2E public smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: governance
    container:
      image: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e # v1.62.1-noble
      options: --user 1001

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Install app dependencies
        run: npm ci --no-audit --no-fund

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Run non-destructive public smoke tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: npm test

  ai_review_gate:
    name: AI review gate
    if: github.event_name == 'pull_request'
    needs: [validate, route_ai_review, risk]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Require acceptable exact-head review when routed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AI_REVIEW_REQUIRED: ${{ needs.risk.outputs.ai_review_required }}
          ROUTE_RESULT: ${{ needs.route_ai_review.result }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$ROUTE_RESULT" = "success" ] || { echo "Refused: AI review routing did not succeed ($ROUTE_RESULT)."; exit 1; }

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          is_draft="$(jq -r '.draft' <<< "$pr_json")"
          author="$(jq -r '.user.login' <<< "$pr_json")"

          if [ "$is_draft" = "true" ] || [ "$author" = "dependabot[bot]" ] || [ "$AI_REVIEW_REQUIRED" != "true" ]; then
            echo "AI review gate not required for this PR state/risk."
            exit 0
          fi

          labels="$(jq -r '.labels[].name' <<< "$pr_json")"
          grep -Fxq 'needs-ai-review' <<< "$labels" || { echo "Refused: routed PR is missing needs-ai-review."; exit 1; }

          REVIEW_GATE_MODE=wait bash scripts/ci/review-gate.sh

  e2e_public_smoke:
    name: E2E public smoke
    if: always()
    needs: [e2e_public_smoke_run, route_ai_review, ai_review_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Compatibility final gate for browser, review, and CodeQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          E2E_RUN_RESULT: ${{ needs.e2e_public_smoke_run.result }}
          ROUTE_RESULT: ${{ needs.route_ai_review.result }}
          AI_GATE_RESULT: ${{ needs.ai_review_gate.result }}
        shell: bash
        run: |
          set -euo pipefail

          [ "$E2E_RUN_RESULT" = "success" ] || { echo "Refused: browser E2E public smoke did not succeed ($E2E_RUN_RESULT)."; exit 1; }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Push build: browser smoke succeeded; PR review/CodeQL compatibility gate is not applicable."
            exit 0
          fi

          [ "$ROUTE_RESULT" = "success" ] || { echo "Refused: AI review route did not succeed ($ROUTE_RESULT)."; exit 1; }
          [ "$AI_GATE_RESULT" = "success" ] || { echo "Refused: AI review gate did not succeed ($AI_GATE_RESULT)."; exit 1; }

          for attempt in $(seq 1 40); do
            check_runs="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100")"
            codeql="$(jq -c '[.check_runs[] | select(.name == "Analyze JavaScript/TypeScript")] | sort_by(.started_at // .created_at) | last // empty' <<< "$check_runs")"

            if [ -n "$codeql" ]; then
              status="$(jq -r '.status' <<< "$codeql")"
              conclusion="$(jq -r '.conclusion // empty' <<< "$codeql")"
              if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
                echo "Browser E2E, AI review, and exact-head CodeQL all succeeded."
                exit 0
              fi
              if [ "$status" = "completed" ] && [ "$conclusion" != "success" ]; then
                echo "Refused: exact-head CodeQL completed with conclusion '$conclusion'."
                exit 1
              fi
            fi

            echo "Waiting for exact-head CodeQL (attempt ${attempt}/40)."
            sleep 15
          done

          echo "Refused: exact-head CodeQL did not complete successfully within the bounded compatibility-gate window."
          exit 1
