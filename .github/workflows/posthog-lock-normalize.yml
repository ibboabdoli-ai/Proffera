name: Temporary PostHog lock normalize

on:
  push:
    branches:
      - work/proffera-posthog-privacy-safe-analytics

permissions:
  contents: write

jobs:
  normalize-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/proffera-posthog-privacy-safe-analytics
          fetch-depth: 0

      - name: Preserve baseline metadata and add only new PostHog package entries
        env:
          BASELINE_SHA: 6d8faaa27dc8ef324f1b8225d37d06ae5b9142fb
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASELINE_SHA:package-lock.json" > /tmp/package-lock.baseline.json
          cp package-lock.json /tmp/package-lock.generated.json
          node <<'NODE'
          const fs = require('node:fs')
          const baseline = JSON.parse(fs.readFileSync('/tmp/package-lock.baseline.json', 'utf8'))
          const generated = JSON.parse(fs.readFileSync('/tmp/package-lock.generated.json', 'utf8'))

          baseline.packages[''].dependencies['posthog-js'] = '1.422.5'
          for (const [key, value] of Object.entries(generated.packages)) {
            if (!(key in baseline.packages)) baseline.packages[key] = value
          }

          fs.writeFileSync('package-lock.json', `${JSON.stringify(baseline, null, 2)}\n`)
          NODE

      - name: Verify normalized lockfile installs exactly
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Validate npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit normalized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile normalization was required."
            exit 0
          fi
          git commit -m "Keep PostHog lockfile diff scoped"
          git push origin HEAD:work/proffera-posthog-privacy-safe-analytics
