name: Temporary Phase 2 review fix

on:
  push:
    branches:
      - work/proffera-codex-review-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/proffera-codex-review-fallback
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Apply verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/phase2_review_fix.py')
          source = path.read_text().replace('${2:-}', r'\${2:-}')
          path.write_text(source)
          PY
          python3 .github/scripts/phase2_review_fix.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/tooling-safety-contract.test.ts')
          source = path.read_text()
          marker = '  it("executes Codex fallback freshness and fail-closed paths against the real CI gate", () => {'
          start = source.index(marker)
          end = source.index('\n  });', start)
          source = source[:end] + '\n  }, 15000);' + source[end + len('\n  });'):]
          path.write_text(source)
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused regression tests
        run: npm test -- --run tests/tooling-safety-contract.test.ts tests/proffera-standing-automerge.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint touched tests
        run: npx eslint tests/tooling-safety-contract.test.ts tests/proffera-standing-automerge.test.ts

      - name: Check diff
        run: git diff --check

      - name: Stage validated commit object for connector delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          parent_sha="$(git rev-parse HEAD)"
          base_tree_sha="$(gh api "repos/${REPOSITORY}/git/commits/${parent_sha}" --jq '.tree.sha')"

          create_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' < "$path" \
              | gh api --method POST "repos/${REPOSITORY}/git/blobs" --input - --jq '.sha'
          }

          ci_blob="$(create_blob .github/workflows/ci.yml)"
          automerge_blob="$(create_blob .github/workflows/proffera-automerge.yml)"
          agents_blob="$(create_blob AGENTS.md)"
          tooling_blob="$(create_blob tests/tooling-safety-contract.test.ts)"
          standing_blob="$(create_blob tests/proffera-standing-automerge.test.ts)"

          echo "CI_BLOB_SHA=${ci_blob}"
          echo "AUTOMERGE_BLOB_SHA=${automerge_blob}"
          echo "AGENTS_BLOB_SHA=${agents_blob}"
          echo "TOOLING_BLOB_SHA=${tooling_blob}"
          echo "STANDING_BLOB_SHA=${standing_blob}"

          tree_sha="$(jq -n \
            --arg base "$base_tree_sha" \
            --arg ci "$ci_blob" \
            --arg automerge "$automerge_blob" \
            --arg agents "$agents_blob" \
            --arg tooling "$tooling_blob" \
            --arg standing "$standing_blob" \
            '{base_tree:$base,tree:[
              {path:".github/workflows/ci.yml",mode:"100644",type:"blob",sha:$ci},
              {path:".github/workflows/proffera-automerge.yml",mode:"100644",type:"blob",sha:$automerge},
              {path:"AGENTS.md",mode:"100644",type:"blob",sha:$agents},
              {path:"tests/tooling-safety-contract.test.ts",mode:"100644",type:"blob",sha:$tooling},
              {path:"tests/proffera-standing-automerge.test.ts",mode:"100644",type:"blob",sha:$standing},
              {path:".github/workflows/phase2-review-fix.yml",mode:"100644",type:"blob",sha:null},
              {path:".github/scripts/phase2_review_fix.py",mode:"100644",type:"blob",sha:null},
              {path:".github/scripts/phase2_review_trigger.txt",mode:"100644",type:"blob",sha:null}
            ]}' \
            | gh api --method POST "repos/${REPOSITORY}/git/trees" --input - --jq '.sha')"

          commit_sha="$(jq -n \
            --arg message "Harden Codex fallback review precedence and regression coverage" \
            --arg tree "$tree_sha" \
            --arg parent "$parent_sha" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/${REPOSITORY}/git/commits" --input - --jq '.sha')"

          echo "FINAL_REMOTE_COMMIT_SHA=${commit_sha}"
