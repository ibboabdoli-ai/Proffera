name: Temporary Phase 2 review fix

on:
  push:
    branches:
      - work/proffera-codex-review-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: work/proffera-codex-review-fallback
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Apply verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/phase2_review_fix.py')
          source = path.read_text()
          source = source.replace('${2:-}', r'\${2:-}')
          path.write_text(source)
          PY
          python3 .github/scripts/phase2_review_fix.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused regression tests
        run: npm test -- --run tests/tooling-safety-contract.test.ts tests/proffera-standing-automerge.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint touched tests
        run: npx eslint tests/tooling-safety-contract.test.ts tests/proffera-standing-automerge.test.ts

      - name: Check diff
        run: git diff --check

      - name: Commit verified patch and remove temporary repair files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/phase2-review-fix.yml .github/scripts/phase2_review_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Codex fallback review precedence and regression coverage"
          git push origin HEAD:work/proffera-codex-review-fallback
