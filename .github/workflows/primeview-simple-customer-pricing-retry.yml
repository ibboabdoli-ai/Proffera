name: Retry PrimeView simple customer pricing

on:
  push:
    branches:
      - feature/primeview-simple-customer-pricing
    paths:
      - .github/workflows/primeview-simple-customer-pricing-retry.yml

permissions:
  contents: write

jobs:
  retry-pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/primeview-simple-customer-pricing
          fetch-depth: 0
      - name: Run corrected pricing patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/primeview-simple-customer-pricing.yml').read_text()
          block = workflow.split('      - name: Apply customer pricing rules\n', 1)[1].split('      - name: Commit pricing update\n', 1)[0]
          script = block.split('        run: |\n', 1)[1]
          script = textwrap.dedent(script)
          script = script.replace("rf'^  const \\[", "rf'(?m)^  const \\[")
          exec(compile(script, '<primeview-pricing-patch>', 'exec'))
      - name: Commit pricing update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/primeview/pricing.ts tests/primeview-precision-pricing.test.ts src/app/primeview-booking/primeview-precision-booking-form.tsx src/app/primeview-booking/page.tsx src/app/demo/primeview/page.tsx src/lib/primeview-seo.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: simplify PrimeView customer pricing"
          git push origin HEAD:feature/primeview-simple-customer-pricing
