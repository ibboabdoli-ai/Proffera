name: Temporary sole-trader source diagnostic

on:
  push:
    branches:
      - work/proffera-sole-trader-source-environment-diagnostic

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-source-environment-diagnostic
          fetch-depth: 0
      - name: Add privacy-safe source-environment diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/company-directory-sole-trader-owner.ts')
          text = source.read_text()

          old_import = 'import { randomUUID } from "node:crypto";'
          new_import = 'import { createHash, randomUUID } from "node:crypto";'
          if text.count(old_import) != 1:
              raise SystemExit('expected one node:crypto import')
          text = text.replace(old_import, new_import, 1)

          constants_anchor = '''const SOLE_TRADER_SOURCE_ATTEMPTS = 2;\nconst PRODUCTION_SOLE_TRADER_TOKEN_URL = "https://portal.api.bolagsverket.se/oauth2/token";\nconst PRODUCTION_SOLE_TRADER_DETAIL_URL = "https://gw.api.bolagsverket.se/vardefulla-datamangder/v1/organisationer";\nconst PRODUCTION_SOLE_TRADER_SCOPE = "vardefulla-datamangder:read";'''
          constants_replacement = '''const SOLE_TRADER_SOURCE_ATTEMPTS = 2;\nconst PRODUCTION_SOLE_TRADER_TOKEN_URL = "https://portal.api.bolagsverket.se/oauth2/token";\nconst PRODUCTION_SOLE_TRADER_DETAIL_URL = "https://gw.api.bolagsverket.se/vardefulla-datamangder/v1/organisationer";\nconst PRODUCTION_SOLE_TRADER_SCOPE = "vardefulla-datamangder:read";\nconst ACCEPTANCE2_IDENTITY_FINGERPRINT_PREFIX = "bolagsverket-acceptance2-diagnostic-v1:";\nconst ACCEPTANCE2_PERSON_IDENTITY_FINGERPRINTS = new Set([\n  "ed6f76bcad9b55d77d27418994bb35d2936121b48ec319e75b5e2ad6585aa45b",\n  "b50392a40628b5d1efb557758e3936a353ec5fd27614035e13667e6c7b56404e",\n  "1549fa3190321e9213f04f22e741cec908b01cb462a51f50232287473fef77d3",\n  "095e6ae5b0449938e2cc342ac8f093815aa4e4e2523e8050d4ac51793737663d",\n  "fdfaac6fe9084970fe5fdda615b5d9a9d042ac0bd44510c483025857e40c5dd6",\n  "3dd84c545827768a49493eea913a54d7d5f543c1c9f9f44e0d0353cc15b74a91",\n  "5e6b0e14cd6eb78e4fc9751a2ba11c781c6b43f93966bd356d26e5e8579d4e9a",\n  "29d5b373b4e7a0cdc3b12cac3d492fcd968af54f9063c34adfef74d3ac0e4e9c",\n  "6a9cee6dec86de3ed0284cedd28fe225e440be0f33950464f29759dee73442c0",\n  "918043d6725d7567dea5609ea882b5ac77e19f1cb4b7bb7b63a22254a9d6a555",\n  "fa4e7ca851f477911bdcf1f5066340a1bb2c16862ef06384bd6ed4b9757b6044",\n  "b013776845deb7f82d5849a8870bf75d2e20205ff25f1a2eb6b11f1d1ef8a23d",\n]);'''
          if text.count(constants_anchor) != 1:
              raise SystemExit('expected one production constants anchor')
          text = text.replace(constants_anchor, constants_replacement, 1)

          helper_anchor = '''function responseIdentity10(value: unknown) {\n  const digits = String(value ?? "").replace(/\\D/g, "");\n  if (/^\\d{12}$/.test(digits)) return digits.slice(2);\n  return /^\\d{10}$/.test(digits) ? digits : "";\n}\n'''
          helper_replacement = helper_anchor + '''\nfunction responseIdentityDiagnostic(value: unknown) {\n  const digits = String(value ?? "").replace(/\\D/g, "");\n  const normalized10 = responseIdentity10(value);\n  const fingerprint = normalized10\n    ? createHash("sha256").update(`${ACCEPTANCE2_IDENTITY_FINGERPRINT_PREFIX}${normalized10}`).digest("hex")\n    : "";\n  return {\n    state: normalized10 ? "different" : "missing",\n    shape: !digits ? "missing" : digits.length === 12 ? "12_digit" : digits.length === 10 ? "10_digit" : "other",\n    knownAcceptance2Identity: Boolean(fingerprint && ACCEPTANCE2_PERSON_IDENTITY_FINGERPRINTS.has(fingerprint)),\n  };\n}\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('expected one responseIdentity10 helper')
          text = text.replace(helper_anchor, helper_replacement, 1)

          mismatch_anchor = '''  if (identityMatches.length === 0) {\n    const identitylessRecords = records.filter((row) => !responseIdentity10(identityValue(row)));\n    failOnProducerErrors(\n      identitylessRecords.flatMap((row) => collectProducerErrors(row, ["$record"])),\n      true,\n    );\n    const identityStates = [...new Set(records.map((row) => (\n      responseIdentity10(identityValue(row)) ? "different" : "missing"\n    )))];\n    failSoleTraderSource("no_identity_match", { recordCount: records.length, identityStates });\n  }'''
          mismatch_replacement = '''  if (identityMatches.length === 0) {\n    const identitylessRecords = records.filter((row) => !responseIdentity10(identityValue(row)));\n    failOnProducerErrors(\n      identitylessRecords.flatMap((row) => collectProducerErrors(row, ["$record"])),\n      true,\n    );\n    const diagnostics = records.map((row) => ({\n      ...responseIdentityDiagnostic(identityValue(row)),\n      typeState: (() => {\n        const type = identityType(row);\n        if (!type) return "missing";\n        return type === "PERSONNUMMER" || type === "PERSONNR" ? "person" : "other";\n      })(),\n    }));\n    failSoleTraderSource("no_identity_match", {\n      recordCount: records.length,\n      identityStates: [...new Set(diagnostics.map((item) => item.state))],\n      identityTypeStates: [...new Set(diagnostics.map((item) => item.typeState))],\n      identityShapeStates: [...new Set(diagnostics.map((item) => item.shape))],\n      knownAcceptance2Identity: diagnostics.some((item) => item.knownAcceptance2Identity) ? "yes" : "no",\n    });\n  }'''
          if text.count(mismatch_anchor) != 1:
              raise SystemExit('expected one no_identity_match block')
          text = text.replace(mismatch_anchor, mismatch_replacement, 1)
          source.write_text(text)

          test = Path('tests/company-directory-sole-trader-owner.test.ts')
          test_text = test.read_text()
          test_anchor = '''  it("preserves the provider's first valid SNI instead of promoting a supported secondary SNI", async () => {'''
          diagnostic_test = '''  it("classifies documented acceptance2 identities without logging identifiers", async () => {\n    const { query } = createSqlMock();\n    mocks.getSql.mockReturnValue(query);\n    const warn = vi.spyOn(console, "warn").mockImplementation(() => undefined);\n    vi.stubGlobal("fetch", vi.fn().mockResolvedValue({\n      ok: true,\n      json: async () => ({\n        organisationer: [officialRecord({\n          organisationsidentitet: {\n            identitetsbeteckning: "198101032384",\n            typ: { kod: "PERSONNUMMER" },\n          },\n        })],\n      }),\n    }));\n\n    await expect(onboardOwnerSoleTrader(PRIVATE_INPUT)).rejects.toThrow("sole_trader_source_error");\n    expect(warn).toHaveBeenCalledWith(\n      "Sole-trader official verification failed",\n      expect.objectContaining({\n        reason: "no_identity_match",\n        identityStates: ["different"],\n        identityTypeStates: ["person"],\n        identityShapeStates: ["12_digit"],\n        knownAcceptance2Identity: "yes",\n      }),\n    );\n    const logged = JSON.stringify(warn.mock.calls);\n    expect(logged).not.toContain(PRIVATE_INPUT);\n    expect(logged).not.toContain(PRIVATE_OFFICIAL);\n    expect(logged).not.toContain("198101032384");\n    expect(query.transaction).not.toHaveBeenCalled();\n  });\n\n'''
          if test_text.count(test_anchor) != 1:
              raise SystemExit('expected one owner test insertion anchor')
          test_text = test_text.replace(test_anchor, diagnostic_test + test_anchor, 1)
          test.write_text(test_text)
          PY
          rm .github/workflows/temp-sole-trader-environment-diagnostic.yml
          git diff --check
      - name: Commit diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company-directory-sole-trader-owner.ts tests/company-directory-sole-trader-owner.test.ts .github/workflows/temp-sole-trader-environment-diagnostic.yml
          git commit -m 'Add privacy-safe sole-trader source diagnostics'
          git push origin HEAD:work/proffera-sole-trader-source-environment-diagnostic
