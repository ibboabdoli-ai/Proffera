name: Patch review fallback

on:
  push:
    branches:
      - work/proffera-coderabbit-auto-review

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded outage fallback patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          search_from = text.index('            if [ "$clean_summary_count" -gt 0 ]; then')
          anchor = '            if [ "$fallback_eligible" = "true" ]; then\n'
          pos = text.find(anchor, search_from)
          if pos < 0:
              raise SystemExit('final-gate fallback anchor not found')

          lines = [
              '            if [ "$fallback_eligible" != "true" ]; then',
              '              coderabbit_marker="<!-- proffera-coderabbit-final-review-request:${HEAD_SHA} -->"',
              '              coderabbit_request_time="$(jq -r --arg marker "$coderabbit_marker" \'[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker))) | .created_at] | max // empty\' <<< "$comments_json")"',
              '',
              '              if [ -n "$coderabbit_request_time" ]; then',
              '                high_risk_unavailable_count="$(jq -r --arg request_time "$coderabbit_request_time" \'',
              '                  [',
              '                    .[]',
              '                    | select(.user.login == "coderabbitai[bot]")',
              '                    | select((.updated_at // .created_at) >= $request_time)',
              '                    | select((.body // "") | test("Review limit reached|Review rate limited|Action not completed: Review rate limited|Review skipped|does not receive automatic reviews|temporarily unavailable|service unavailable"; "i"))',
              '                  ]',
              '                  | length',
              '                \' <<< "$comments_json")"',
              '',
              '                if [ "$high_risk_unavailable_count" -gt 0 ]; then',
              '                  fallback_eligible=true',
              '                  echo "Machine-observed CodeRabbit availability failure; emergency exact-head Codex fallback is allowed for this high-risk PR."',
              '                fi',
              '              fi',
              '            fi',
              '',
          ]
          insertion = '\n'.join(lines) + '\n'
          path.write_text(text[:pos] + insertion + text[pos:])
          PY

      - name: Remove temporary patch workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-review-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/patch-review-fallback.yml
          git diff --cached --check
          git commit -m "Allow exact-head Codex fallback on CodeRabbit outages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
