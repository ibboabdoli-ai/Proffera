name: Proffera gated automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: read

concurrency:
  group: proffera-automerge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  gated-automerge:
    name: Gated automerge
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gated automerge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          SELF_CHECK_NAME: Gated automerge
          SELF_WORKFLOW_NAME: Proffera gated automerge
          HUMAN_APPROVER: ibboabdoli-ai
          STANDING_AUTH_PATH: .github/proffera-standing-merge-authorization.json
        shell: bash
        run: |
          set -euo pipefail

          summary() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          refuse() {
            summary "## Proffera gated automerge: refused"
            summary ""
            summary "$1"
            echo "$1"
            exit 0
          }

          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$EVENT_ISSUE_IS_PR" != "true" ]; then
            refuse "Issue comment event is not attached to a pull request."
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$EVENT_WORKFLOW_NAME" != "CI" ]; then
              refuse "Workflow-run event is not the CI workflow."
            fi
            if [ "$EVENT_WORKFLOW_CONCLUSION" != "success" ]; then
              refuse "CI workflow did not complete successfully."
            fi
          fi

          pr_number="${EVENT_PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ "$EVENT_NAME" = "issue_comment" ]; then
            pr_number="${EVENT_ISSUE_NUMBER:-}"
          fi
          if [ -z "$pr_number" ] && [ "$EVENT_NAME" = "workflow_run" ]; then
            pr_number="${EVENT_WORKFLOW_PR_NUMBER:-}"
          fi
          if [ -z "$pr_number" ]; then
            pr_number="${INPUT_PR_NUMBER:-}"
          fi

          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            refuse "No valid pull request number was provided."
          fi

          pr_json="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json number,baseRefName,headRefName,headRefOid,labels,isDraft,body,author,isCrossRepository,headRepositoryOwner)"
          base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
          head_ref="$(jq -r '.headRefName' <<< "$pr_json")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr_json")"
          is_draft="$(jq -r '.isDraft' <<< "$pr_json")"
          pr_body="$(jq -r '.body // ""' <<< "$pr_json" | tr -d '\r')"
          pr_author="$(jq -r '.author.login // ""' <<< "$pr_json")"
          is_cross_repo="$(jq -r '.isCrossRepository' <<< "$pr_json")"
          head_repo_owner="$(jq -r '.headRepositoryOwner.login // ""' <<< "$pr_json")"
          has_label="$(jq -r '.labels[].name' <<< "$pr_json" | grep -Fxq 'ibbo-approved' && echo yes || echo no)"
          head_commit_json="$(gh api "repos/$REPOSITORY/commits/$head_sha")"
          head_message="$(jq -r '.commit.message // ""' <<< "$head_commit_json")"
          generated_autofix_head=no
          if [[ "$head_message" == \[codex-autofix\]* ]]; then
            generated_autofix_head=yes
          fi

          summary "## Proffera gated automerge"
          summary ""
          summary "- PR: #$pr_number"
          summary "- Base branch: $base_ref"
          summary "- Head branch: $head_ref"
          summary "- Head SHA: $head_sha"
          summary "- PR author: ${pr_author:-none}"
          summary "- Cross-repository: $is_cross_repo"
          summary "- Head repository owner: ${head_repo_owner:-none}"
          summary "- Generated autofix head: $generated_autofix_head"
          summary "- Merge method: squash"
          summary "- Admin bypass: not used"
          summary ""

          if [ "$base_ref" != "main" ]; then
            refuse "Refused: PR target branch is '$base_ref', not 'main'."
          fi

          if [[ "$head_ref" != work/proffera-* ]]; then
            refuse "Refused: source branch '$head_ref' does not start with 'work/proffera-'."
          fi

          if [ "$is_draft" = "true" ]; then
            refuse "Refused: PR is still a draft."
          fi

          # Authorization has two safe modes:
          # 1) an owner-applied ibbo-approved label plus an owner APPROVED review
          #    anchored to the exact current head commit; or
          # 2) a scoped standing authorization committed on main.
          # The PR branch can never self-authorize because the standing policy is read from main.
          # Machine-generated Codex autofix heads are intentionally excluded from standing auth;
          # they require fresh exact-head owner authorization before merge.
          authorization_mode="none"
          standing_authorized="no"
          standing_json=""

          set +e
          standing_b64="$(gh api "repos/$REPOSITORY/contents/$STANDING_AUTH_PATH?ref=main" --jq '.content' 2>/dev/null)"
          standing_status=$?
          set -e
          if [ "$standing_status" -eq 0 ] && [ -n "$standing_b64" ]; then
            standing_json="$(printf '%s' "$standing_b64" | tr -d '\n' | base64 --decode 2>/dev/null || true)"
          fi

          if [ -n "$standing_json" ] && jq -e . >/dev/null 2>&1 <<< "$standing_json"; then
            standing_enabled="$(jq -r '.enabled == true' <<< "$standing_json")"
            standing_owner="$(jq -r '.authorized_by // ""' <<< "$standing_json")"
            standing_scope="$(jq -r '.scope // ""' <<< "$standing_json")"
            standing_issue="$(jq -r '.supervisor_issue // 0' <<< "$standing_json")"
            standing_expires_at="$(jq -r '.expires_at // ""' <<< "$standing_json")"
            standing_prefix_match="no"

            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              if [[ "$head_ref" == "$prefix"* ]]; then
                standing_prefix_match="yes"
                break
              fi
            done < <(jq -r '.branch_prefixes[]? // empty' <<< "$standing_json")

            now_epoch="$(date -u +%s)"
            expires_epoch="$(date -u -d "$standing_expires_at" +%s 2>/dev/null || echo 0)"
            handoff_line="Supervisor handoff: #${standing_issue}"
            standing_handoff_match="$(grep -Fxq "$handoff_line" <<< "$pr_body" && echo yes || echo no)"
            standing_origin_match="no"
            if [ "$pr_author" = "$HUMAN_APPROVER" ] \
              && [ "$is_cross_repo" = "false" ] \
              && [ "$head_repo_owner" = "$HUMAN_APPROVER" ]; then
              standing_origin_match="yes"
            fi

            if [ "$standing_enabled" = "true" ] \
              && [ "$standing_owner" = "$HUMAN_APPROVER" ] \
              && [ "$standing_prefix_match" = "yes" ] \
              && [ "$standing_handoff_match" = "yes" ] \
              && [ "$standing_origin_match" = "yes" ] \
              && [ "$generated_autofix_head" = "no" ] \
              && [ "$expires_epoch" -gt "$now_epoch" ]; then
              standing_authorized="yes"
              authorization_mode="standing:${standing_scope}"
            fi

            summary "### Standing authorization"
            summary "- Policy source: main/$STANDING_AUTH_PATH"
            summary "- Enabled: $standing_enabled"
            summary "- Authorized by: ${standing_owner:-none}"
            summary "- Scope: ${standing_scope:-none}"
            summary "- Branch allowed: $standing_prefix_match"
            summary "- Supervisor handoff matched: $standing_handoff_match"
            summary "- Trusted same-repository owner origin: $standing_origin_match"
            summary "- Generated autofix head excluded: $generated_autofix_head"
            summary "- Expires: ${standing_expires_at:-none}"
            summary ""
          else
            summary "### Standing authorization"
            summary "- No valid standing policy was available on main."
            summary ""
          fi

          if [ "$standing_authorized" != "yes" ] && [ "$has_label" = "yes" ]; then
            approval_json="$(gh api "repos/$REPOSITORY/issues/$pr_number/events?per_page=100")"
            approval_actor="$(jq -r '[.[] | select(.event == "labeled" and .label.name == "ibbo-approved")] | last | .actor.login // ""' <<< "$approval_json")"
            reviews_json="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" --jq '.[]' | jq -s '.')"
            owner_head_approval_count="$(jq -r --arg owner "$HUMAN_APPROVER" --arg sha "$head_sha" '[.[] | select(.user.login == $owner and .state == "APPROVED" and .commit_id == $sha)] | length' <<< "$reviews_json")"

            summary "### Per-PR human authorization"
            summary "- Label actor: ${approval_actor:-none}"
            summary "- Exact-current-head owner approvals: $owner_head_approval_count"
            summary ""

            if [ "$approval_actor" = "$HUMAN_APPROVER" ] \
              && [ "$owner_head_approval_count" -gt 0 ]; then
              authorization_mode="fresh-owner-label"
            fi
          fi

          if [ "$authorization_mode" = "none" ]; then
            refuse "Refused: neither a valid scoped standing authorization from main nor an owner label plus exact-current-head owner APPROVED review authorizes this PR."
          fi

          summary "- Authorization mode: $authorization_mode"
          summary ""

          changed_files="$(gh pr diff "$pr_number" --repo "$REPOSITORY" --name-only)"
          summary "### Changed files"
          if [ -z "$changed_files" ]; then
            summary "No changed files found."
          else
            while IFS= read -r file; do
              summary "- $file"
            done <<< "$changed_files"
          fi
          summary ""

          # Standing authorization must never auto-merge control-plane, infrastructure,
          # secrets, auth, deployment, database/schema, package or other blocked paths.
          sensitive_match=""
          while IFS= read -r file; do
            case "$file" in
              .github/*|AGENTS.md|WORKER_BOOTSTRAP.md|.env*|vercel.json|next.config.*|middleware.*|src/app/api/*|src/app/api/**|src/lib/auth/*|src/lib/auth/**|src/lib/supabase/*|src/lib/supabase/**|src/lib/workspace/*|src/lib/workspace/**|db/migrations/*|migrations/*|supabase/*|supabase/**|prisma/*|prisma/**|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock)
                sensitive_match="${sensitive_match}${file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [ -n "$sensitive_match" ]; then
            summary "### Blocked sensitive files"
            while IFS= read -r file; do
              [ -n "$file" ] && summary "- $file"
            done <<< "$sensitive_match"
            refuse "Refused: PR changes blocked sensitive paths and requires the normal controlled merge path."
          fi

          file_count="$(grep -c . <<< "$changed_files" || true)"
          needs_ai_review=false
          ai_review_reason=""

          if [ "$file_count" -ge 12 ]; then
            needs_ai_review=true
            ai_review_reason="large change (${file_count} files)"
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              .github/workflows/*|db/migrations/*|migrations/*|src/app/api/*|package.json|package-lock.json|vercel.json|next.config.*|src/proxy.*|middleware.*|scripts/company-directory-discovery.py)
                needs_ai_review=true
                ai_review_reason="sensitive path: $file"
                break
                ;;
            esac

            if [[ "$file" =~ (^|/)(auth|rbac|permissions?|tenant|workspace|billing|payments?|stripe|checkout|webhooks?|db|database|postgres|neon)(/|[._-]) ]] ||
               [[ "$file" =~ company[-_]directory ]] ||
               [[ "$file" =~ (^|/)\.env ]]; then
              needs_ai_review=true
              ai_review_reason="sensitive domain: $file"
              break
            fi
          done <<< "$changed_files"

          if [ "$needs_ai_review" = "true" ]; then
            has_review_route="$(jq -r '.labels[].name' <<< "$pr_json" | grep -Fxq 'needs-ai-review' && echo yes || echo no)"
            summary "### AI review gate"
            summary "- Required: yes"
            summary "- Reason: $ai_review_reason"
            summary "- needs-ai-review label: $has_review_route"

            if [ "$has_review_route" != "yes" ]; then
              refuse "Refused: sensitive/large PR has not completed AI review routing for the current head."
            fi

            reviews_json="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" --jq '.[]' | jq -s '.')"
            current_reviews="$(jq -c --arg sha "$head_sha" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)]' <<< "$reviews_json")"
            latest_changes="$(jq -r '[.[] | select(.state == "CHANGES_REQUESTED") | .submitted_at] | max // empty' <<< "$current_reviews")"
            latest_approval="$(jq -r '[.[] | select(.state == "APPROVED") | .submitted_at] | max // empty' <<< "$current_reviews")"
            terminal_count="$(jq -r '[.[] | select(.state == "APPROVED" or .state == "COMMENTED")] | length' <<< "$current_reviews")"

            comments_json="$(gh api --paginate "repos/$REPOSITORY/issues/$pr_number/comments?per_page=100" --jq '.[]' | jq -s '.')"
            clean_summary_count="$(jq -r --arg sha "$head_sha" '
              [
                .[]
                | select(.user.login == "coderabbitai[bot]")
                | select(
                    (.body // "")
                    | test(
                        "<!-- recent_review_start -->[\\s\\S]*No actionable comments were generated in the recent review\\.[\\s\\S]*"
                        + $sha
                        + "[\\s\\S]*<!-- recent_review_end -->"
                      )
                  )
              ]
              | length
            ' <<< "$comments_json")"

            if [ -n "$latest_changes" ]; then
              if [ -z "$latest_approval" ] || [[ ! "$latest_approval" > "$latest_changes" ]]; then
                refuse "Refused: CodeRabbit changes remain requested on the current PR head; only a later APPROVED review clears them."
              fi
              summary "- Current-head CodeRabbit decision: APPROVED after latest change request"
            elif [ "$terminal_count" -gt 0 ]; then
              summary "- Current-head CodeRabbit decision: non-blocking review completed"
            elif [ "$clean_summary_count" -gt 0 ]; then
              summary "- Current-head CodeRabbit decision: clean review with no actionable comments"
            else
              refuse "Refused: no completed CodeRabbit review exists for the current PR head."
            fi
          else
            summary "### AI review gate"
            summary "- Required: no"
          fi

          checks_json=""
          non_self_check_count=0
          failing_checks=""
          pending_checks=""
          unknown_checks=""

          for attempt in $(seq 1 40); do
            checks_file="$(mktemp)"
            set +e
            timeout 20s gh pr checks "$pr_number" --repo "$REPOSITORY" --json name,state,bucket >"$checks_file" 2>/dev/null
            checks_status=$?
            set -e

            if [ "$checks_status" -eq 124 ]; then
              rm -f "$checks_file"
              refuse "Refused: status-check lookup timed out."
            fi
            if [ "$checks_status" -ne 0 ] && [ "$checks_status" -ne 1 ] && [ "$checks_status" -ne 8 ]; then
              rm -f "$checks_file"
              refuse "Refused: status-check lookup failed with exit code $checks_status."
            fi

            checks_json="$(cat "$checks_file")"
            rm -f "$checks_file"

            if [ -z "$checks_json" ] || [ "$checks_json" = "[]" ]; then
              refuse "Refused: no status checks were found for this PR."
            fi

            non_self_check_count="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '[.[] | select(.name != $self_check and .name != $self_workflow)] | length' <<< "$checks_json")"
            failing_checks="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.bucket == "fail" or .bucket == "cancel") | .name' <<< "$checks_json")"
            pending_checks="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.bucket == "pending") | .name' <<< "$checks_json")"
            unknown_checks="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.bucket != "pass" and .bucket != "skipping" and .bucket != "pending" and .bucket != "fail" and .bucket != "cancel") | .name' <<< "$checks_json")"

            if [ "$non_self_check_count" -eq 0 ]; then
              refuse "Refused: no non-self status checks were found for this PR."
            fi

            if [ -n "$failing_checks" ] || [ -n "$unknown_checks" ] || [ -z "$pending_checks" ]; then
              break
            fi

            echo "Required checks are still pending; re-evaluating before automerge (attempt $attempt/40)."
            sleep 15
          done

          summary "### Checks"
          jq -r '.[] | "- " + .name + ": " + .state + " (" + .bucket + ")"' <<< "$checks_json" >> "$GITHUB_STEP_SUMMARY"
          summary ""
          summary "Self-check names ignored while gating pending/failing checks: $SELF_CHECK_NAME, $SELF_WORKFLOW_NAME"
          summary "Non-self status checks found: $non_self_check_count"
          summary ""

          if [ -n "$pending_checks" ]; then
            summary "### Pending checks"
            while IFS= read -r check; do
              [ -n "$check" ] && summary "- $check"
            done <<< "$pending_checks"
            refuse "Refused: checks are still pending after the bounded recheck window."
          fi

          if [ -n "$failing_checks" ]; then
            summary "### Failed checks"
            while IFS= read -r check; do
              [ -n "$check" ] && summary "- $check"
            done <<< "$failing_checks"
            refuse "Refused: one or more checks failed or were cancelled."
          fi

          if [ -n "$unknown_checks" ]; then
            summary "### Unknown check states"
            while IFS= read -r check; do
              [ -n "$check" ] && summary "- $check"
            done <<< "$unknown_checks"
            refuse "Refused: one or more checks returned an unrecognized bucket."
          fi

          merge_output="$(gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$head_sha" 2>&1)"

          merged_sha=""
          for attempt in $(seq 1 10); do
            merged_sha="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.merge_commit_sha // empty')"
            if [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]]; then
              break
            fi
            sleep 1
          done
          if ! [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge completed but the exact merged commit SHA could not be resolved for Production health dispatch."
            exit 1
          fi

          dispatch_body="$(jq -n --arg sha "$merged_sha" '{event_type:"production-health",client_payload:{sha:$sha}}')"
          printf '%s' "$dispatch_body" | gh api --method POST "repos/$REPOSITORY/dispatches" --input -

          summary "## Proffera gated automerge: merged"
          summary ""
          summary "Squash merge completed with head-SHA safety check."
          summary "Source branch was deleted only after successful merge."
          summary "Production health dispatch emitted for exact merged SHA $merged_sha."
          summary ""
          summary '```'
          summary "$merge_output"
          summary '```'
