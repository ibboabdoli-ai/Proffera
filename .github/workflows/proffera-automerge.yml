name: Proffera gated automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: read

jobs:
  gated-automerge:
    name: Gated automerge
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gated automerge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          SELF_CHECK_NAME: Gated automerge
          SELF_WORKFLOW_NAME: Proffera gated automerge
          HUMAN_APPROVER: ibboabdoli-ai
        shell: bash
        run: |
          set -euo pipefail

          summary() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }

          refuse() {
            summary "## Proffera gated automerge: refused"
            summary ""
            summary "$1"
            echo "$1"
            exit 0
          }

          pr_number="${EVENT_PR_NUMBER:-}"
          if [ -z "$pr_number" ]; then
            pr_number="${INPUT_PR_NUMBER:-}"
          fi

          if [ -z "$pr_number" ]; then
            refuse "No pull request number was provided."
          fi

          pr_json="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json number,baseRefName,headRefName,headRefOid,labels,isDraft)"

          base_ref="$(echo "$pr_json" | jq -r '.baseRefName')"
          head_ref="$(echo "$pr_json" | jq -r '.headRefName')"
          head_sha="$(echo "$pr_json" | jq -r '.headRefOid')"
          is_draft="$(echo "$pr_json" | jq -r '.isDraft')"
          has_label="$(echo "$pr_json" | jq -r '.labels[].name' | grep -Fxq 'ibbo-approved' && echo yes || echo no)"

          summary "## Proffera gated automerge"
          summary ""
          summary "- PR: #$pr_number"
          summary "- Base branch: $base_ref"
          summary "- Head branch: $head_ref"
          summary "- Head SHA: $head_sha"
          summary "- Required label: ibbo-approved"
          summary "- Required human approver: $HUMAN_APPROVER"
          summary "- Merge method: squash"
          summary "- Admin bypass: not used"
          summary ""

          if [ "$base_ref" != "main" ]; then
            refuse "Refused: PR target branch is '$base_ref', not 'main'."
          fi

          if [[ "$head_ref" != work/proffera-* ]]; then
            refuse "Refused: source branch '$head_ref' does not start with 'work/proffera-'."
          fi

          if [ "$is_draft" = "true" ]; then
            refuse "Refused: PR is still a draft."
          fi

          if [ "$has_label" != "yes" ]; then
            refuse "Refused: PR does not have the required 'ibbo-approved' label."
          fi

          approval_json="$(gh api "repos/$REPOSITORY/issues/$pr_number/events?per_page=100")"
          approval_actor="$(echo "$approval_json" | jq -r '[.[] | select(.event == "labeled" and .label.name == "ibbo-approved")] | last | .actor.login // ""')"
          approval_time="$(echo "$approval_json" | jq -r '[.[] | select(.event == "labeled" and .label.name == "ibbo-approved")] | last | .created_at // ""')"
          head_commit_time="$(gh api "repos/$REPOSITORY/commits/$head_sha" --jq '.commit.committer.date')"

          summary "- Approval actor: ${approval_actor:-none}"
          summary "- Approval time: ${approval_time:-none}"
          summary "- Head commit time: $head_commit_time"
          summary ""

          if [ "$approval_actor" != "$HUMAN_APPROVER" ]; then
            refuse "Refused: 'ibbo-approved' was not most recently applied by the repository owner '$HUMAN_APPROVER'."
          fi

          if [ -z "$approval_time" ] || [[ "$approval_time" < "$head_commit_time" ]]; then
            refuse "Refused: human approval predates the current PR head. Remove and re-apply 'ibbo-approved' after the latest commit."
          fi

          changed_files="$(gh pr diff "$pr_number" --repo "$REPOSITORY" --name-only)"
          summary "### Changed files"
          if [ -z "$changed_files" ]; then
            summary "No changed files found."
          else
            while IFS= read -r file; do
              summary "- $file"
            done <<< "$changed_files"
          fi
          summary ""

          sensitive_match=""
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|.env*|vercel.json|next.config.*|middleware.*|src/app/api/*|src/app/api/**|src/lib/auth/*|src/lib/auth/**|src/lib/supabase/*|src/lib/supabase/**|src/lib/workspace/*|src/lib/workspace/**|supabase/*|supabase/**|prisma/*|prisma/**|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock)
                sensitive_match="${sensitive_match}${file}"$'\n'
                ;;
            esac
          done <<< "$changed_files"

          if [ -n "$sensitive_match" ]; then
            summary "### Blocked sensitive files"
            while IFS= read -r file; do
              [ -n "$file" ] && summary "- $file"
            done <<< "$sensitive_match"
            refuse "Refused: PR changes blocked sensitive paths."
          fi

          file_count="$(grep -c . <<< "$changed_files" || true)"
          needs_ai_review=false
          ai_review_reason=""

          if [ "$file_count" -ge 12 ]; then
            needs_ai_review=true
            ai_review_reason="large change (${file_count} files)"
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              .github/workflows/*|db/migrations/*|migrations/*|src/app/api/*|package.json|package-lock.json|vercel.json|next.config.*|src/proxy.*|middleware.*|scripts/company-directory-discovery.py)
                needs_ai_review=true
                ai_review_reason="sensitive path: $file"
                break
                ;;
            esac

            if [[ "$file" =~ (^|/)(auth|rbac|permissions?|tenant|workspace|billing|payments?|stripe|checkout|webhooks?|db|database|postgres|neon)(/|[._-]) ]] ||
               [[ "$file" =~ company[-_]directory ]] ||
               [[ "$file" =~ (^|/)\.env ]]; then
              needs_ai_review=true
              ai_review_reason="sensitive domain: $file"
              break
            fi
          done <<< "$changed_files"

          if [ "$needs_ai_review" = "true" ]; then
            has_review_route="$(echo "$pr_json" | jq -r '.labels[].name' | grep -Fxq 'needs-ai-review' && echo yes || echo no)"
            summary "### AI review gate"
            summary "- Required: yes"
            summary "- Reason: $ai_review_reason"
            summary "- needs-ai-review label: $has_review_route"

            if [ "$has_review_route" != "yes" ]; then
              refuse "Refused: sensitive/large PR has not completed AI review routing for the current head."
            fi

            reviews_json="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" --jq '.[]' | jq -s '.')"
            current_reviews="$(echo "$reviews_json" | jq -c --arg sha "$head_sha" '[.[] | select(.user.login == "coderabbitai[bot]" and .commit_id == $sha)]')"
            latest_changes="$(echo "$current_reviews" | jq -r '[.[] | select(.state == "CHANGES_REQUESTED") | .submitted_at] | max // empty')"
            latest_approval="$(echo "$current_reviews" | jq -r '[.[] | select(.state == "APPROVED") | .submitted_at] | max // empty')"
            terminal_count="$(echo "$current_reviews" | jq -r '[.[] | select(.state == "APPROVED" or .state == "COMMENTED")] | length')"

            if [ -n "$latest_changes" ]; then
              if [ -z "$latest_approval" ] || [[ ! "$latest_approval" > "$latest_changes" ]]; then
                refuse "Refused: CodeRabbit changes remain requested on the current PR head; only a later APPROVED review clears them."
              fi
              summary "- Current-head CodeRabbit decision: APPROVED after latest change request"
            elif [ "$terminal_count" -gt 0 ]; then
              summary "- Current-head CodeRabbit decision: non-blocking review completed"
            else
              refuse "Refused: no completed CodeRabbit review exists for the current PR head."
            fi
          else
            summary "### AI review gate"
            summary "- Required: no"
          fi

          checks_json="$(gh pr checks "$pr_number" --repo "$REPOSITORY" --json name,state 2>/dev/null || true)"
          if [ -z "$checks_json" ] || [ "$checks_json" = "[]" ]; then
            refuse "Refused: no status checks were found for this PR."
          fi

          non_self_check_count="$(echo "$checks_json" | jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '[.[] | select(.name != $self_check and .name != $self_workflow)] | length')"
          failing_checks="$(echo "$checks_json" | jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.state == "FAILURE" or .state == "ERROR" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED") | .name')"
          pending_checks="$(echo "$checks_json" | jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS" or .state == "WAITING") | .name')"

          summary "### Checks"
          echo "$checks_json" | jq -r '.[] | "- " + .name + ": " + .state' >> "$GITHUB_STEP_SUMMARY"
          summary ""
          summary "Self-check names ignored while gating pending/failing checks: $SELF_CHECK_NAME, $SELF_WORKFLOW_NAME"
          summary "Non-self status checks found: $non_self_check_count"
          summary ""

          if [ "$non_self_check_count" -eq 0 ]; then
            refuse "Refused: no non-self status checks were found for this PR."
          fi

          if [ -n "$pending_checks" ]; then
            summary "### Pending checks"
            while IFS= read -r check; do
              [ -n "$check" ] && summary "- $check"
            done <<< "$pending_checks"
            refuse "Refused: checks are still pending."
          fi

          if [ -n "$failing_checks" ]; then
            summary "### Failed checks"
            while IFS= read -r check; do
              [ -n "$check" ] && summary "- $check"
            done <<< "$failing_checks"
            refuse "Refused: one or more checks failed."
          fi

          merge_output="$(gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$head_sha" 2>&1)"
          summary "## Proffera gated automerge: merged"
          summary ""
          summary "Squash merge completed with head-SHA safety check."
          summary "Source branch was deleted only after successful merge."
          summary ""
          summary '```'
          summary "$merge_output"
          summary '```'
