name: Proffera gated automerge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  issues: read

concurrency:
  group: proffera-automerge-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  gated-automerge:
    name: Gated automerge
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gated automerge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_ISSUE_IS_PR: ${{ github.event.issue.pull_request != null }}
          EVENT_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_WORKFLOW_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          SELF_CHECK_NAME: Gated automerge
          SELF_WORKFLOW_NAME: Proffera gated automerge
          HUMAN_APPROVER: ibboabdoli-ai
          STANDING_AUTH_PATH: .github/proffera-standing-merge-authorization.json
        shell: bash
        run: |
          set -euo pipefail

          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          refuse() {
            summary "## Proffera gated automerge: refused"
            summary ""
            summary "$1"
            echo "$1"
            exit 0
          }

          if [ "$EVENT_NAME" = "issue_comment" ] && [ "$EVENT_ISSUE_IS_PR" != "true" ]; then
            refuse "Issue comment event is not attached to a pull request."
          fi

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            [ "$EVENT_WORKFLOW_NAME" = "CI" ] || refuse "Workflow-run event is not the CI workflow."
            [ "$EVENT_WORKFLOW_CONCLUSION" = "success" ] || refuse "CI workflow did not complete successfully."
          fi

          pr_number="${EVENT_PR_NUMBER:-}"
          if [ -z "$pr_number" ] && [ "$EVENT_NAME" = "issue_comment" ]; then pr_number="${EVENT_ISSUE_NUMBER:-}"; fi
          if [ -z "$pr_number" ] && [ "$EVENT_NAME" = "workflow_run" ]; then pr_number="${EVENT_WORKFLOW_PR_NUMBER:-}"; fi
          if [ -z "$pr_number" ]; then pr_number="${INPUT_PR_NUMBER:-}"; fi
          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]] || refuse "No valid pull request number was provided."

          pr_json="$(gh pr view "$pr_number" --repo "$REPOSITORY" --json number,baseRefName,headRefName,headRefOid,labels,isDraft,body,author,isCrossRepository,headRepositoryOwner)"
          base_ref="$(jq -r '.baseRefName' <<< "$pr_json")"
          head_ref="$(jq -r '.headRefName' <<< "$pr_json")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr_json")"
          is_draft="$(jq -r '.isDraft' <<< "$pr_json")"
          pr_body="$(jq -r '.body // ""' <<< "$pr_json" | tr -d '\r')"
          pr_author="$(jq -r '.author.login // ""' <<< "$pr_json")"
          is_cross_repo="$(jq -r '.isCrossRepository' <<< "$pr_json")"
          head_repo_owner="$(jq -r '.headRepositoryOwner.login // ""' <<< "$pr_json")"
          has_label="$(jq -r '.labels[].name' <<< "$pr_json" | grep -Fxq 'ibbo-approved' && echo yes || echo no)"

          [ "$base_ref" = "main" ] || refuse "Refused: PR target branch is '$base_ref', not 'main'."
          [[ "$head_ref" == work/proffera-* ]] || refuse "Refused: source branch '$head_ref' does not start with 'work/proffera-'."
          [ "$is_draft" != "true" ] || refuse "Refused: PR is still a draft."

          head_commit_json="$(gh api "repos/$REPOSITORY/commits/$head_sha")"
          head_message="$(jq -r '.commit.message // ""' <<< "$head_commit_json")"
          generated_autofix_head=no
          if [[ "$head_message" == \[codex-autofix\]* ]]; then generated_autofix_head=yes; fi

          summary "## Proffera gated automerge"
          summary ""
          summary "- PR: #$pr_number"
          summary "- Base branch: $base_ref"
          summary "- Head branch: $head_ref"
          summary "- Head SHA: $head_sha"
          summary "- Generated autofix head: $generated_autofix_head"
          summary "- Merge method: squash"
          summary "- Admin bypass: not used"
          summary ""

          authorization_mode="none"
          standing_authorized="no"
          standing_json=""

          set +e
          standing_b64="$(gh api "repos/$REPOSITORY/contents/$STANDING_AUTH_PATH?ref=main" --jq '.content' 2>/dev/null)"
          standing_status=$?
          set -e
          if [ "$standing_status" -eq 0 ] && [ -n "$standing_b64" ]; then
            standing_json="$(printf '%s' "$standing_b64" | tr -d '\n' | base64 --decode 2>/dev/null || true)"
          fi

          if [ -n "$standing_json" ] && jq -e . >/dev/null 2>&1 <<< "$standing_json"; then
            standing_enabled="$(jq -r '.enabled == true' <<< "$standing_json")"
            standing_owner="$(jq -r '.authorized_by // ""' <<< "$standing_json")"
            standing_scope="$(jq -r '.scope // ""' <<< "$standing_json")"
            standing_issue="$(jq -r '.supervisor_issue // 0' <<< "$standing_json")"
            standing_expires_at="$(jq -r '.expires_at // ""' <<< "$standing_json")"
            standing_prefix_match=no
            while IFS= read -r prefix; do
              [ -z "$prefix" ] && continue
              if [[ "$head_ref" == "$prefix"* ]]; then standing_prefix_match=yes; break; fi
            done < <(jq -r '.branch_prefixes[]? // empty' <<< "$standing_json")

            now_epoch="$(date -u +%s)"
            expires_epoch="$(date -u -d "$standing_expires_at" +%s 2>/dev/null || echo 0)"
            handoff_line="Supervisor handoff: #${standing_issue}"
            standing_handoff_match="$(grep -Fxq "$handoff_line" <<< "$pr_body" && echo yes || echo no)"
            standing_origin_match=no
            if [ "$pr_author" = "$HUMAN_APPROVER" ] && [ "$is_cross_repo" = "false" ] && [ "$head_repo_owner" = "$HUMAN_APPROVER" ]; then
              standing_origin_match=yes
            fi

            if [ "$standing_enabled" = "true" ] \
              && [ "$standing_owner" = "$HUMAN_APPROVER" ] \
              && [ "$standing_prefix_match" = "yes" ] \
              && [ "$standing_handoff_match" = "yes" ] \
              && [ "$standing_origin_match" = "yes" ] \
              && [ "$generated_autofix_head" = "no" ] \
              && [ "$expires_epoch" -gt "$now_epoch" ]; then
              standing_authorized=yes
              authorization_mode="standing:${standing_scope}"
            fi
          fi

          if [ "$standing_authorized" != "yes" ] && [ "$has_label" = "yes" ]; then
            approval_events="$(gh api --paginate "repos/$REPOSITORY/issues/$pr_number/events?per_page=100" --jq '.[]' | jq -s '.')"
            approval_actor="$(jq -r '[.[] | select(.event == "labeled" and .label.name == "ibbo-approved")] | last | .actor.login // ""' <<< "$approval_events")"
            reviews_json="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/reviews?per_page=100" --jq '.[]' | jq -s '.')"
            owner_head_approval_count="$(jq -r --arg owner "$HUMAN_APPROVER" --arg sha "$head_sha" '[.[] | select(.user.login == $owner and .state == "APPROVED" and .commit_id == $sha)] | length' <<< "$reviews_json")"
            if [ "$approval_actor" = "$HUMAN_APPROVER" ] && [ "$owner_head_approval_count" -gt 0 ]; then
              authorization_mode="fresh-owner-label"
            fi
          fi

          [ "$authorization_mode" != "none" ] || refuse "Refused: neither scoped standing authorization nor an owner label plus exact-current-head owner APPROVED review authorizes this PR."

          changed_files="$(gh api --paginate "repos/$REPOSITORY/pulls/$pr_number/files?per_page=100" --jq '.[].filename')"
          [ -n "$changed_files" ] || refuse "Refused: no changed files found."

          classifier_file="$(mktemp --suffix=.mjs)"
          set +e
          classifier_b64="$(gh api "repos/$REPOSITORY/contents/scripts/ci/classify-pr-risk.mjs?ref=main" --jq '.content' 2>/dev/null)"
          classifier_status=$?
          set -e
          [ "$classifier_status" -eq 0 ] && [ -n "$classifier_b64" ] || refuse "Refused: canonical PR risk classifier is unavailable on main."
          printf '%s' "$classifier_b64" | tr -d '\n' | base64 --decode > "$classifier_file"
          classification="$(printf '%s\n' "$changed_files" | node "$classifier_file")"
          rm -f "$classifier_file"

          review_risk="$(jq -r '.reviewRisk' <<< "$classification")"
          ai_review_required="$(jq -r '.aiReviewRequired' <<< "$classification")"
          human_merge_required="$(jq -r '.humanMergeRequired' <<< "$classification")"
          reason_summary="$(jq -r 'if (.reasons | length) == 0 then "low-risk" else (.reasons | join(", ")) end' <<< "$classification")"

          summary "### Canonical risk classification"
          summary "- Review risk: $review_risk"
          summary "- AI review required: $ai_review_required"
          summary "- Human merge required: $human_merge_required"
          summary "- Reasons: $reason_summary"
          summary "- Authorization mode: $authorization_mode"
          summary ""

          if [ "$human_merge_required" = "true" ] && [[ "$authorization_mode" == standing:* ]]; then
            refuse "Refused: canonical risk policy requires fresh exact-head human merge approval for this PR; standing authorization is not sufficient."
          fi

          if [ "$ai_review_required" = "true" ]; then
            has_review_route="$(jq -r '.labels[].name' <<< "$pr_json" | grep -Fxq 'needs-ai-review' && echo yes || echo no)"
            [ "$has_review_route" = "yes" ] || refuse "Refused: AI-routed PR is missing needs-ai-review for the current head."

            review_gate_file="$(mktemp)"
            set +e
            review_gate_b64="$(gh api "repos/$REPOSITORY/contents/scripts/ci/review-gate.sh?ref=main" --jq '.content' 2>/dev/null)"
            review_gate_status=$?
            set -e
            [ "$review_gate_status" -eq 0 ] && [ -n "$review_gate_b64" ] || refuse "Refused: canonical AI review evaluator is unavailable on main."
            printf '%s' "$review_gate_b64" | tr -d '\n' | base64 --decode > "$review_gate_file"
            chmod +x "$review_gate_file"

            set +e
            REPOSITORY="$REPOSITORY" PR_NUMBER="$pr_number" HEAD_SHA="$head_sha" REVIEW_GATE_MODE=check bash "$review_gate_file"
            review_gate_status=$?
            set -e
            rm -f "$review_gate_file"
            [ "$review_gate_status" -eq 0 ] || refuse "Refused: no acceptable provider-neutral exact-head AI review decision exists."
          fi

          checks_json=""
          non_self_check_count=0
          failing_checks=""
          pending_checks=""
          unknown_checks=""

          for attempt in $(seq 1 40); do
            checks_file="$(mktemp)"
            set +e
            timeout 20s gh pr checks "$pr_number" --repo "$REPOSITORY" --json name,state,bucket >"$checks_file" 2>/dev/null
            checks_status=$?
            set -e

            [ "$checks_status" -ne 124 ] || refuse "Refused: status-check lookup timed out."
            if [ "$checks_status" -ne 0 ] && [ "$checks_status" -ne 1 ] && [ "$checks_status" -ne 8 ]; then
              rm -f "$checks_file"
              refuse "Refused: status-check lookup failed with exit code $checks_status."
            fi

            checks_json="$(cat "$checks_file")"
            rm -f "$checks_file"
            [ -n "$checks_json" ] && [ "$checks_json" != "[]" ] || refuse "Refused: no status checks were found for this PR."

            non_self_check_count="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '[.[] | select(.name != $self_check and .name != $self_workflow)] | length' <<< "$checks_json")"
            failing_checks="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.bucket == "fail" or .bucket == "cancel") | .name' <<< "$checks_json")"
            pending_checks="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.bucket == "pending") | .name' <<< "$checks_json")"
            unknown_checks="$(jq -r --arg self_check "$SELF_CHECK_NAME" --arg self_workflow "$SELF_WORKFLOW_NAME" '.[] | select(.name != $self_check and .name != $self_workflow) | select(.bucket != "pass" and .bucket != "skipping" and .bucket != "pending" and .bucket != "fail" and .bucket != "cancel") | .name' <<< "$checks_json")"

            [ "$non_self_check_count" -gt 0 ] || refuse "Refused: no non-self status checks were found for this PR."
            if [ -n "$failing_checks" ] || [ -n "$unknown_checks" ] || [ -z "$pending_checks" ]; then break; fi
            sleep 15
          done

          [ -z "$pending_checks" ] || refuse "Refused: checks are still pending after the bounded recheck window."
          [ -z "$failing_checks" ] || refuse "Refused: one or more checks failed or were cancelled."
          [ -z "$unknown_checks" ] || refuse "Refused: one or more checks returned an unrecognized bucket."

          current_head_sha="$(gh api "repos/$REPOSITORY/pulls/$pr_number" --jq '.head.sha')"
          [ "$current_head_sha" = "$head_sha" ] || refuse "Refused: PR head changed after validation; expected $head_sha, current $current_head_sha."

          merge_output="$(gh pr merge "$pr_number" --repo "$REPOSITORY" --squash --delete-branch --match-head-commit "$head_sha" 2>&1)"

          pr_merged=false
          merged_sha=""
          for attempt in $(seq 1 10); do
            merge_state_json="$(gh api "repos/$REPOSITORY/pulls/$pr_number")"
            pr_merged="$(jq -r '.merged == true' <<< "$merge_state_json")"
            merged_sha="$(jq -r '.merge_commit_sha // empty' <<< "$merge_state_json")"
            if [ "$pr_merged" = "true" ] && [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]]; then break; fi
            sleep 1
          done

          if [ "$pr_merged" != "true" ] || ! [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Merge command completed but the PR was not confirmed merged with a valid final SHA; Production health dispatch was not emitted."
            exit 1
          fi

          dispatch_body="$(jq -n --arg sha "$merged_sha" '{event_type:"production-health",client_payload:{sha:$sha}}')"
          printf '%s' "$dispatch_body" | gh api --method POST "repos/$REPOSITORY/dispatches" --input -

          summary "## Proffera gated automerge: merged"
          summary ""
          summary "Squash merge completed with exact-head safety and canonical risk/review policy."
          summary "Production health dispatch emitted for exact merged SHA $merged_sha."
          summary ""
          summary '```'
          summary "$merge_output"
          summary '```'
