name: PrimeView back button visibility fix

on:
  push:
    branches:
      - fix/primeview-back-button-visibility

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/primeview-back-button-visibility
      - name: Fix booking header CTA contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/primeview-booking/page.tsx')
          s = p.read_text()
          old = '<Link href="/" className="rounded-xl bg-white px-4 py-3 text-sm font-black text-[#06183b]">Back to website</Link>'
          new = '<Link href="/" className="whitespace-nowrap rounded-xl bg-[#1769c2] px-4 py-3 text-sm font-black text-white ring-1 ring-white/25 transition hover:bg-[#2f80ed]">Back to website</Link>'
          if old not in s:
              raise SystemExit('target markup not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-primeview-back-button.yml
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run typecheck
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/primeview-booking/page.tsx .github/workflows/fix-primeview-back-button.yml
          git commit -m "fix: make PrimeView back button visible"
          git push origin HEAD:fix/primeview-back-button-visibility
