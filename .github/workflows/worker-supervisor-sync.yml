name: Worker supervisor sync

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: [CI, CodeQL, Targeted CI shadow, Production base health]
    types: [completed]

permissions: {}

concurrency:
  group: proffera-worker-supervisor-sync-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  resolve_worker_mutation_lane:
    name: Resolve trusted Worker branch mutation lane
    if: >-
      (github.event_name == 'pull_request_target' &&
        startsWith(github.event.pull_request.head.ref, 'work/proffera-')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null &&
        startsWith(github.event.workflow_run.head_branch, 'work/proffera-'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      trusted: ${{ steps.resolve.outputs.trusted }}

    steps:
      - name: Resolve exact Worker branch
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Refused: Worker mutation lane has no valid PR number." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            event_branch="$PR_HEAD_REF"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            event_branch="$RUN_HEAD_BRANCH"
          else
            echo "Unsupported event for Worker mutation lane." >&2
            exit 1
          fi
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          branch="$(jq -r '.head.ref // ""' <<< "$pr_json")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          author="$(jq -r '.user.login // ""' <<< "$pr_json")"
          if [ "$event_branch" != "$branch" ] \
            || [[ "$branch" != work/proffera-* ]] \
            || [ "$head_repository" != "$REPOSITORY" ] \
            || [ "$author" != "${REPOSITORY%%/*}" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} is not a trusted same-repository Worker mutation lane; leaving it unchanged."
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "trusted=true" >> "$GITHUB_OUTPUT"

  sync-pr-event:
    name: Reconcile Worker PR lifecycle
    needs: resolve_worker_mutation_lane
    if: >-
      needs.resolve_worker_mutation_lane.outputs.trusted == 'true' &&
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.pull_request.head.ref, 'work/proffera-')
    concurrency:
      group: proffera-worker-task-state-${{ needs.resolve_worker_mutation_lane.outputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout trusted default-branch task-state helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Record or update Worker lifecycle state in Supervisor issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          helper="scripts/supervisor-worker-handoff.mjs"
          task_marker='<!-- proffera-worker-task-packet:v1 -->'

          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          live_pr_state="$(jq -r '.state' <<< "$pr_json")"
          live_merged="$(jq -r '.merged == true' <<< "$pr_json")"
          pr_author="$(jq -r '.user.login // ""' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref // ""' <<< "$pr_json")"
          live_head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"
          base_sha="$(jq -r '.base.sha // ""' <<< "$pr_json")"
          pr_body="$(jq -r '.body // ""' <<< "$pr_json")"
          pr_url="$(jq -r '.html_url // ""' <<< "$pr_json")"

          # Task-aware lifecycle state is trusted only for a same-repository,
          # owner-authored work/proffera-* PR carrying a valid bounded packet.
          if [ "$pr_author" = "ibboabdoli-ai" ] \
            && [ "$head_repo" = "$REPOSITORY" ] \
            && [[ "$head_ref" == work/proffera-* ]] \
            && grep -Fq "$task_marker" <<< "$pr_body" \
            && [ -f "$helper" ]; then
            if [ "$EVENT_HEAD_SHA" != "$live_head_sha" ]; then
              echo "Ignoring stale lifecycle event for $EVENT_HEAD_SHA; live PR head is $live_head_sha."
              exit 0
            fi

            packet_file="$(mktemp)"
            if printf '%s' "$pr_body" | node "$helper" parse > "$packet_file" 2>/dev/null \
              && jq -e . "$packet_file" >/dev/null 2>&1; then
              packet="$(cat "$packet_file")"
              task_id="$(jq -r '.task_id' <<< "$packet")"
              packet_branch="$(jq -r '.branch' <<< "$packet")"
              packet_base="$(jq -r '.base_sha' <<< "$packet")"

              if [ "$packet_branch" != "$head_ref" ]; then
                echo "Task-aware PR branch does not match its packet; refusing trusted reconciliation." >&2
                exit 1
              fi

              if [ "$live_pr_state" = "closed" ] && [ "$live_merged" = "true" ]; then
                state="MERGED"
                reason="Worker PR is live-verified as merged through the repository merge path."
              elif [ "$live_pr_state" = "closed" ]; then
                state="CLOSED_UNMERGED"
                reason="Worker PR is live-verified as closed without merge."
              elif [ "$ACTION" = "opened" ] || [ "$ACTION" = "reopened" ]; then
                state="WORKER_PR_OPENED"
                reason="Worker PR is live-verified open; exact-head checks and review are pending."
              elif [ "$ACTION" = "synchronize" ] || [ "$ACTION" = "ready_for_review" ]; then
                state="CHECKS_PENDING"
                reason="Worker PR live head is current; prior head-specific evidence is stale and current-head checks/review are pending."
              else
                state="CHECKS_PENDING"
                reason="Worker PR lifecycle changed; current-head checks remain authoritative."
              fi

              if [ "$ACTION" != "opened" ] && [ "$ACTION" != "reopened" ] && [ "$packet_base" != "$base_sha" ]; then
                reason="${reason} Task Packet bootstrap remains ${packet_base}; current PR base is ${base_sha}."
              fi

              load_current_state() {
                comments_json="$(gh api --paginate "repos/${REPOSITORY}/issues/548/comments?per_page=100" --jq '.[]' | jq -s '.')"
                marker="<!-- proffera-worker-task-state:${task_id} -->"
                comment_id="$(jq -r --arg marker "$marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | last | .id // empty' <<< "$comments_json")"
                current_body=""
                if [ -n "$comment_id" ]; then
                  current_body="$(jq -r --argjson id "$comment_id" '[.[] | select(.id == $id)] | last | .body // ""' <<< "$comments_json")"
                fi
              }

              guard_transition() {
                transition_json="$(jq -n \
                  --arg current_body "$current_body" \
                  --arg source "lifecycle" \
                  --arg requested_state "$state" \
                  --arg requested_head "$live_head_sha" \
                  --arg live_head "$live_head_sha" \
                  --arg live_pr_state "$live_pr_state" \
                  --argjson live_merged "$live_merged" \
                  '{current_body:$current_body,source:$source,requested_state:$requested_state,requested_head:$requested_head,live_head:$live_head,live_pr_state:$live_pr_state,live_merged:$live_merged}' \
                  | node "$helper" transition)"
                transition_apply="$(jq -r '.apply == true' <<< "$transition_json")"
                transition_reason="$(jq -r '.reason' <<< "$transition_json")"
              }

              load_current_state
              guard_transition
              if [ "$transition_apply" != "true" ]; then
                echo "Lifecycle state not mutated: $transition_reason"
                exit 0
              fi

              # Re-fetch live PR and current state immediately before mutation.
              confirm_pr="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
              confirm_head="$(jq -r '.head.sha // ""' <<< "$confirm_pr")"
              confirm_state="$(jq -r '.state' <<< "$confirm_pr")"
              confirm_merged="$(jq -r '.merged == true' <<< "$confirm_pr")"
              if [ "$confirm_head" != "$live_head_sha" ] || [ "$confirm_state" != "$live_pr_state" ] || [ "$confirm_merged" != "$live_merged" ]; then
                echo "Live PR changed during reconciliation; refusing stale lifecycle mutation."
                exit 0
              fi

              load_current_state
              guard_transition
              if [ "$transition_apply" != "true" ]; then
                echo "Lifecycle state converged before mutation: $transition_reason"
                exit 0
              fi

              state_json="$(jq -n --argjson packet "$packet" --arg state "$state" --arg reason "$reason" --arg run_id "$RUN_ID" --argjson pr_number "$PR_NUMBER" --arg head_sha "$live_head_sha" '{packet:$packet,state:$state,reason:$reason,run_id:$run_id,pr_number:$pr_number,head_sha:$head_sha}')"
              body="$(printf '%s' "$state_json" | node "$helper" state-body)"
              if [ -n "$comment_id" ]; then
                gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
              else
                gh api --method POST "repos/${REPOSITORY}/issues/548/comments" -f body="$body" >/dev/null
              fi
              echo "Reconciled task $task_id to $state on live head $live_head_sha."
              exit 0
            fi

            echo "Trusted Phase-1 marker carries an invalid Task Packet; refusing legacy fallback." >&2
            exit 1
          fi

          # Preserve the existing legacy lifecycle trail for Workers that predate
          # Phase 1. Avoid new synchronize spam for those legacy PRs.
          if [ "$ACTION" = "synchronize" ]; then
            echo "Legacy Worker PR synchronize event: no new Supervisor comment."
            exit 0
          fi

          case "$ACTION" in
            opened) event_state="OPENED" ;;
            reopened) event_state="REOPENED" ;;
            ready_for_review) event_state="READY_FOR_REVIEW" ;;
            closed)
              if [ "$live_merged" = "true" ]; then
                event_state="MERGED"
              else
                event_state="CLOSED_UNMERGED"
              fi
              ;;
            *) event_state="${ACTION^^}" ;;
          esac

          body="$(cat <<LEGACY
          <!-- proffera-worker-supervisor-event -->
          ### Worker event: ${event_state}
          - PR: #${PR_NUMBER}
          - Branch: \`${head_ref}\`
          - Head: \`${live_head_sha}\`
          - Base: \`${base_sha}\`
          - Actor: \`${ACTOR}\`
          - URL: ${pr_url}
          LEGACY
          )"
          gh issue comment 548 --repo "$REPOSITORY" --body "$body"

  sync-check-state:
    name: Reconcile exact-head checks into task state
    needs: resolve_worker_mutation_lane
    if: >-
      needs.resolve_worker_mutation_lane.outputs.trusted == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    concurrency:
      group: proffera-worker-task-state-${{ needs.resolve_worker_mutation_lane.outputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout trusted default-branch task-state helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile required current-head workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          helper="scripts/supervisor-worker-handoff.mjs"
          pr_number="$EVENT_PR_NUMBER"
          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "No valid PR number; nothing to reconcile."
            exit 0
          fi

          read_live_pr() {
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
            pr_state="$(jq -r '.state' <<< "$pr_json")"
            pr_merged="$(jq -r '.merged == true' <<< "$pr_json")"
            pr_author="$(jq -r '.user.login // ""' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
            head_ref="$(jq -r '.head.ref // ""' <<< "$pr_json")"
            head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"
            pr_body="$(jq -r '.body // ""' <<< "$pr_json")"
          }

          read_live_pr
          if [ "$pr_state" != "open" ] \
            || [ "$pr_author" != "ibboabdoli-ai" ] \
            || [ "$head_repo" != "$REPOSITORY" ] \
            || [[ "$head_ref" != work/proffera-* ]] \
            || ! grep -Fq '<!-- proffera-worker-task-packet:v1 -->' <<< "$pr_body"; then
            echo "PR #$pr_number is not a trusted open Phase-1 Worker PR; nothing to reconcile."
            exit 0
          fi
          if [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Workflow completion is stale for PR #$pr_number; current head is $head_sha."
            exit 0
          fi

          packet_file="$(mktemp)"
          if ! printf '%s' "$pr_body" | node "$helper" parse > "$packet_file" 2>/dev/null; then
            echo "Trusted Phase-1 marker carries an invalid Task Packet; refusing reconciliation." >&2
            exit 1
          fi
          packet="$(cat "$packet_file")"
          task_id="$(jq -r '.task_id' <<< "$packet")"
          packet_branch="$(jq -r '.branch' <<< "$packet")"
          if [ "$packet_branch" != "$head_ref" ]; then
            echo "Task Packet branch mismatch; refusing reconciliation." >&2
            exit 1
          fi

          compute_evidence() {
            runs_json="$(gh api --paginate "repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs[]' | jq -s '.')"
            required=("CI" "CodeQL" "Targeted CI shadow" "Production base health")
            all_success=yes
            evidence=""
            for workflow_name in "${required[@]}"; do
              conclusion="$(jq -r --arg name "$workflow_name" '[.[] | select(.name == $name)] | sort_by(.created_at // "", .id // 0) | last | .conclusion // "missing"' <<< "$runs_json")"
              evidence="${evidence}${workflow_name}=${conclusion}; "
              if [ "$conclusion" != "success" ]; then
                all_success=no
              fi
            done
            if [ "$all_success" = "yes" ]; then
              state="READY_FOR_SUPERVISOR"
              reason="All required exact-live-head workflow evidence is green. CI success includes the existing final browser/review gate; human merge approval remains external."
            else
              state="CHECKS_PENDING"
              reason="Required exact-live-head workflow evidence is not fully green yet: ${evidence}"
            fi
          }

          load_current_state() {
            comments_json="$(gh api --paginate "repos/${REPOSITORY}/issues/548/comments?per_page=100" --jq '.[]' | jq -s '.')"
            marker="<!-- proffera-worker-task-state:${task_id} -->"
            comment_id="$(jq -r --arg marker "$marker" '[.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | contains($marker)))] | last | .id // empty' <<< "$comments_json")"
            current_body=""
            if [ -n "$comment_id" ]; then
              current_body="$(jq -r --argjson id "$comment_id" '[.[] | select(.id == $id)] | last | .body // ""' <<< "$comments_json")"
            fi
          }

          guard_transition() {
            transition_json="$(jq -n \
              --arg current_body "$current_body" \
              --arg source "checks" \
              --arg requested_state "$state" \
              --arg requested_head "$head_sha" \
              --arg live_head "$head_sha" \
              --arg live_pr_state "$pr_state" \
              --argjson live_merged "$pr_merged" \
              '{current_body:$current_body,source:$source,requested_state:$requested_state,requested_head:$requested_head,live_head:$live_head,live_pr_state:$live_pr_state,live_merged:$live_merged}' \
              | node "$helper" transition)"
            transition_apply="$(jq -r '.apply == true' <<< "$transition_json")"
            transition_reason="$(jq -r '.reason' <<< "$transition_json")"
          }

          # Bind decision to a freshly fetched live head and the latest exact-head evidence.
          read_live_pr
          if [ "$pr_state" != "open" ] || [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "PR/head changed before check reconciliation; refusing stale mutation."
            exit 0
          fi
          compute_evidence
          load_current_state
          guard_transition
          if [ "$transition_apply" != "true" ]; then
            echo "Check state not mutated: $transition_reason"
            exit 0
          fi

          # Re-fetch both live PR and latest workflow evidence immediately before mutation.
          expected_head="$head_sha"
          read_live_pr
          if [ "$pr_state" != "open" ] || [ "$head_sha" != "$expected_head" ] || [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Live PR/head changed during check reconciliation; refusing stale mutation."
            exit 0
          fi
          compute_evidence
          load_current_state
          guard_transition
          if [ "$transition_apply" != "true" ]; then
            echo "Check state converged before mutation: $transition_reason"
            exit 0
          fi

          state_json="$(jq -n --argjson packet "$packet" --arg state "$state" --arg reason "$reason" --arg run_id "$RUN_ID" --argjson pr_number "$pr_number" --arg head_sha "$head_sha" '{packet:$packet,state:$state,reason:$reason,run_id:$run_id,pr_number:$pr_number,head_sha:$head_sha}')"
          body="$(printf '%s' "$state_json" | node "$helper" state-body)"
          if [ "$state" = "READY_FOR_SUPERVISOR" ]; then
            ready_checkpoint="- Ready checkpoint: \`${task_id}@${head_sha}\`"
            if ! grep -Fqx -- "$ready_checkpoint" <<< "$body"; then
              echo "State body is missing the exact readiness checkpoint for $task_id@$head_sha; refusing mutation." >&2
              exit 1
            fi
          fi
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${REPOSITORY}/issues/comments/${comment_id}" -f body="$body" >/dev/null
          else
            gh api --method POST "repos/${REPOSITORY}/issues/548/comments" -f body="$body" >/dev/null
          fi
          echo "Reconciled task $task_id checks to $state on exact live head $head_sha."
