name: Worker supervisor sync

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: [CI, CodeQL, Targeted CI shadow, Production base health]
    types: [completed]

permissions: {}

jobs:
  resolve_worker_mutation_lane:
    name: Resolve trusted Worker branch mutation lane
    if: >-
      (github.event_name == 'pull_request_target' &&
        startsWith(github.event.pull_request.head.ref, 'work/proffera-')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number != null &&
        startsWith(github.event.workflow_run.head_branch, 'work/proffera-'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      trusted: ${{ steps.resolve.outputs.trusted }}

    steps:
      - name: Resolve exact Worker branch
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Refused: Worker mutation lane has no valid PR number." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            event_branch="$PR_HEAD_REF"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            event_branch="$RUN_HEAD_BRANCH"
          else
            echo "Unsupported event for Worker mutation lane." >&2
            exit 1
          fi
          pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          branch="$(jq -r '.head.ref // ""' <<< "$pr_json")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
          author="$(jq -r '.user.login // ""' <<< "$pr_json")"
          if [ "$event_branch" != "$branch" ] \
            || [[ "$branch" != work/proffera-* ]] \
            || [ "$head_repository" != "$REPOSITORY" ] \
            || [ "$author" != "${REPOSITORY%%/*}" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "PR #${PR_NUMBER} is not a trusted same-repository Worker mutation lane; leaving it unchanged."
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "trusted=true" >> "$GITHUB_OUTPUT"

  sync-pr-event:
    name: Reconcile Worker PR lifecycle
    needs: resolve_worker_mutation_lane
    if: >-
      needs.resolve_worker_mutation_lane.outputs.trusted == 'true' &&
      github.event_name == 'pull_request_target' &&
      startsWith(github.event.pull_request.head.ref, 'work/proffera-')
    concurrency:
      group: proffera-worker-lifecycle-${{ needs.resolve_worker_mutation_lane.outputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted default-branch task-state helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Record or update Worker lifecycle state in Supervisor issue
        id: lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          helper="scripts/supervisor-worker-handoff.mjs"
          task_marker='<!-- proffera-worker-task-packet:v1 -->'

          read_live_pr() {
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
            live_pr_state="$(jq -r '.state' <<< "$pr_json")"
            live_merged="$(jq -r '.merged == true' <<< "$pr_json")"
            pr_author="$(jq -r '.user.login // ""' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
            head_ref="$(jq -r '.head.ref // ""' <<< "$pr_json")"
            live_head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"
            base_sha="$(jq -r '.base.sha // ""' <<< "$pr_json")"
            pr_body="$(jq -r '.body // ""' <<< "$pr_json")"
            pr_url="$(jq -r '.html_url // ""' <<< "$pr_json")"
          }
          read_live_pr
          control_input="$(jq -cn --arg repository "$REPOSITORY" --arg run_id "$RUN_ID" '{repository:$repository,run_id:$run_id}')"
          mutex="$(printf '%s' "$control_input" | node "$helper" reservation-mutex-acquire)"
          echo "mutex=$mutex" >> "$GITHUB_OUTPUT"
          control_input="$(jq -c --arg mutex "$mutex" '. + {mutex:$mutex}' <<< "$control_input")"

          reconcile_invalid_closed_pr() {
            local current_pr_number="$1" reason="$2" result helper_status=0
            result="$(jq -cn --arg repository "$REPOSITORY" --argjson pr_number "$current_pr_number" --arg run_id "$RUN_ID" --arg mutex "$mutex" '{repository:$repository,pr_number:$pr_number,run_id:$run_id,mutex:$mutex}' | node "$helper" invalid-close-reconcile)" || helper_status=$?
            if [ "$helper_status" -ne 0 ] || ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "$result"; then
              echo "invalid-close-reconcile failed or returned invalid JSON (status ${helper_status}); refusing to report convergence." >&2
              exit 1
            fi
            case "$(jq -r '.code // ""' <<< "$result")" in
              valid_task_packet|legacy_worker_pr) return 1 ;;
            esac
            if [ "$(jq -r '.ok == true' <<< "$result")" != "true" ]; then
              result_code="$(jq -r '.code // ""' <<< "$result")"
              case "$result_code" in
                evidence_unavailable|evidence_changed|release_not_converged|task_evidence_changed)
                  echo "invalid-close-reconcile did not converge (${result_code}); failing for retry." >&2
                  exit 1
                  ;;
              esac
              if [ "$(jq -r '(.retryable == true) or (.reservation_mutated == true) or (.task_mutated == true)' <<< "$result")" = "true" ]; then
                echo "invalid-close-reconcile is retryable or partially mutated state; refusing to report convergence." >&2
                exit 1
              fi
              echo "Malformed closed Worker PR has no mutation-safe exact provenance: $(jq -r '.reason' <<< "$result")"
              return 0
            fi
            echo "Converged malformed closed Worker PR #${current_pr_number} to reservation RELEASED and its live terminal task state (${reason})."
          }

          if [ "$pr_author" = "ibboabdoli-ai" ] \
            && [ "$head_repo" = "$REPOSITORY" ] \
            && [[ "$head_ref" == work/proffera-* ]] \
            && [ "$live_pr_state" = "closed" ] \
            && [ -f "$helper" ]; then
            if reconcile_invalid_closed_pr "$PR_NUMBER" "missing, invalid, or reservation-mismatched Task Packet"; then
              exit 0
            fi
          fi

          # Task-aware lifecycle state is trusted only for a same-repository,
          # owner-authored work/proffera-* PR carrying a valid bounded packet.
          if [ "$pr_author" = "ibboabdoli-ai" ] \
            && [ "$head_repo" = "$REPOSITORY" ] \
            && [[ "$head_ref" == work/proffera-* ]] \
            && grep -Fq "$task_marker" <<< "$pr_body" \
            && [ -f "$helper" ]; then
            packet_file="$(mktemp)"
            if printf '%s' "$pr_body" | node "$helper" parse > "$packet_file" 2>/dev/null \
              && jq -e . "$packet_file" >/dev/null 2>&1; then
              packet="$(cat "$packet_file")"
              task_id="$(jq -r '.task_id' <<< "$packet")"
              packet_branch="$(jq -r '.branch' <<< "$packet")"
              packet_base="$(jq -r '.base_sha' <<< "$packet")"

              if [ "$packet_branch" != "$head_ref" ]; then
                echo "Task-aware PR branch does not match its packet; refusing trusted reconciliation." >&2
                exit 1
              fi

              reconcile_closed_pr() {
                local result helper_status=0
                result="$(jq -cn --arg repository "$REPOSITORY" --argjson pr_number "$PR_NUMBER" --arg run_id "$RUN_ID" --arg mutex "$mutex" --argjson packet "$packet" '{repository:$repository,pr_number:$pr_number,run_id:$run_id,mutex:$mutex,packet:$packet}' | node "$helper" valid-close-reconcile)" || helper_status=$?
                if [ "$helper_status" -ne 0 ] || ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "$result"; then
                  echo "valid-close-reconcile failed or returned invalid JSON (status ${helper_status}); refusing to report convergence." >&2
                  exit 1
                fi
                if [ "$(jq -r '.ok == true' <<< "$result")" != "true" ]; then
                  jq -r '.reason // "valid closed-PR reconciliation refused"' <<< "$result" >&2
                  if [ "$(jq -r '(.retryable == true) or (.reservation_mutated == true) or (.task_mutated == true)' <<< "$result")" = "true" ]; then
                    exit 1
                  fi
                  return 0
                fi
                echo "Converged live-closed lifecycle event for PR #${PR_NUMBER} to reservation RELEASED and task $(jq -r '.terminal_state' <<< "$result")."
                gh workflow run supervisor-planner.yml --repo "$REPOSITORY" || echo "Planner terminal-event dispatch could not be queued; hourly fallback remains available."
              }
              if [ "$live_pr_state" = "closed" ]; then
                reconcile_closed_pr
                exit 0
              fi
              if [ "$EVENT_HEAD_SHA" != "$live_head_sha" ]; then
                echo "Ignoring stale open lifecycle event for $EVENT_HEAD_SHA; live PR head is $live_head_sha."
                exit 0
              fi


              if [ "$ACTION" = "opened" ] || [ "$ACTION" = "reopened" ]; then
                state="WORKER_PR_OPENED"
                reason="Worker PR is live-verified open; exact-head checks and review are pending."
              elif [ "$ACTION" = "synchronize" ] || [ "$ACTION" = "ready_for_review" ]; then
                state="CHECKS_PENDING"
                reason="Worker PR live head is current; prior head-specific evidence is stale and current-head checks/review are pending."
              else
                state="CHECKS_PENDING"
                reason="Worker PR lifecycle changed; current-head checks remain authoritative."
              fi

              if [ "$ACTION" != "opened" ] && [ "$ACTION" != "reopened" ] && [ "$packet_base" != "$base_sha" ]; then
                reason="${reason} Task Packet bootstrap remains ${packet_base}; current PR base is ${base_sha}."
              fi

              admission_input="$(jq -c --argjson pr_number "$PR_NUMBER" --arg event_head "$EVENT_HEAD_SHA" --arg actor "$ACTOR" --arg source "lifecycle" --arg requested_state "$state" --arg reason "$reason" '. + {pr_number:$pr_number,event_head:$event_head,actor:$actor,source:$source,requested_state:$requested_state,reason:$reason}' <<< "$control_input")"
              admission="$(printf '%s' "$admission_input" | node "$helper" worker-pr-admit)"
              if [ "$(jq -r '.ok == true' <<< "$admission")" != "true" ]; then
                jq -r '.reason' <<< "$admission" >&2
                echo "Reopen the same unchanged PR after a Worker slot is available; do not submit another Task Packet or dispatch another Worker." >&2
                exit 1
              fi
              echo "Reconciled task $task_id to $state on live head $live_head_sha."
              exit 0
            fi

            echo "Trusted Phase-1 marker carries an invalid Task Packet; refusing legacy fallback." >&2
            exit 1
          fi

          # Preserve the existing legacy lifecycle trail for Workers that predate
          # Phase 1. Avoid new synchronize spam for those legacy PRs.
          if [ "$ACTION" = "synchronize" ]; then
            echo "Legacy Worker PR synchronize event: no new Supervisor comment."
            exit 0
          fi

          case "$ACTION" in
            opened) event_state="OPENED" ;;
            reopened) event_state="REOPENED" ;;
            ready_for_review) event_state="READY_FOR_REVIEW" ;;
            closed)
              if [ "$live_merged" = "true" ]; then
                event_state="MERGED"
              else
                event_state="CLOSED_UNMERGED"
              fi
              ;;
            *) event_state="${ACTION^^}" ;;
          esac

          body="$(cat <<LEGACY
          <!-- proffera-worker-supervisor-event -->
          ### Worker event: ${event_state}
          - PR: #${PR_NUMBER}
          - Branch: \`${head_ref}\`
          - Head: \`${live_head_sha}\`
          - Base: \`${base_sha}\`
          - Actor: \`${ACTOR}\`
          - URL: ${pr_url}
          LEGACY
          )"
          gh issue comment 548 --repo "$REPOSITORY" --body "$body"

      - name: Release exact Worker lifecycle reservation mutex
        if: always() && steps.lifecycle.outputs.mutex != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MUTEX: ${{ steps.lifecycle.outputs.mutex }}
        shell: bash
        run: |
          set -euo pipefail
          helper="scripts/supervisor-worker-handoff.mjs"
          control_input="$(jq -cn --arg repository "$REPOSITORY" --arg run_id "$RUN_ID" --arg mutex "$MUTEX" '{repository:$repository,run_id:$run_id,mutex:$mutex}')"
          release_status=0
          printf '%s' "$control_input" | node "$helper" reservation-mutex-release || release_status=$?
          case "$release_status" in
            0) echo "Released Worker lifecycle reservation mutex owned by run $RUN_ID." ;;
            3) echo "Worker lifecycle reservation mutex was already released or ownership changed; no unsafe deletion was attempted." ;;
            *) echo "reservation-mutex-release failed (status ${release_status}); mutex may still be held." >&2; exit 1 ;;
          esac

  sync-check-state:
    name: Reconcile exact-head checks into task state
    needs: resolve_worker_mutation_lane
    if: >-
      needs.resolve_worker_mutation_lane.outputs.trusted == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    concurrency:
      group: proffera-worker-checks-${{ needs.resolve_worker_mutation_lane.outputs.branch }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout trusted default-branch task-state helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Reconcile required current-head workflow evidence
        id: reconcile
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          helper="scripts/supervisor-worker-handoff.mjs"
          pr_number="$EVENT_PR_NUMBER"
          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "No valid PR number; nothing to reconcile."
            exit 0
          fi

          read_live_pr() {
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")"
            pr_state="$(jq -r '.state' <<< "$pr_json")"
            pr_merged="$(jq -r '.merged == true' <<< "$pr_json")"
            pr_author="$(jq -r '.user.login // ""' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<< "$pr_json")"
            head_ref="$(jq -r '.head.ref // ""' <<< "$pr_json")"
            head_sha="$(jq -r '.head.sha // ""' <<< "$pr_json")"
            pr_body="$(jq -r '.body // ""' <<< "$pr_json")"
          }

          read_live_pr
          control_input="$(jq -cn --arg repository "$REPOSITORY" --arg run_id "$RUN_ID" '{repository:$repository,run_id:$run_id}')"
          mutex="$(printf '%s' "$control_input" | node "$helper" reservation-mutex-acquire)"
          echo "mutex=$mutex" >> "$GITHUB_OUTPUT"
          control_input="$(jq -c --arg mutex "$mutex" '. + {mutex:$mutex}' <<< "$control_input")"
          reconcile_invalid_closed_pr() {
            local current_pr_number="$1" reason="$2" result helper_status=0
            result="$(jq -cn --arg repository "$REPOSITORY" --argjson pr_number "$current_pr_number" --arg run_id "$RUN_ID" --arg mutex "$mutex" '{repository:$repository,pr_number:$pr_number,run_id:$run_id,mutex:$mutex}' | node "$helper" invalid-close-reconcile)" || helper_status=$?
            if [ "$helper_status" -ne 0 ] || ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "$result"; then
              echo "invalid-close-reconcile failed or returned invalid JSON (status ${helper_status}); refusing to report convergence." >&2
              exit 1
            fi
            case "$(jq -r '.code // ""' <<< "$result")" in
              valid_task_packet|legacy_worker_pr) return 1 ;;
            esac
            if [ "$(jq -r '.ok == true' <<< "$result")" != "true" ]; then
              result_code="$(jq -r '.code // ""' <<< "$result")"
              case "$result_code" in
                evidence_unavailable|evidence_changed|release_not_converged|task_evidence_changed)
                  echo "invalid-close-reconcile did not converge (${result_code}); failing for retry." >&2
                  exit 1
                  ;;
              esac
              if [ "$(jq -r '(.retryable == true) or (.reservation_mutated == true) or (.task_mutated == true)' <<< "$result")" = "true" ]; then
                echo "invalid-close-reconcile is retryable or partially mutated state; refusing to report convergence." >&2
                exit 1
              fi
              echo "Malformed closed Worker PR has no mutation-safe exact provenance: $(jq -r '.reason' <<< "$result")"
              return 0
            fi
            echo "Converged malformed closed Worker PR #${current_pr_number} to reservation RELEASED and its live terminal task state (${reason})."
          }

          if [ "$pr_author" = "ibboabdoli-ai" ] \
            && [ "$head_repo" = "$REPOSITORY" ] \
            && [[ "$head_ref" == work/proffera-* ]] \
            && [ "$pr_state" = "closed" ]; then
            if reconcile_invalid_closed_pr "$pr_number" "missing, invalid, or reservation-mismatched Task Packet"; then
              exit 0
            fi
          fi

          if [ "$pr_author" != "ibboabdoli-ai" ] \
            || [ "$head_repo" != "$REPOSITORY" ] \
            || [[ "$head_ref" != work/proffera-* ]] \
            || ! grep -Fq '<!-- proffera-worker-task-packet:v1 -->' <<< "$pr_body"; then
            echo "PR #$pr_number is not a trusted Phase-1 Worker PR; nothing to reconcile."
            exit 0
          fi
          packet_file="$(mktemp)"
          if ! printf '%s' "$pr_body" | node "$helper" parse > "$packet_file" 2>/dev/null; then
            echo "Trusted Phase-1 marker carries an invalid Task Packet; refusing reconciliation." >&2
            exit 1
          fi
          packet="$(cat "$packet_file")"
          task_id="$(jq -r '.task_id' <<< "$packet")"
          packet_branch="$(jq -r '.branch' <<< "$packet")"
          if [ "$packet_branch" != "$head_ref" ]; then
            echo "Task Packet branch mismatch; refusing reconciliation." >&2
            exit 1
          fi

          reconcile_closed_pr() {
            local result helper_status=0
            result="$(jq -cn --arg repository "$REPOSITORY" --argjson pr_number "$pr_number" --arg run_id "$RUN_ID" --arg mutex "$mutex" --argjson packet "$packet" '{repository:$repository,pr_number:$pr_number,run_id:$run_id,mutex:$mutex,packet:$packet}' | node "$helper" valid-close-reconcile)" || helper_status=$?
            if [ "$helper_status" -ne 0 ] || ! jq -e 'type == "object"' >/dev/null 2>&1 <<< "$result"; then
              echo "valid-close-reconcile failed or returned invalid JSON (status ${helper_status}); refusing to report convergence." >&2
              exit 1
            fi
            if [ "$(jq -r '.ok == true' <<< "$result")" != "true" ]; then
              jq -r '.reason // "valid closed-PR reconciliation refused"' <<< "$result" >&2
              if [ "$(jq -r '(.retryable == true) or (.reservation_mutated == true) or (.task_mutated == true)' <<< "$result")" = "true" ]; then
                exit 1
              fi
              return 0
            fi
            echo "Converged closed Worker PR #${pr_number} to reservation RELEASED and task $(jq -r '.terminal_state' <<< "$result")."
          }
          if [ "$pr_state" = "closed" ]; then
            reconcile_closed_pr
            exit 0
          fi
          if [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "Workflow completion is stale for open PR #$pr_number; current head is $head_sha."
            exit 0
          fi
          if [ "$pr_state" != "open" ]; then
            echo "PR #$pr_number is neither open nor closed; nothing to reconcile."
            exit 0
          fi


          compute_evidence() {
            runs_json="$(gh api --paginate "repos/${REPOSITORY}/actions/runs?head_sha=${head_sha}&event=pull_request&per_page=100" --jq '.workflow_runs[]' | jq -s '.')"
            required=("CI" "CodeQL" "Targeted CI shadow" "Production base health")
            all_success=yes
            evidence=""
            for workflow_name in "${required[@]}"; do
              conclusion="$(jq -r --arg name "$workflow_name" '[.[] | select(.name == $name)] | sort_by(.created_at // "", .id // 0) | last | .conclusion // "missing"' <<< "$runs_json")"
              evidence="${evidence}${workflow_name}=${conclusion}; "
              if [ "$conclusion" != "success" ]; then
                all_success=no
              fi
            done
            if [ "$all_success" = "yes" ]; then
              state="READY_FOR_SUPERVISOR"
              reason="All required exact-live-head workflow evidence is green. CI success includes the existing final browser/review gate; human merge approval remains external."
            else
              state="CHECKS_PENDING"
              reason="Required exact-live-head workflow evidence is not fully green yet: ${evidence}"
            fi
          }

          # Compute exact-head workflow evidence again just before canonical admission.
          read_live_pr
          if [ "$pr_state" != "open" ] || [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "PR/head changed before check reconciliation; refusing stale mutation."
            exit 0
          fi
          compute_evidence
          read_live_pr
          if [ "$pr_state" != "open" ] || [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "PR/head changed during check reconciliation; refusing stale mutation."
            exit 0
          fi
          compute_evidence
          admission_input="$(jq -c --argjson pr_number "$pr_number" --arg event_head "$EVENT_HEAD_SHA" --arg actor "$ACTOR" --arg source "checks" --arg requested_state "$state" --arg reason "$reason" '. + {pr_number:$pr_number,event_head:$event_head,actor:$actor,source:$source,requested_state:$requested_state,reason:$reason}' <<< "$control_input")"
          admission="$(printf '%s' "$admission_input" | node "$helper" worker-pr-admit)"
          if [ "$(jq -r '.ok == true' <<< "$admission")" != "true" ]; then
            jq -r '.reason' <<< "$admission" >&2
            echo "Reopen the same unchanged PR after a Worker slot is available; do not submit another Task Packet or dispatch another Worker." >&2
            exit 1
          fi
          echo "Reconciled task $task_id checks to $state on exact live head $head_sha."

      - name: Release exact Worker reservation mutex
        if: always() && steps.reconcile.outputs.mutex != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          MUTEX: ${{ steps.reconcile.outputs.mutex }}
        shell: bash
        run: |
          set -euo pipefail
          helper="scripts/supervisor-worker-handoff.mjs"
          control_input="$(jq -cn --arg repository "$REPOSITORY" --arg run_id "$RUN_ID" --arg mutex "$MUTEX" '{repository:$repository,run_id:$run_id,mutex:$mutex}')"
          release_status=0
          printf '%s' "$control_input" | node "$helper" reservation-mutex-release || release_status=$?
          case "$release_status" in
            0) echo "Released Worker reservation mutex owned by run $RUN_ID." ;;
            3) echo "Worker reservation mutex was already released or ownership changed; no unsafe deletion was attempted." ;;
            *) echo "reservation-mutex-release failed (status ${release_status}); mutex may still be held." >&2; exit 1 ;;
          esac
