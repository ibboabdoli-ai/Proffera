name: Preview Marketplace lifecycle E2E

on:
  push:
    branches:
      - preview/proffera-marketplace-lifecycle-e2e-20260823

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e
    env:
      E2E_BASE_URL: https://proffera-jhap-qoym0xdej-wzardmn.vercel.app
      E2E_ALLOW_REMOTE: "true"
      E2E_MARKETPLACE_PROVIDER_TOKEN: PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP
      E2E_MARKETPLACE_CUSTOMER_TOKEN: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
      E2E_MARKETPLACE_REVIEW_TOKEN: RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR
      E2E_MARKETPLACE_REMATCH_CUSTOMER_TOKEN: MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/preview-marketplace-lifecycle.e2e.mjs --project=chromium
