name: Production company directory full discovery

on:
  push:
    branches: [ops/company-directory-full-discovery-20260812]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve production endpoint
        env:
          REMINDER_CRON_URL: ${{ secrets.PROFFERA_REMINDER_CRON_URL }}
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$REMINDER_CRON_URL"
          test -n "$CRON_SECRET"
          python - <<'PY' >> "$GITHUB_ENV"
          import os, urllib.parse
          u = urllib.parse.urlparse(os.environ['REMINDER_CRON_URL'])
          if u.scheme != 'https' or not u.netloc:
              raise SystemExit('Invalid production cron URL')
          host = 'www.proffera.se' if u.netloc in {'proffera.se', 'www.proffera.se'} else u.netloc
          origin = f'https://{host}'
          print(f'INGEST_URL={origin}/api/cron/company-directory-discovery-ingest')
          print(f'SYNC_URL={origin}/api/cron/company-directory-sync')
          PY

      - name: Install streaming JSON parser
        run: python -m pip install --disable-pip-version-check --quiet ijson

      - name: Scan current official SCB HVD bulk and enqueue all matching candidates
        env:
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
          BOLAGSVERKET_BULK_URL: ${{ vars.BOLAGSVERKET_BULK_URL }}
        run: |
          set -euo pipefail
          python scripts/company-directory-discovery.py \
            --ingest-url "$INGEST_URL" \
            --secret "$CRON_SECRET"

      - name: Process first Production batch
        env:
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 75 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-full-discovery" \
            "$SYNC_URL")"
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True; assert d.get('errors',0) == 0"
