name: Marketplace Preview browser E2E

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "e2e/tests/marketplace-preview-lifecycle.e2e.mjs"
      - "e2e/playwright.config.mjs"
      - "e2e/run-marketplace-preview-lifecycle.sh"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - "tests/preview-marketplace-*.test.ts"
      - "src/app/api/e2e/marketplace/**"
      - "src/lib/preview-marketplace-e2e.ts"
      - "src/lib/preview-marketplace-e2e-constants.ts"
      - "src/features/quote-request/**"
      - "src/features/matching/**"
      - "src/features/email/marketplace-guest-invitation-email.ts"
      - "src/features/email/marketplace-customer-comparison-email.ts"
      - "src/features/email/review-invitation-email.ts"
      - "src/lib/email-runtime-config.ts"
      - "src/lib/marketplace-*.ts"
      - "src/app/api/marketplace/**"
      - "src/app/offert/svara/**"
      - "src/app/offert/jamfor/**"
      - "src/app/offert/jobb/**"
      - "src/app/review/marketplace/**"
      - "src/app/review/[token]/verified-review-form.tsx"
      - ".github/workflows/marketplace-preview-browser-e2e.yml"

permissions:
  contents: read # Read the exact pull-request head; no repository writes.
  deployments: read # Discover the exact-head Vercel Preview deployment.

concurrency:
  group: marketplace-preview-browser-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-browser:
    name: Marketplace Preview browser lifecycle
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'work/proffera-marketplace-browser-lifecycle-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # Checkout the exact pull-request head.
      deployments: read # Poll deployment status for the exact head.
      id-token: write # Mint short-lived GitHub OIDC only for this Preview E2E job.

    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Resolve successful isolated Vercel Preview deployment
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          preview_url=""

          for attempt in $(seq 1 60); do
            if ! deployments="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}/deployments?sha=${HEAD_SHA}&per_page=20")"; then
              echo "Transient deployments API error on attempt ${attempt}/60; retrying." >&2
              sleep 10
              continue
            fi

            while IFS= read -r deployment_id; do
              [ -n "${deployment_id}" ] || continue
              if ! statuses="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${api}/deployments/${deployment_id}/statuses?per_page=20")"; then
                echo "Transient deployment-status API error for ${deployment_id}; continuing." >&2
                continue
              fi
              candidate="$(jq -r '[.[] | select(.state == "success") | .environment_url // empty][0] // empty' <<<"${statuses}")"
              if [ -n "${candidate}" ]; then
                host="$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.hostname)' "${candidate}")"
                protocol="$(node -e 'const u=new URL(process.argv[1]); process.stdout.write(u.protocol)' "${candidate}")"
                if [ "${protocol}" = "https:" ] \
                  && [[ "${host}" == *.vercel.app ]] \
                  && [ "${host}" != "proffera.se" ] \
                  && [ "${host}" != "www.proffera.se" ] \
                  && [ "${host}" != "chat.proffera.se" ]; then
                  preview_url="${candidate%/}"
                  break 2
                fi
              fi
            done < <(jq -r '.[] | select((.environment // "") != "Production" and (.environment // "") != "production") | .id' <<<"${deployments}")

            echo "Waiting for Vercel Preview deployment for ${HEAD_SHA} (${attempt}/60)..."
            sleep 10
          done

          if [ -z "${preview_url}" ]; then
            echo "No successful isolated Vercel Preview deployment was found for exact head ${HEAD_SHA}." >&2
            exit 1
          fi

          echo "url=${preview_url}" >> "${GITHUB_OUTPUT}"
          echo "Using isolated Preview deployment: ${preview_url}"

      - name: Install browser test dependencies
        working-directory: e2e
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run full Marketplace Preview browser lifecycle
        working-directory: e2e
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
          E2E_ALLOW_REMOTE: "true"
          E2E_MARKETPLACE_PREVIEW_LIFECYCLE: "true"
        shell: bash
        run: ./run-marketplace-preview-lifecycle.sh
