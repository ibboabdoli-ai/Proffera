name: Isolated company directory pilot

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

concurrency:
  group: company-directory-isolated-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: Scan official bulk data and process at most 20 pilot candidates
    if: github.event.head_commit.message == 'Run isolated company directory pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PREVIEW_ORIGIN: https://proffera-jhap-q8sktm4fv-wzardmn.vercel.app
      CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
      BOLAGSVERKET_BULK_URL: https://vardefulla-datamangder.bolagsverket.se/bolagsverket/bolagsverket_bulkfil.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail closed on configuration
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          case "$PREVIEW_ORIGIN" in
            https://proffera-jhap-q8sktm4fv-wzardmn.vercel.app) ;;
            *) echo "Unexpected Preview origin" >&2; exit 1 ;;
          esac

      - name: Verify Preview automatic discovery is enabled
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-isolated-pilot" \
            "$PREVIEW_ORIGIN/api/cron/company-directory-discovery-ingest" \
            | tee /tmp/discovery-probe.json
          python - <<'PY'
          import json
          with open('/tmp/discovery-probe.json', encoding='utf-8') as f:
              payload = json.load(f)
          if payload.get('ok') is not True or payload.get('enabled') is not True or payload.get('mode') != 'automatic':
              raise SystemExit(f"Preview discovery is not safely enabled: {payload}")
          PY

      - name: Install streaming JSON parser
        run: python -m pip install --disable-pip-version-check --quiet ijson

      - name: Scan official Bolagsverket bulk and enqueue first 20 matching candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import os
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          script = Path('scripts/company-directory-discovery.py')
          spec = importlib.util.spec_from_file_location('company_directory_discovery', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          ingest_url = os.environ['PREVIEW_ORIGIN'].rstrip('/') + '/api/cron/company-directory-discovery-ingest'
          secret = os.environ['CRON_SECRET']
          source_url = module.resolve_bulk_url(os.environ['BOLAGSVERKET_BULK_URL'])
          if not module.is_allowed_source_url(source_url):
              raise RuntimeError('Refusing non-Bolagsverket source')

          head = urllib.request.Request(
              source_url,
              method='HEAD',
              headers={'User-Agent': 'proffera-company-directory-isolated-pilot'},
          )
          with urllib.request.urlopen(head, timeout=60) as response:
              final_url = response.geturl()
              if not module.is_allowed_source_url(final_url):
                  raise RuntimeError('HEAD redirected outside official Bolagsverket domain')
              total_size = int(response.headers.get('Content-Length') or '0')
              if total_size <= 0 or total_size > module.MAX_DOWNLOAD_BYTES:
                  raise RuntimeError(f'Unsafe official bulk size: {total_size}')

          fd, temp_name = tempfile.mkstemp(prefix='proffera-bolagsverket-segmented-', suffix='.zip')
          os.close(fd)
          archive_path = Path(temp_name)
          segment_size = 8 * 1024 * 1024
          try:
              with archive_path.open('wb') as output:
                  for start in range(0, total_size, segment_size):
                      end = min(total_size - 1, start + segment_size - 1)
                      expected = end - start + 1
                      data = None
                      last_error = None
                      for attempt in range(1, 5):
                          try:
                              request = urllib.request.Request(
                                  source_url,
                                  headers={
                                      'User-Agent': 'proffera-company-directory-isolated-pilot',
                                      'Range': f'bytes={start}-{end}',
                                  },
                              )
                              with urllib.request.urlopen(request, timeout=90) as response:
                                  if response.status != 206:
                                      raise RuntimeError(f'Expected HTTP 206, got {response.status}')
                                  if not module.is_allowed_source_url(response.geturl()):
                                      raise RuntimeError('Range request redirected outside official domain')
                                  candidate = response.read()
                              if len(candidate) != expected:
                                  raise RuntimeError(f'Short segment {start}-{end}: {len(candidate)} of {expected}')
                              data = candidate
                              break
                          except Exception as error:
                              last_error = error
                              print(f'Retrying official segment {start}-{end}, attempt {attempt}: {error}')
                      if data is None:
                          raise RuntimeError(f'Could not download segment {start}-{end}: {last_error}')
                      output.write(data)
                      print(f'Downloaded {end + 1}/{total_size} official bytes')

              if archive_path.stat().st_size != total_size:
                  raise RuntimeError('Segmented official download size mismatch')
              if not zipfile.is_zipfile(archive_path):
                  raise RuntimeError('Segmented official download is not a valid ZIP')
              fingerprint = hashlib.sha256(archive_path.read_bytes()).hexdigest()
              with zipfile.ZipFile(archive_path) as archive:
                  print('Official ZIP members:', [(item.filename, item.file_size) for item in archive.infolist()[:10]])

              candidates, records_seen = module.collect_candidates(archive_path)
              pilot_candidates = candidates[:20]
              print(f'Official records scanned: {records_seen}')
              print(f'All pilot + supported-SNI candidates found: {len(candidates)}')
              print(f'Candidates enqueued for isolated pilot: {len(pilot_candidates)}')
              module.post_candidates(
                  ingest_url,
                  secret,
                  source_url,
                  fingerprint,
                  pilot_candidates,
                  records_seen,
              )
          finally:
              archive_path.unlink(missing_ok=True)
          PY

      - name: Process one bounded queue batch
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 75 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-isolated-pilot" \
            "$PREVIEW_ORIGIN/api/cron/company-directory-sync" \
            | tee /tmp/process-result.json
