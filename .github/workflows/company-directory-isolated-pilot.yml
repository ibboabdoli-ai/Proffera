name: Isolated company directory pilot

on:
  push:
    branches:
      - work/proffera-company-profile-engine

permissions:
  contents: read

concurrency:
  group: company-directory-isolated-pilot
  cancel-in-progress: true

jobs:
  pilot:
    name: Discover from official SCB bulk and process at most 20 pilot candidates
    if: github.event.head_commit.message == 'Run isolated company directory pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_ORIGIN: https://proffera-jhap-q8sktm4fv-wzardmn.vercel.app
      CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
      SCB_BULK_URL: https://vardefulla-datamangder.bolagsverket.se/scb/scb_bulkfil.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail closed on configuration
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          case "$PREVIEW_ORIGIN" in
            https://proffera-jhap-q8sktm4fv-wzardmn.vercel.app) ;;
            *) echo "Unexpected Preview origin" >&2; exit 1 ;;
          esac
          case "$SCB_BULK_URL" in
            https://vardefulla-datamangder.bolagsverket.se/scb/scb_bulkfil.zip) ;;
            *) echo "Unexpected SCB source" >&2; exit 1 ;;
          esac

      - name: Verify Preview automatic discovery is enabled
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-isolated-pilot" \
            "$PREVIEW_ORIGIN/api/cron/company-directory-discovery-ingest" \
            | tee /tmp/discovery-probe.json
          python - <<'PY'
          import json
          with open('/tmp/discovery-probe.json', encoding='utf-8') as f:
              payload = json.load(f)
          if payload.get('ok') is not True or payload.get('enabled') is not True or payload.get('mode') != 'automatic':
              raise SystemExit(f"Preview discovery is not safely enabled: {payload}")
          PY

      - name: Discover first 20 matching organisations from official SCB bulk
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import hashlib
          import importlib.util
          import io
          import json
          import os
          import re
          import tempfile
          import urllib.request
          import zipfile
          from pathlib import Path

          script = Path('scripts/company-directory-discovery.py')
          spec = importlib.util.spec_from_file_location('company_directory_discovery', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          source_url = os.environ['SCB_BULK_URL']
          ingest_url = os.environ['PREVIEW_ORIGIN'].rstrip('/') + '/api/cron/company-directory-discovery-ingest'
          secret = os.environ['CRON_SECRET']
          if not module.is_allowed_source_url(source_url):
              raise RuntimeError('Refusing non-Bolagsverket source')

          head = urllib.request.Request(
              source_url,
              method='HEAD',
              headers={'User-Agent': 'proffera-company-directory-isolated-pilot'},
          )
          with urllib.request.urlopen(head, timeout=60) as response:
              if not module.is_allowed_source_url(response.geturl()):
                  raise RuntimeError('HEAD redirected outside official Bolagsverket domain')
              total_size = int(response.headers.get('Content-Length') or '0')
              if total_size <= 0 or total_size > module.MAX_DOWNLOAD_BYTES:
                  raise RuntimeError(f'Unsafe official SCB bulk size: {total_size}')
              if 'zip' not in (response.headers.get('Content-Type') or '').lower():
                  raise RuntimeError('Official SCB source is not advertised as ZIP')

          fd, temp_name = tempfile.mkstemp(prefix='proffera-scb-segmented-', suffix='.zip')
          os.close(fd)
          archive_path = Path(temp_name)
          segment_size = 8 * 1024 * 1024
          try:
              with archive_path.open('wb') as output:
                  for start in range(0, total_size, segment_size):
                      end = min(total_size - 1, start + segment_size - 1)
                      expected = end - start + 1
                      segment = None
                      last_error = None
                      for attempt in range(1, 5):
                          try:
                              request = urllib.request.Request(
                                  source_url,
                                  headers={
                                      'User-Agent': 'proffera-company-directory-isolated-pilot',
                                      'Range': f'bytes={start}-{end}',
                                  },
                              )
                              with urllib.request.urlopen(request, timeout=90) as response:
                                  if response.status != 206:
                                      raise RuntimeError(f'Expected HTTP 206, got {response.status}')
                                  if not module.is_allowed_source_url(response.geturl()):
                                      raise RuntimeError('Range request redirected outside official domain')
                                  candidate = response.read()
                              if len(candidate) != expected:
                                  raise RuntimeError(f'Short segment {start}-{end}: {len(candidate)} of {expected}')
                              segment = candidate
                              break
                          except Exception as error:
                              last_error = error
                              print(f'Retrying official SCB segment {start}-{end}, attempt {attempt}: {error}')
                      if segment is None:
                          raise RuntimeError(f'Could not download SCB segment {start}-{end}: {last_error}')
                      output.write(segment)

              if archive_path.stat().st_size != total_size:
                  raise RuntimeError('Segmented SCB download size mismatch')
              if not zipfile.is_zipfile(archive_path):
                  raise RuntimeError('Segmented SCB download is not a valid ZIP')

              digest = hashlib.sha256()
              with archive_path.open('rb') as source:
                  while True:
                      chunk = source.read(1024 * 1024)
                      if not chunk:
                          break
                      digest.update(chunk)
              fingerprint = digest.hexdigest()

              candidates = []
              seen = set()
              rows_scanned = 0
              with zipfile.ZipFile(archive_path) as archive:
                  members = [item for item in archive.infolist() if not item.is_dir() and item.filename.lower().endswith(('.txt', '.tsv', '.csv'))]
                  if not members:
                      raise RuntimeError('SCB ZIP contains no supported delimited-text member')
                  member = members[0]
                  with archive.open(member) as raw:
                      text = io.TextIOWrapper(raw, encoding='utf-8-sig', errors='replace', newline='')
                      reader = csv.DictReader(text, delimiter='\t')
                      required = {'PeOrgNr', 'PostOrt', 'Ng1', 'Ng2', 'Ng3', 'Ng4', 'Ng5'}
                      fieldnames = set(reader.fieldnames or [])
                      if not required.issubset(fieldnames):
                          raise RuntimeError(f'Unexpected SCB schema; missing fields: {sorted(required - fieldnames)}')

                      for row in reader:
                          rows_scanned += 1
                          pe_org = re.sub(r'\D', '', row.get('PeOrgNr') or '')
                          if len(pe_org) != 12 or not pe_org.startswith('16'):
                              continue
                          organization_number = pe_org[2:]
                          if len(organization_number) != 10:
                              continue
                          if not any(module.supported_sni(row.get(key) or '') for key in ('Ng1', 'Ng2', 'Ng3', 'Ng4', 'Ng5')):
                              continue
                          if not module.pilot_location(row.get('PostOrt') or ''):
                              continue
                          if organization_number in seen:
                              continue
                          seen.add(organization_number)
                          candidates.append(organization_number)
                          if len(candidates) >= 20:
                              break

              if not candidates:
                  raise RuntimeError('No Stockholm/Södertälje + supported-SNI candidates found in official SCB bulk')

              print(f'SCB rows scanned before pilot limit: {rows_scanned}')
              print(f'Candidates selected for isolated pilot: {len(candidates)}')
              payload = {
                  'provider': 'scb_hvd_bulk',
                  'sourceUrl': source_url,
                  'fingerprint': fingerprint,
                  'organizationNumbers': candidates,
                  'discoveredCount': rows_scanned,
                  'acceptedCount': len(candidates),
                  'final': True,
              }
              result = module.api_request(ingest_url, secret, 'POST', payload)
              if not result.get('ok'):
                  raise RuntimeError(f'Discovery ingest rejected isolated SCB pilot: {result}')
              print('SCB pilot ingest accepted by Preview')
          finally:
              archive_path.unlink(missing_ok=True)
          PY

      - name: Process one bounded queue batch through official detail verification
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 75 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-company-directory-isolated-pilot" \
            "$PREVIEW_ORIGIN/api/cron/company-directory-sync" \
            | tee /tmp/process-result.json
