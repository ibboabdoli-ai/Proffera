name: Fix PrimeView pricing type guard

on:
  push:
    branches:
      - feature/primeview-precision-pricing

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/primeview-precision-pricing
      - name: Apply targeted TypeScript fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/primeview-booking/page.tsx')
          text = path.read_text()
          old = '  ].filter(Boolean);\n  detailLines.push(...fieldSummary);'
          new = '  ].filter((value): value is string => Boolean(value));\n  detailLines.push(...fieldSummary);'
          if old not in text:
              raise SystemExit('target snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/fix-primeview-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/primeview-booking/page.tsx .github/workflows/fix-primeview-type.yml
          git commit -m "fix: narrow PrimeView pricing summary strings"
          git push origin HEAD:feature/primeview-precision-pricing
