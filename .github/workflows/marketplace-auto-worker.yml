name: Marketplace Auto Worker

on:
  schedule:
    # Keep one proven-live GitHub schedule owner and fan out to the reusable
    # Production workers. Splitting the 15-minute cadence lets the health gate
    # run only at :08/:38 without creating overlapping cron entries.
    - cron: "8,38 * * * *"
    - cron: "23,53 * * * *"
    # Preserve the Directory source probe and daily safety scan cadences.
    - cron: "17 * * * *"
    - cron: "31 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  MARKETPLACE_AUTO_WORKER_URL: https://www.proffera.se/api/cron/marketplace-auto-worker

jobs:
  dispatch:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '8,38 * * * *' ||
      github.event.schedule == '23,53 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: marketplace-auto-worker
      cancel-in-progress: false
    steps:
      - name: Verify Marketplace scheduler configuration
        env:
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MARKETPLACE_AUTO_WORKER_URL"
          test -n "$CRON_SECRET"
          python - <<'PY'
          import os
          import urllib.parse

          url = urllib.parse.urlparse(os.environ["MARKETPLACE_AUTO_WORKER_URL"])
          if url.scheme != "https" or not url.netloc:
              raise SystemExit("MARKETPLACE_AUTO_WORKER_URL must be an HTTPS URL")
          if url.path.rstrip("/") != "/api/cron/marketplace-auto-worker":
              raise SystemExit("MARKETPLACE_AUTO_WORKER_URL must target /api/cron/marketplace-auto-worker")
          PY

      - name: Process Marketplace invitation waves
        env:
          CRON_SECRET: ${{ secrets.PROFFERA_REMINDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 70 \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "User-Agent: proffera-marketplace-auto-worker-github-actions" \
            "$MARKETPLACE_AUTO_WORKER_URL")"

          WORKER_RESPONSE="$response" python - <<'PY'
          import json
          import os

          try:
              payload = json.loads(os.environ["WORKER_RESPONSE"])
          except json.JSONDecodeError as exc:
              print(f"::error::Marketplace Auto Worker returned invalid JSON: {exc}")
              raise SystemExit(1)

          skip_reason = payload.get("skipped") if isinstance(payload.get("skipped"), str) else None
          if skip_reason in {"disabled", "production_not_authorized", "production_cutoff_not_configured"}:
              print(f"Marketplace Auto Worker skipped safely: {skip_reason}")
              raise SystemExit(0)

          if payload.get("ok") is not True:
              print(f"::error::Marketplace Auto Worker failed: {payload.get('error', 'unknown_error')}")
              raise SystemExit(1)

          if payload.get("deadlineReached") is True:
              print("::error::Marketplace Auto Worker reached its execution deadline")
              raise SystemExit(1)

          skip_counts = payload.get("skipped") if isinstance(payload.get("skipped"), dict) else {}
          safe_delivery_states = {
              "delivery_quote_closed",
              "delivery_consent_required",
              "delivery_profile_ineligible",
              "delivery_suppressed",
              "delivery_already_invited",
              "delivery_conflict",
          }
          delivery_errors = sum(
              int(value or 0)
              for key, value in skip_counts.items()
              if key.startswith("delivery_") and key not in safe_delivery_states
          )
          if delivery_errors > 0:
              print(f"::error::Marketplace Auto Worker recorded {delivery_errors} delivery errors")
              raise SystemExit(1)

          print(
              "Marketplace Auto Worker completed: "
              f"scanned={payload.get('scanned', 0)} "
              f"attempted={payload.get('attempted', 0)} "
              f"sent={payload.get('sent', 0)}"
          )
          PY

          # This scheduler is a best-effort trigger. Persisted Marketplace state
          # and application-side monitoring remain the source of truth for throughput.

  operations:
    if: >-
      github.event_name == 'schedule' &&
      (github.event.schedule == '8,38 * * * *' ||
       github.event.schedule == '23,53 * * * *')
    uses: ./.github/workflows/booking-reminders.yml
    secrets: inherit

  production-health:
    if: >-
      github.event_name == 'schedule' &&
      github.event.schedule == '8,38 * * * *'
    uses: ./.github/workflows/production-health.yml
    secrets: inherit

  company-directory:
    if: >-
      github.event_name == 'schedule' &&
      (github.event.schedule == '17 * * * *' ||
       github.event.schedule == '31 3 * * *')
    uses: ./.github/workflows/company-directory-automation.yml
    with:
      trigger_schedule: ${{ github.event.schedule }}
    secrets: inherit
