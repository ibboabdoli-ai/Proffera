name: Temporary sole-trader type-code diagnostic

on:
  push:
    branches:
      - work/proffera-sole-trader-type-code-diagnostic

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-type-code-diagnostic
      - name: Harden privacy-safe type-code diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('src/lib/company-directory-sole-trader-owner.ts')
          text = source.read_text()
          old = '''      typeCode: (() => {\n        const type = identityType(row);\n        if (!type) return "MISSING";\n        return /^[A-Z0-9_-]{1,40}$/.test(type) ? type : "OTHER";\n      })(),'''
          new = '''      typeCode: (() => {\n        const type = identityType(row);\n        if (!type) return "MISSING";\n        if (hasPersonnummerLikeValue(type)) return "REDACTED";\n        return /^[A-Z0-9_-]{1,40}$/.test(type) ? type : "OTHER";\n      })(),'''
          if text.count(old) != 1:
              raise SystemExit('type-code diagnostic block not found exactly once')
          source.write_text(text.replace(old, new, 1))

          test = Path('tests/company-directory-sole-trader-owner.test.ts')
          t = test.read_text()
          anchor = '''  it("preserves the provider's first valid SNI instead of promoting a supported secondary SNI", async () => {\n'''
          addition = '''  it("redacts identifier-shaped identity type codes from diagnostics", async () => {\n    const { query } = createSqlMock();\n    mocks.getSql.mockReturnValue(query);\n    const warn = vi.spyOn(console, "warn").mockImplementation(() => undefined);\n    vi.stubGlobal("fetch", vi.fn().mockResolvedValue({\n      ok: true,\n      json: async () => ({\n        organisationer: [officialRecord({\n          organisationsidentitet: {\n            identitetsbeteckning: PRIVATE_OFFICIAL,\n            typ: { kod: PRIVATE_OFFICIAL },\n          },\n        })],\n      }),\n    }));\n\n    await expect(onboardOwnerSoleTrader(PRIVATE_INPUT)).rejects.toThrow("sole_trader_source_error");\n    expect(warn).toHaveBeenCalledWith(\n      "Sole-trader official verification failed",\n      expect.objectContaining({\n        reason: "no_identity_match",\n        identityStates: ["matches_requested"],\n        identityTypeStates: ["other"],\n        identityTypeCodes: ["REDACTED"],\n      }),\n    );\n    const logged = JSON.stringify(warn.mock.calls);\n    expect(logged).not.toContain(PRIVATE_INPUT);\n    expect(logged).not.toContain(PRIVATE_OFFICIAL);\n    expect(query.transaction).not.toHaveBeenCalled();\n  });\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit('test insertion anchor not found exactly once')
          test.write_text(t.replace(anchor, addition + anchor, 1))
          PY
          rm .github/workflows/temp-sole-trader-type-code-diagnostic.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/company-directory-sole-trader-owner.ts tests/company-directory-sole-trader-owner.test.ts .github/workflows/temp-sole-trader-type-code-diagnostic.yml
          git commit -m 'Redact identifier-shaped sole-trader type codes'
          git push origin HEAD:work/proffera-sole-trader-type-code-diagnostic
