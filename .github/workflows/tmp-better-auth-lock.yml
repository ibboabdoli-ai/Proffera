name: Temporary Better Auth lock regeneration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tmp-better-auth-lock.yml"

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.head_ref == 'work/proffera-better-auth-1-6-22'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pin npm used by this maintenance track
        run: npm install --global npm@11.18.0

      - name: Regenerate package lock normally
        run: npm install better-auth@1.6.22 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify direct target and report semantic lock delta
        env:
          BASE_SHA: ddd46c66b3d3064624b3735c6baeb15e20cfc726
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const base = JSON.parse(execFileSync('git', ['show', `${process.env.BASE_SHA}:package-lock.json`], { encoding: 'utf8' }));
          const head = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          if (pkg.dependencies?.['better-auth'] !== '1.6.22') {
            throw new Error(`package.json better-auth target is ${pkg.dependencies?.['better-auth']}`);
          }
          if (head.packages?.['']?.dependencies?.['better-auth'] !== '1.6.22') {
            throw new Error(`lock root better-auth target is ${head.packages?.['']?.dependencies?.['better-auth']}`);
          }
          if (head.packages?.['node_modules/better-auth']?.version !== '1.6.22') {
            throw new Error(`installed lock entry is ${head.packages?.['node_modules/better-auth']?.version}`);
          }

          const rootBefore = base.packages?.[''] ?? {};
          const rootAfter = head.packages?.[''] ?? {};
          const rootSections = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies'];
          const rootChanges = [];
          for (const section of rootSections) {
            const a = rootBefore[section] ?? {};
            const b = rootAfter[section] ?? {};
            const keys = [...new Set([...Object.keys(a), ...Object.keys(b)])].sort();
            for (const key of keys) {
              if (a[key] !== b[key]) rootChanges.push({ section, name: key, before: a[key] ?? null, after: b[key] ?? null });
            }
          }

          if (rootChanges.length !== 1 || rootChanges[0].section !== 'dependencies' || rootChanges[0].name !== 'better-auth' || rootChanges[0].before !== '1.6.18' || rootChanges[0].after !== '1.6.22') {
            throw new Error(`Unexpected root dependency changes: ${JSON.stringify(rootChanges)}`);
          }

          const entriesBefore = base.packages ?? {};
          const entriesAfter = head.packages ?? {};
          const keys = [...new Set([...Object.keys(entriesBefore), ...Object.keys(entriesAfter)])].sort();
          const changedPackageEntries = keys.filter((key) => JSON.stringify(entriesBefore[key] ?? null) !== JSON.stringify(entriesAfter[key] ?? null));

          console.log('SEMANTIC_ROOT_CHANGES=' + JSON.stringify(rootChanges));
          console.log('SEMANTIC_CHANGED_PACKAGE_ENTRIES=' + JSON.stringify(changedPackageEntries));
          console.log('SEMANTIC_CHANGED_PACKAGE_ENTRY_COUNT=' + changedPackageEntries.length);
          NODE

      - name: Install generated tree
        run: npm ci --no-audit --no-fund

      - name: Run targeted auth configuration tests
        run: npx vitest run tests/auth-origin.test.ts tests/auth-secret.test.ts

      - name: Commit generated lockfile if changed
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches the normally generated target."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for better-auth 1.6.22"
          git push origin "HEAD:${BRANCH}"
